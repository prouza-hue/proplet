name: Apply v3.31.9 release metadata
on:
  push:
    branches: [preview/v3319-today-ia]
    paths: [.github/workflows/apply-v3319-release.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/v3319-today-ia
          fetch-depth: 0
      - name: Patch release metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          app=Path('public/app.js')
          s=app.read_text()
          s=s.replace("const APP_VERSION='3.31.7';", "const APP_VERSION='3.31.9';", 1)
          app.write_text(s)

          server=Path('server.py')
          s=server.read_text()
          s=s.replace('APP_VERSION = "3.31.8"', 'APP_VERSION = "3.31.9"', 1)
          server.write_text(s)

          sw=Path('public/sw.js')
          s=sw.read_text()
          s=s.replace("const CACHE='proplet-v3.31.8-account-profile-r3';", "const CACHE='proplet-v3.31.9-today-release-notes-r1';", 1)
          old="'/account-auth.css','/account-auth.js','/google-g.svg'"
          new="'/account-auth.css','/account-auth.js','/google-g.svg','/today-brand.css','/release-notes.css','/release-notes.js'"
          if old not in s:
              raise SystemExit('SW CORE insertion point not found')
          s=s.replace(old,new,1)
          sw.write_text(s)
          PY
          node --check public/app.js
          node --check public/home-layout.js
          node --check public/release-notes.js
          node --check public/theme-init.js
          python -m py_compile server.py
          git diff --check
      - name: Commit clean release metadata
        run: |
          git config user.name "Proplet Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-v3319-release.yml
          git add public/app.js public/sw.js server.py
          git commit -m "Finalize v3.31.9 release metadata"
          git push origin HEAD:preview/v3319-today-ia
