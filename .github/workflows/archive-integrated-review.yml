name: Integrated Archive review
on:
  pull_request:
    paths:
      - 'public/**'
      - 'content/archives/**'
      - 'tools/build_archive_experience.py'
      - 'tools/archive_integrated_review.py'
      - '.github/workflows/archive-integrated-review.yml'
permissions:
  contents: read
jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'preview/archive-integrated-20261009'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Skip evidence-only commit
        id: scope
        run: |
          git fetch --depth=2 origin "${{ github.event.pull_request.head.sha }}"
          if git diff --name-only HEAD^ HEAD | grep -qvE '^public/(review-evidence/|app/archive/boards\.json$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Build immutable preview data and check syntax
        if: steps.scope.outputs.run == 'true'
        run: |
          python tools/build_archive_experience.py
          python tools/generate_puzzles_bootstrap.py
          node --check public/app/archive/experience.js
          node --check public/app/archive/solution-contract.js
          node --check public/app/archive/preview-isolation.js
          node --check public/app.js
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - run: python tools/archive_integrated_review.py
        if: steps.scope.outputs.run == 'true'
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.run == 'true'
        with:
          name: integrated-archive-review
          path: public/review-evidence/
      - name: Save review evidence
        if: always() && !cancelled() && steps.scope.outputs.run == 'true'
        env:
          PREVIEW_BRANCH: ${{ github.head_ref }}
          TESTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ ! -d public/review-evidence ]; then exit 0; fi
          REMOTE_SHA=$(git ls-remote origin "refs/heads/$PREVIEW_BRANCH" | cut -f1)
          if [ "$REMOTE_SHA" != "$TESTED_SHA" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/review-evidence/
          git add -f public/app/archive/boards.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: capture integrated Proplet review"
          git push origin "HEAD:refs/heads/$PREVIEW_BRANCH"
