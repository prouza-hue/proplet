name: Archive and season visual verification

on:
  pull_request:
    branches: [main]
    paths:
      - public/previews/archive-season-20261004.html
      - public/previews/archive-season-20261004.js
      - tools/verify_archive_season_preview.py
      - .github/workflows/archive-season-preview.yml

permissions:
  contents: read

concurrency:
  group: archive-season-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  browser-verification:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'preview/archive-season-preparation-20261004'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser verification dependency
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Verify prototype with production CSP and save screenshots
        run: python tools/verify_archive_season_preview.py
      - name: Keep rendered evidence on the preparation branch
        env:
          PREVIEW_BRANCH: ${{ github.head_ref }}
          TESTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$PREVIEW_BRANCH" != "preview/archive-season-preparation-20261004" ]; then
            exit 1
          fi
          remote_sha=$(git ls-remote origin "refs/heads/$PREVIEW_BRANCH" | cut -f1)
          if [ "$remote_sha" != "$TESTED_SHA" ]; then
            echo "A newer commit exists; evidence remains in the workflow artifact."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/previews/archive-season-verification/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: record archive and season browser verification"
          git push origin "HEAD:refs/heads/$PREVIEW_BRANCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archive-season-browser-evidence
          path: public/previews/archive-season-verification/
          retention-days: 30
