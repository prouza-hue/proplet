name: Calm modal icon smoke

on:
  push:
    branches: [feature/tajenka-v2-production]
    paths:
      - 'public/calm-mode.svg'
      - 'public/tajenka-runtime-polish.css'
      - '.github/workflows/calm-modal-icon-smoke.yml'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PREVIEW_URL: https://proplet-git-feature-tajenka-v2-pr-7166ab-pavel-prouzas-projects.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Verify dedicated Calm icon across viewports
        shell: bash
        run: |
          cat > /tmp/calm_modal_icon_smoke.py <<'PY'
          import os, time, urllib.request
          from playwright.sync_api import sync_playwright

          url=os.environ['PREVIEW_URL'].rstrip('/')
          deadline=time.time()+150
          while True:
              try:
                  nonce=str(time.time())
                  with urllib.request.urlopen(url+'/tajenka-runtime-polish.css?qa='+nonce,timeout=8) as r:
                      css=r.read().decode('utf-8')
                  with urllib.request.urlopen(url+'/calm-mode.svg?qa='+nonce,timeout=8) as r:
                      svg=r.read().decode('utf-8')
                  if "background:url('/calm-mode.svg')" in css and '<title id="title">Klidný režim</title>' in svg:
                      break
              except Exception:
                  pass
              if time.time()>deadline:
                  raise AssertionError('preview alias did not publish Calm icon assets')
              time.sleep(2)

          chrome=next(p for p in ('/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser') if os.path.exists(p))
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,executable_path=chrome,args=['--no-sandbox','--disable-dev-shm-usage'])
              for width,height in ((390,844),(800,700),(1440,900)):
                  page=browser.new_page(viewport={'width':width,'height':height})
                  page.goto(url+'/?tajenka=1&tajenka_week=1',wait_until='domcontentloaded',timeout=30000)
                  page.evaluate("""()=>{
                    document.documentElement.classList.add('tiskarna-ui');
                    const modal=document.createElement('div');
                    modal.id='calmConfirmModal';
                    modal.className='modal';
                    modal.innerHTML='<div class="modal-card calm-confirm-card"><div class="calm-confirm-icon" aria-hidden="true"><span class="emoji-icon" style="display:grid;width:30px;height:30px">🌿</span></div><h2>Zapnout Klidný režim?</h2></div>';
                    document.body.appendChild(modal);
                  }""")
                  state=page.evaluate("""()=>{
                    const icon=document.querySelector('.calm-confirm-icon');
                    const child=icon.firstElementChild;
                    const before=getComputedStyle(icon,'::before');
                    return {
                      w:icon.getBoundingClientRect().width,
                      h:icon.getBoundingClientRect().height,
                      childDisplay:getComputedStyle(child).display,
                      beforeDisplay:before.display,
                      beforeWidth:before.width,
                      beforeHeight:before.height,
                      beforeBg:before.backgroundImage,
                      fontSize:getComputedStyle(icon).fontSize,
                    };
                  }""")
                  print(width,state)
                  assert state['w']==58 and state['h']==58,state
                  assert state['childDisplay']=='none',state
                  assert state['beforeDisplay']=='block',state
                  assert state['beforeWidth']=='39px' and state['beforeHeight']=='39px',state
                  assert 'calm-mode.svg' in state['beforeBg'],state
                  assert state['fontSize']=='0px',state
                  page.close()
              browser.close()
          PY
          python /tmp/calm_modal_icon_smoke.py
