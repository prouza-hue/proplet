name: Verified client update browser
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/app.js'
      - 'public/sw.js'
      - 'public/app/offline.js'
      - 'public/bootstrap-hydrator.js'
      - 'tests/offline/browser.cjs'
      - 'tests/offline/fixture_server.py'
      - 'tools/test_verified_client_updates.cjs'
      - 'tests/current/test_automatic_updates.js'
      - '.github/workflows/client-update-browser.yml'
  push:
    branches: [main]
    paths:
      - 'public/app.js'
      - 'public/sw.js'
      - 'public/app/offline.js'
      - 'public/bootstrap-hydrator.js'
      - 'tests/offline/browser.cjs'
      - 'tests/offline/fixture_server.py'
      - 'tools/test_verified_client_updates.cjs'
      - '.github/workflows/client-update-browser.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  local-pwa-update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated driver and verify runner Chrome
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm install --prefix /tmp/update-tools --no-save --package-lock=false playwright@1.56.1
          command -v google-chrome
          google-chrome --version
      - name: Verify retries and safe reload with local data only
        env:
          NODE_PATH: /tmp/update-tools/node_modules
          PROPLET_BROWSER_CHANNEL: chrome
        run: |
          node tests/current/test_automatic_updates.js
          node tools/test_verified_client_updates.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify a completely closed installed game without a reachable server
        env:
          NODE_PATH: /tmp/update-tools/node_modules
          OFFLINE_COLD_START_ONLY: '1'
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          CHROMIUM_EXECUTABLE_PATH="$(command -v google-chrome)" node tests/offline/browser.cjs
