name: Current runtime gate

on:
  push:
    branches:
      - main
      - feat/pestre-poradi-production
    paths:
      - '**/*.py'
      - 'content/**'
      - 'data/**'
      - 'public/**'
      - 'vercel.json'
      - 'requirements*.txt'
      - 'SUPABASE*.sql'
      - 'supabase/**'
      - 'docs/SUPABASE_MIGRATION_MANIFEST.md'
      - 'tests/current/**'
      - 'tests/round3/**'
      - 'tools/test_current.py'
      - 'tools/validate_migration_manifest.py'
      - 'tools/test_weekly_team_victories_scheduler.py'
      - '.github/workflows/current-runtime.yml'
  pull_request:
    branches:
      - main
    paths:
      - '**/*.py'
      - 'content/**'
      - 'data/**'
      - 'public/**'
      - 'vercel.json'
      - 'requirements*.txt'
      - 'SUPABASE*.sql'
      - 'supabase/**'
      - 'docs/SUPABASE_MIGRATION_MANIFEST.md'
      - 'tests/current/**'
      - 'tests/round3/**'
      - 'tools/test_current.py'
      - 'tools/validate_migration_manifest.py'
      - 'tools/test_weekly_team_victories_scheduler.py'
      - '.github/workflows/current-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install current test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run current runtime gate
        run: python tools/test_current.py
      - name: Scheduled playtest boundary and client transition
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/round3 -v
          node tests/round3/test_transition.cjs

  isolated-result-database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: proplet_test_admin
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U proplet_test_admin -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: python -m pip install -r requirements-dev.txt 'psycopg[binary]==3.3.5'
      - name: Enable real pg_cron in disposable PostgreSQL
        env:
          PG_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec --user root "$PG_TEST_CONTAINER" apt-get update
          docker exec --user root "$PG_TEST_CONTAINER" apt-get install -y --no-install-recommends postgresql-17-cron
          docker exec -i "$PG_TEST_CONTAINER" sh -c 'cat >> "$PGDATA/postgresql.conf"' <<'CONF'
          shared_preload_libraries = 'pg_cron'
          cron.database_name = 'proplet_test_ci_cron'
          cron.use_background_workers = on
          CONF
          docker restart "$PG_TEST_CONTAINER"
          for attempt in {1..30}; do
            if docker exec "$PG_TEST_CONTAINER" pg_isready -U proplet_test_admin -d postgres; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Test real SQL with synthetic players only
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; Path('/tmp/proplet-test-password').write_text('local-test-only')"
          python tools/test_isolated_result_db.py --password-file /tmp/proplet-test-password --output /tmp/proplet-isolated-results.json --database-name proplet_test_ci_cron
          python tools/test_historical_free_rewards_db.py --database-report /tmp/proplet-isolated-results.json --password-file /tmp/proplet-test-password --output /tmp/proplet-historical-rewards.json
          python tools/test_mk3_release_db.py --database-report /tmp/proplet-isolated-results.json --password-file /tmp/proplet-test-password
          python tools/test_mk3_release_http_db.py --database-report /tmp/proplet-isolated-results.json --password-file /tmp/proplet-test-password
          python tools/test_account_created_db.py --database-report /tmp/proplet-isolated-results.json --password-file /tmp/proplet-test-password --output /tmp/proplet-account-created.json
          python tools/test_usage_auth_db.py --database-report /tmp/proplet-isolated-results.json --password-file /tmp/proplet-test-password --output /tmp/proplet-usage-auth.json
          python tools/test_funnel_sql.py --database-report /tmp/proplet-isolated-results.json --password-file /tmp/proplet-test-password
          python tools/test_fair_play_db.py --database-report /tmp/proplet-isolated-results.json --password-file /tmp/proplet-test-password
          python tools/test_fair_play_http.py --database-report /tmp/proplet-isolated-results.json --password-file /tmp/proplet-test-password
          python tools/test_free_order_db.py --database-report /tmp/proplet-isolated-results.json --password-file /tmp/proplet-test-password
          python tools/test_mozkokalypsa_http_db.py --database-report /tmp/proplet-isolated-results.json --password-file /tmp/proplet-test-password
      - name: Verify actual scheduler and background execution
        env:
          PG_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker restart "$PG_TEST_CONTAINER"
          for attempt in {1..30}; do
            if docker exec "$PG_TEST_CONTAINER" pg_isready -U proplet_test_admin -d proplet_test_ci_cron; then
              break
            fi
            sleep 1
          done
          python tools/test_weekly_team_victories_scheduler.py --database-report /tmp/proplet-isolated-results.json --password-file /tmp/proplet-test-password
