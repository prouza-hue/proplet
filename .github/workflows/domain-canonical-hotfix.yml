name: Domain canonical hotfix

on:
  push:
    branches:
      - preview/v3321-domain-canonical

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/v3321-domain-canonical
          fetch-depth: 0
      - name: Replace legacy public URLs
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          s = p.read_text()
          old = 'https://proplet-nine.vercel.app'
          new = 'https://hrajproplet.cz'
          count = s.count(old)
          if count != 4:
              raise SystemExit(f'Expected exactly 4 legacy metadata URLs, found {count}')
          p.write_text(s.replace(old, new))
          PY
          git diff --check
          git diff -- public/index.html
      - name: Commit patch
        run: |
          git config user.name "Proplet Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/index.html
          git commit -m "Point canonical and social metadata to hrajproplet.cz"
          git push origin HEAD:preview/v3321-domain-canonical
