name: Gen6 interwoven private preview
on:
  push:
    branches: ['preview/gen6-interwoven-20260927']
    paths: ['.github/workflows/gen6-interwoven-qa.yml']
permissions:
  contents: read
concurrency:
  group: gen6-interwoven-private
  cancel-in-progress: false
jobs:
  package:
    if: github.ref == 'refs/heads/preview/gen6-interwoven-20260927'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/gen6-interwoven-20260927
          fetch-depth: 30
      - uses: actions/download-artifact@v4
        with:
          name: gen6-interwoven-acceptance
          run-id: 36339549061
          github-token: ${{ github.token }}
          path: /tmp/proven-interwoven
      - name: Restore the exact reviewed source and proven output
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import base64,hashlib,json,lzma,subprocess,shutil
          from pathlib import Path
          allowed={'.github/workflows/gen6-interwoven-qa.yml','tools/interwoven-reviewed.patch.xz.b64'}
          changed=set(subprocess.check_output(['git','diff','--name-only','a91a4bd0a63476f711c50ce863df22a72b034cff','HEAD'],text=True).splitlines())
          assert changed<=allowed, changed-allowed
          patch=lzma.decompress(base64.b64decode(Path('tools/interwoven-reviewed.patch.xz.b64').read_text()))
          assert hashlib.sha256(patch).hexdigest()=='f1ff11f3d7a2de231c9e4a1ac36f9cf9e11f8f1f58dd962fbe10af0f3b0117f5'
          Path('/tmp/interwoven.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/interwoven.patch'],check=True)
          subprocess.run(['git','apply','/tmp/interwoven.patch'],check=True)
          evidence=Path('/tmp/proven-interwoven')
          report=json.loads((evidence/'browser/report.json').read_text())
          assert report['status']=='PASS' and not report['errors']
          assert report['completedThroughPointer']==[f'mk3w2-{i:02d}' for i in range(1,9)]
          bank=json.loads((evidence/'bank.json').read_text())
          assert bank['contentHash']=='b6bfe8034861ad3cad0d3d9057658b046ea85ef172579229da60ab5dd7cdc42f'
          for n in ['bank.json','verification.json','lexical-review.json']:
              shutil.copy2(evidence/n,Path('content/gen6/round3-interwoven')/n)
          report.update(sourceBaseline='a91a4bd0a63476f711c50ce863df22a72b034cff',bankContentHash=bank['contentHash'],runUrl='https://github.com/prouza-hue/proplet/actions/runs/36339549061')
          Path('docs/gen6/INTERWOVEN-BROWSER-QA-20260927.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          p=Path('content/gen6/round3-interwoven/README.md')
          p.write_text(p.read_text()+'\n## Dokončené CI ověření\n\n'+report['runUrl']+' — geometrie i všech osm desek nezávisle reprodukováno, 11 převzatých a 6 nových testů PASS, všech osm nových desek skutečně dohráno pointer tahy. Prošla emulace mobilu/Foldu, nápověda, lupa, Klid, obnova, klávesnice a obě témata na 320/390/768/1440 px. Žádné herní síťové zápisy. Report: `docs/gen6/INTERWOVEN-BROWSER-QA-20260927.json`. Závěrečný push tohoto běhu selhal pouze kvůli chybějícímu oprávnění CI měnit workflow; následné balení přebírá stejný prověřený obsah, nemění workflow a neopakuje hotové browser testy. Emulace není fyzický test telefonu.\n')
          PY
          g++ -O3 -std=c++17 tools/gen6/interwoven_geometry.cpp -o /tmp/proplet-weave
          /tmp/proplet-weave 92720262 30000000 32 > content/gen6/round3-interwoven/geometry-pool.jsonl
          echo '4dea0c78bbb325ae3855f42965416e88cb50ebf55f91e4dac8d6d9f54fba0e5a  content/gen6/round3-interwoven/geometry-pool.jsonl' | sha256sum -c -
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          report=json.loads(Path('content/gen6/round3-interwoven/verification.json').read_text())
          for p,h in report['frozenInputs'].items():
              assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p
          PY
          python tools/build_gen6_interwoven_preview.py > /tmp/new-build.json
          python - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('/tmp/new-build.json').read_text())==json.loads(Path('/tmp/proven-interwoven/build.json').read_text())
          PY
      - name: Commit content only; leave workflow unchanged
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/preview/gen6-interwoven-20260927 | cut -f1)" = "$GITHUB_SHA"
          git rm tools/interwoven-reviewed.patch.xz.b64
          git add content/gen6/round3-interwoven preview/gen6/index.html preview/gen6/preview.js tests/interwoven/test_interwoven.py tools/build_gen6_interwoven_preview.py tools/build_gen6_preview.py tools/gen6/interwoven.py tools/gen6/interwoven_geometry.cpp vercel.json docs/gen6/INTERWOVEN-BROWSER-QA-20260927.json
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: private interwoven eight-board refresh with verified vocabulary, geometry and mouse/touch flow'
          git push origin HEAD:refs/heads/preview/gen6-interwoven-20260927
