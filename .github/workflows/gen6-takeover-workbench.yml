name: Gen6 takeover workbench
on:
  push:
    branches: ['chore/gen6-takeover-workbench-20260927']
    paths: ['.github/workflows/gen6-takeover-workbench.yml']
permissions:
  contents: write
jobs:
  controls:
    if: github.ref == 'refs/heads/chore/gen6-takeover-workbench-20260927'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply only the reviewed control patch on the verified head
        run: |
          set -euo pipefail
          mkdir -p /tmp/gen6-controls
          cp tools/eight-loupe.patch /tmp/eight-loupe.patch
          echo 'a3d094044a45836fafbfc0e1a131e30ea125adfee9d8ca4194ec32f819d8eb1d  /tmp/eight-loupe.patch' | sha256sum -c -
          git fetch origin preview/gen6-lexicon-v3-20260926
          test "$(git rev-parse FETCH_HEAD)" = '12e49780f4c2944b2574254b64d98a9dc0acf580'
          git checkout -B preview/gen6-lexicon-v3-20260926 FETCH_HEAD
          git rev-parse HEAD > /tmp/gen6-controls/BASE_SHA.txt
          git apply --check /tmp/eight-loupe.patch
          git apply /tmp/eight-loupe.patch
          git diff --check
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.gen6.full_catalog import FullCatalog
          report=json.loads(Path('content/gen6/round3-eight/verification.json').read_text())
          assert report['frozenInputs']==FullCatalog().input_hashes(), 'Manufacturing inputs changed'
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'wordfreq==3.1.1' 'playwright==1.55.0'
      - run: python -m playwright install --with-deps chromium
      - name: Rebuild without generating or changing any board
        run: |
          node --check preview/gen6/preview.js
          python tools/build_gen6_eight_preview.py > /tmp/gen6-controls/build.txt
      - name: Phone and Fold touch controls including visible loupe state
        run: python tools/test_gen6_eight_browser.py --touch-only --output /tmp/gen6-controls/browser
      - name: Save the verified preview controls and evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/gen6-controls/browser/report.json').read_text())
          assert r['status']=='PASS' and r['scope']=='touch-controls-only'
          r['ciRun']='https://github.com/prouza-hue/proplet/actions/runs/${{ github.run_id }}'
          r['previousFullAcceptance']='https://github.com/prouza-hue/proplet/actions/runs/36282583649'
          r['bankContentHash']='c21702b15b93f9bfa087b0e6fc6c91a94b8a601f5affc62416520b700a712223'
          Path('docs/gen6/EIGHT-CONTROLS-QA-20260927.json').write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n')
          PY
          git add preview/gen6/index.html preview/gen6/preview.js tools/test_gen6_eight_browser.py content/gen6/round3-eight/README.md docs/gen6/EIGHT-CONTROLS-QA-20260927.json
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: mirror native magnifier icon and state in verified phone and Fold preview'
          git push origin HEAD:refs/heads/preview/gen6-lexicon-v3-20260926
          git rev-parse HEAD > /tmp/gen6-controls/COMMITTED_SHA.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gen6-eight-controls
          path: /tmp/gen6-controls
          retention-days: 7
