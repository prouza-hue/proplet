name: Mozkokalypsa invitation workbench
on:
  push:
    branches: ['feat/mozkokalypsa-round2-invite']
    paths: ['.github/workflows/mk-invite-workbench.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/mozkokalypsa-round2-invite'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mozkokalypsa-round2-invite
      - name: Verify and apply the reviewed patch
        run: |
          python - <<'PY'
          import base64,hashlib,lzma
          from pathlib import Path
          patch=lzma.decompress(base64.b64decode(Path('tools/mk-invite-patch.xz.b64').read_text()))
          assert hashlib.sha256(patch).hexdigest()=='196b2a4870c4e37fe863ef886f596f398761868c220fd8241cef4a9afc5de32d'
          Path('/tmp/invite.patch').write_bytes(patch)
          PY
          git apply --unidiff-zero --check /tmp/invite.patch
          git apply --unidiff-zero /tmp/invite.patch
          node --check public/app/mozkokalypsa.js
          node tests/current/test_mozkokalypsa.js
          node tests/current/test_mozkokalypsa_adapter.js
          node tests/current/test_mozkokalypsa_countdown.js
      - name: Commit only the reviewed application and test files
        run: |
          git add backend/config.py backend/mozkokalypsa.py public/app.js public/app/mozkokalypsa.js public/index.html public/mozkokalypsa.css public/sw.js tests/current/test_mozkokalypsa_countdown.js tools/test_mozkokalypsa_invite_browser.py tools/test_v4001_pwa_startup.py tools/test_v40124_supabase_rpc_auth.py tools/test_v40126_push_retention_p0.py tools/test_v40133_sync_quarantine.py tools/test_v40135_profile_wide_layout.py
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: distinct second-round invitation with server-aligned live countdown'
          git push origin HEAD:refs/heads/feat/mozkokalypsa-round2-invite
