name: Mozkokalypsa III native preview
on:
  push:
    branches: ['preview/mozkokalypsa3-in-game-20260928']
    paths: ['backend/mozkokalypsa*.py', 'backend/config.py', 'server.py', 'public/app/mozkokalypsa.js', 'public/mozkokalypsa.css', 'public/index.html', 'data/playtests/mozkokalypsa-v3-preview.json', 'tools/test_mk3_native*', 'vercel.json']
permissions:
  contents: read
concurrency:
  group: mk3-native-private
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt 'playwright==1.55.0'
      - run: python -m playwright install --with-deps chromium
      - run: python tools/test_mk3_native_preview.py
      - run: node tests/current/test_mozkokalypsa_adapter.js && node tests/current/test_mozkokalypsa_countdown.js
      - name: Native browser flow with local-only data
        env:
          VERCEL_ENV: preview
          VERCEL_GIT_COMMIT_REF: preview/mozkokalypsa3-in-game-20260928
          SUPABASE_URL: ''
          SUPABASE_SECRET_KEY: ''
        run: |
          set -euo pipefail
          python -m uvicorn server:app --host 127.0.0.1 --port 8765 >/tmp/mk3-server.txt 2>&1 &
          for i in $(seq 1 30); do curl -sf 'http://127.0.0.1:8765/api/mozkokalypsa/status?qa=true' >/dev/null && break; sleep 1; done
          python tools/test_mk3_native_browser.py --output /tmp/mk3-native-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mk3-native-browser
          path: /tmp/mk3-native-browser
          retention-days: 7
