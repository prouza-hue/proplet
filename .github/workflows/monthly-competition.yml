name: Monthly competition integrity
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/monthly_competition.py'
      - 'supabase/migrations/*monthly_competition.sql'
      - 'tools/test_monthly_competition_db.py'
      - 'tests/current/test_monthly_competition*'
      - '.github/workflows/monthly-competition.yml'
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: proplet_test_admin
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: postgres
        ports: ['55432:5432']
        options: --health-cmd "pg_isready -U proplet_test_admin -d postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt 'psycopg[binary]==3.3.5'
      - name: Real atomic results and race-safe monthly closure
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; Path('/tmp/monthly-test-password').write_text('local-test-only')"
          python tools/test_monthly_competition_db.py --password-file /tmp/monthly-test-password --output /tmp/monthly-database.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monthly-competition-integrity
          path: /tmp/monthly-database.json
          retention-days: 7
