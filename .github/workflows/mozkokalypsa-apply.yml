name: Mozkokalypsa isolated acceptance
on:
  push:
    branches: [feat/mozkokalypsa-playtest]
    paths: [.github/workflows/mozkokalypsa-apply.yml]
permissions:
  contents: write
concurrency:
  group: mozkokalypsa-isolated-acceptance
  cancel-in-progress: true
jobs:
  prepare-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: proplet_test_admin
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: postgres
        ports: ['55432:5432']
        options: --health-cmd "pg_isready -U proplet_test_admin -d postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Final narrow repairs on authoring branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'feat/mozkokalypsa-playtest'
          test "$(git rev-parse HEAD^)" = '50353bfb72ea1f378c76055b344373b2121ddb7b'
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/test_v40135_profile_wide_layout.py');s=p.read_text();assert 'theme-init.js?v=todaymoz1' in s;p.write_text(s.replace('theme-init.js?v=todaymoz1','theme-init.js?v=mkpilot3'))
          p=Path('public/app/mozkokalypsa.js');s=p.read_text();s=s.replace(' launching=true;',' const owner=scope(),qa=!!status.qa;\n launching=true;',1)
          old="  const response=await request(status.qa?`/board/${id}?qa=true`:`/open/${id}`,status.qa?{}:{method:'POST'});"
          new="  if(owner!==scope()||!status?.eligible)return;\n  const response=await request(qa?`/board/${id}?qa=true`:`/open/${id}`,qa?{}:{method:'POST'});\n  if(owner!==scope()||statusScope!==owner)return;"
          assert old in s;s=s.replace(old,new);p.write_text(s)
          p=Path('public/mozkokalypsa.css');s=p.read_text();s+='\n/* Scoped overrides of the legacy printshop card/button rules. */\nhtml.tiskarna-ui #screen-daily #mozkokalypsaInvite{background:var(--mk-wash)!important;border-left:4px solid var(--mk-ink)!important}\nhtml.tiskarna-ui #screen-daily #mozkokalypsaInvite .primary-btn{background:#733F57!important;color:#FFF8EF!important;box-shadow:0 3px 0 #4B293C!important}\nhtml.tiskarna-ui[data-theme=dark] #screen-daily #mozkokalypsaInvite .primary-btn{background:#BF8198!important;color:#231E2D!important;box-shadow:0 3px 0 #674152!important}\n';p.write_text(s)
          p=Path('tools/test_mozkokalypsa_browser.py');s=p.read_text();old="  page.screenshot(path=str(args.output/'01-invite-mobile.png'),full_page=True)";new=old+"\n  page.evaluate(\"document.documentElement.dataset.theme='dark'\")\n  page.screenshot(path=str(args.output/'01b-invite-dark-mobile.png'),full_page=True)\n  page.evaluate(\"document.documentElement.dataset.theme='light'\")";assert old in s;s=s.replace(old,new);p.write_text(s)
          PY
          git diff --check
          git add . ':!.github/workflows'
          git -c user.name='prouza-hue' -c user.email='prouza@gmail.com' commit -m 'fix: finalize pilot cache assertion, account boundary and scoped colors'
          git push origin HEAD:feat/mozkokalypsa-playtest
          mkdir -p /tmp/mk-evidence
          git rev-parse HEAD > /tmp/mk-evidence/SOURCE_SHA.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt 'psycopg[binary]==3.3.5' 'playwright==1.55.0'
      - name: Current runtime regression
        run: |
          set -euo pipefail
          python tools/test_current.py | tee /tmp/mk-evidence/runtime.txt
      - name: Isolated database permissions and concurrency
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python tools/test_mozkokalypsa_db.py | tee /tmp/mk-evidence/database.txt
      - name: Install browser
        if: ${{ !cancelled() }}
        run: python -m playwright install --with-deps chromium
      - name: Native browser walkthrough without production credentials
        if: ${{ !cancelled() }}
        env:
          PROPLET_PLAYTEST_LOCAL_QA: 'true'
          SUPABASE_URL: ''
          SUPABASE_SECRET_KEY: ''
        run: |
          set -euo pipefail
          python -m uvicorn server:app --host 127.0.0.1 --port 8765 > /tmp/mk-evidence/server.txt 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/api/health >/dev/null && break; sleep 1; done
          python tools/test_mozkokalypsa_browser.py --output /tmp/mk-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mozkokalypsa-acceptance
          path: /tmp/mk-evidence
          retention-days: 7
