name: Mozkokalypsa isolated acceptance
on:
  push:
    branches: [feat/mozkokalypsa-playtest]
    paths: [.github/workflows/mozkokalypsa-apply.yml]
permissions:
  contents: write
concurrency:
  group: mozkokalypsa-isolated-acceptance
  cancel-in-progress: true
jobs:
  prepare-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: proplet_test_admin
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: postgres
        ports: ['55432:5432']
        options: --health-cmd "pg_isready -U proplet_test_admin -d postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply checked stabilization patch only to authoring branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'feat/mozkokalypsa-playtest'
          test "$(git rev-parse HEAD^)" = '7caf5a15da5b8ed46fe618f5e2c57e5bf1958049'
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, urllib.request
          chunks = ['dc4157be3a94fee6f7afc14264178a581a3c7f24','4a91f9b220def1cbc6d3d1d7c9f3cce952554764']
          encoded = b''
          for sha in chunks:
              req=urllib.request.Request('https://api.github.com/repos/prouza-hue/proplet/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as response: item=json.load(response)
              encoded += base64.b64decode(item['content'])
          patch=lzma.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest()=='42ebf81625e0785257cc5855ba84ff0f99594494863f524b4a5f4f647d39e1da'
          pathlib.Path('/tmp/mozkokalypsa-fix.patch').write_bytes(patch)
          PY
          git apply --check --unidiff-zero /tmp/mozkokalypsa-fix.patch
          git apply --unidiff-zero /tmp/mozkokalypsa-fix.patch
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt 'psycopg[binary]==3.3.5' 'playwright==1.55.0' 'Pillow==11.3.0' 'numpy==2.2.6'
      - name: Build icon and freeze verified source
        run: |
          set -euo pipefail
          python tools/generate_mozkokalypsa_icon.py
          git diff --check
          git add . ':!.github/workflows'
          git -c user.name='prouza-hue' -c user.email='prouza@gmail.com' commit -m 'fix: stabilize Mozkokalypsa invite, sync and printshop identity'
          git push origin HEAD:feat/mozkokalypsa-playtest
          mkdir -p /tmp/mk-evidence
          git rev-parse HEAD > /tmp/mk-evidence/SOURCE_SHA.txt
      - name: Current runtime regression
        run: |
          set -euo pipefail
          python tools/test_current.py | tee /tmp/mk-evidence/runtime.txt
      - name: Isolated database permissions and concurrency
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python tools/test_mozkokalypsa_db.py | tee /tmp/mk-evidence/database.txt
      - run: python -m playwright install --with-deps chromium
      - name: Native browser walkthrough without production credentials
        env:
          PROPLET_PLAYTEST_LOCAL_QA: 'true'
          SUPABASE_URL: ''
          SUPABASE_SECRET_KEY: ''
        run: |
          set -euo pipefail
          python -m uvicorn server:app --host 127.0.0.1 --port 8765 > /tmp/mk-evidence/server.txt 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/api/health >/dev/null && break; sleep 1; done
          python tools/test_mozkokalypsa_browser.py --output /tmp/mk-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mozkokalypsa-acceptance
          path: /tmp/mk-evidence
          retention-days: 7
