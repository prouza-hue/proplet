name: Mozkokalypsa isolated acceptance
on:
  push:
    branches: [feat/mozkokalypsa-playtest]
    paths: [.github/workflows/mozkokalypsa-apply.yml]
permissions:
  contents: write
concurrency:
  group: mozkokalypsa-isolated-acceptance
  cancel-in-progress: true
jobs:
  prepare-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: proplet_test_admin
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: postgres
        ports: ['55432:5432']
        options: --health-cmd "pg_isready -U proplet_test_admin -d postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Scope board assertions and disable unprovisioned production pilot
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'feat/mozkokalypsa-playtest'
          test "$(git rev-parse HEAD^)" = 'ffabeb9669b58a99d98ab8e6bd191ea35a63ff85'
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('tools/test_mozkokalypsa_browser.py');s=p.read_text();assert "page.locator('.cell').count()" in s;s=s.replace("page.locator('.cell').count()","page.locator('#board > .cell').count()").replace("f'.cell[data-index=","f'#board > .cell[data-index=");p.write_text(s)
          p=Path('vercel.json');data=json.loads(p.read_text());data['env']['PROPLET_MOZKOKALYPSA_ENABLED']='false';p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          p=Path('docs/playtests/MOZKOKALYPSA-20260922.md');s=p.read_text();s+='\n## Produkční blokace — 22. 9. 2026, 21:20 UTC\nSupabase apply_migration byl odmítnut bezpečnostní kontrolou konektoru OpenAI. Následná read-only kontrola potvrdila, že všechny tři nové tabulky stále neexistují. Migrace nebyla provedena jiným kanálem, žádné pozvánky nebyly vloženy. Produkční přepínač je proto výslovně false; nenahradit tento stav tvrzením, že hráčský playtest běží. Preview QA zůstává read-only a dostupné.\n';p.write_text(s)
          PY
          git diff --check
          git add . ':!.github/workflows'
          git -c user.name='prouza-hue' -c user.email='prouza@gmail.com' commit -m 'test: complete native pilot checks; keep production activation safely off'
          git push origin HEAD:feat/mozkokalypsa-playtest
          mkdir -p /tmp/mk-evidence
          git rev-parse HEAD > /tmp/mk-evidence/SOURCE_SHA.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt 'psycopg[binary]==3.3.5' 'playwright==1.55.0'
      - name: Current runtime regression
        run: |
          set -euo pipefail
          python tools/test_current.py | tee /tmp/mk-evidence/runtime.txt
      - name: Isolated database permissions and concurrency
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python tools/test_mozkokalypsa_db.py | tee /tmp/mk-evidence/database.txt
      - name: Install browser
        if: ${{ !cancelled() }}
        run: python -m playwright install --with-deps chromium
      - name: Native browser walkthrough without production credentials
        if: ${{ !cancelled() }}
        env:
          PROPLET_PLAYTEST_LOCAL_QA: 'true'
          VERCEL_ENV: preview
          VERCEL_GIT_COMMIT_REF: feat/mozkokalypsa-playtest
          SUPABASE_URL: ''
          SUPABASE_SECRET_KEY: ''
        run: |
          set -euo pipefail
          python -m uvicorn server:app --host 127.0.0.1 --port 8765 > /tmp/mk-evidence/server.txt 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/api/health >/dev/null && break; sleep 1; done
          python tools/test_mozkokalypsa_browser.py --output /tmp/mk-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mozkokalypsa-acceptance
          path: /tmp/mk-evidence
          retention-days: 7
