name: Mozkokalypsa isolated acceptance
on:
  push:
    branches: [feat/mozkokalypsa-playtest]
    paths: [.github/workflows/mozkokalypsa-apply.yml]
permissions:
  contents: write
concurrency:
  group: mozkokalypsa-isolated-acceptance
  cancel-in-progress: true
jobs:
  prepare-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: proplet_test_admin
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: postgres
        ports: ['55432:5432']
        options: --health-cmd "pg_isready -U proplet_test_admin -d postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Keep help available across pilot boards
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'feat/mozkokalypsa-playtest'
          test "$(git rev-parse HEAD^)" = '19ff7205a9c5b7c3994ed223c21da93a1704c126'
          python - <<'PY'
          from pathlib import Path
          p=Path('public/quality-v334-core-v40114.js');s=p.read_text()
          old="  document.body.classList.toggle('calm-run-v334',calm);\n  const btn=q('#calmRunBtn');"
          new="  document.body.classList.toggle('calm-run-v334',calm);\n  if(eligible&&!calm&&g.mode==='playtest')ensureCalmRunButton();\n  const btn=q('#calmRunBtn');"
          assert old in s;s=s.replace(old,new)
          old="  q('#calmConfirmModal')?.classList.remove('hidden');setTimeout(()=>q('#confirmCalmBtn')?.focus(),0);"
          new="  const pilot=kind==='run'&&typeof currentGame!=='undefined'&&currentGame?.mode==='playtest';\n  if(pilot)setText(q('#calmConfirmCopy'),'Časomíru schováme. Čas a použité nápovědy se dál ukládají pro vyhodnocení playtestu.');\n  setText(q('#cancelCalmBtn'),pilot?'Nechat časomíru':'Zůstat soutěžně');\n"+old
          assert old in s;s=s.replace(old,new);p.write_text(s)
          p=Path('tools/test_mozkokalypsa_browser.py');s=p.read_text()
          old="    page.screenshot(path=str(args.output/'02-full-board-mobile.png'),full_page=True)"
          new="    page.locator('#calmRunBtn:not(.hidden)').wait_for()\n    page.wait_for_timeout(200)\n    report['checks'].append('calm-button-restored-on-next-board')\n"+old
          assert old in s;s=s.replace(old,new)
          old="    page.set_viewport_size({'width':768,'height':1024});page.wait_for_timeout(100)\n    page.screenshot(path=str(args.output/'03-full-board-fold-emulation.png'),full_page=True)"
          new="""    touch=browser.new_context(viewport={'width':768,'height':1024},has_touch=True,is_mobile=True,storage_state=context.storage_state())
              tp=touch.new_page();tp.set_default_timeout(15000)
              tp.on('pageerror',lambda e:report['errors'].append(str(e)))
              tp.on('request',lambda r:requests.append({'url':r.url,'method':r.method}))
              tp.goto(origin+'/?mozkokalypsa=preview',wait_until='domcontentloaded')
              tp.wait_for_function('!!puzzleDB && document.documentElement.classList.contains("proplet-current-ui-ready")')
              tp.locator('#mkInviteButton').click();tp.locator('#mkBoardList button').nth(1).click()
              tp.wait_for_function("currentGame?.mode==='playtest' && document.body.classList.contains('game-tablet-portrait')")
              tp.wait_for_timeout(250)
              assert tp.evaluate('document.documentElement.scrollWidth<=innerWidth+1')
              tp.screenshot(path=str(args.output/'03-full-board-fold-emulation.png'),full_page=True)
              report['checks'].append('touch-fold-portrait-rail')
              touch.close();page.bring_to_front()
              page.wait_for_function('currentGame.pausedAt===null')"""
          new='\n'.join('    '+line[14:] if line.startswith('              ') else line for line in new.splitlines())
          assert old in s;s=s.replace(old,new);p.write_text(s)
          for root in ('public','tests/current','tools'):
              for p in Path(root).rglob('*'):
                  if p.is_file() and p.suffix in ('.js','.py','.html'):
                      s=p.read_text();updated=s.replace('mkpilot3','mkpilot4')
                      if updated!=s:p.write_text(updated)
          PY
          git diff --check
          git add . ':!.github/workflows'
          git -c user.name='prouza-hue' -c user.email='prouza@gmail.com' commit -m 'fix: preserve pilot calm controls between boards and verify touch rail'
          git push origin HEAD:feat/mozkokalypsa-playtest
          mkdir -p /tmp/mk-evidence
          git rev-parse HEAD > /tmp/mk-evidence/SOURCE_SHA.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt 'psycopg[binary]==3.3.5' 'playwright==1.55.0'
      - name: Current runtime regression
        run: |
          set -euo pipefail
          python tools/test_current.py | tee /tmp/mk-evidence/runtime.txt
      - name: Isolated database permissions and concurrency
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python tools/test_mozkokalypsa_db.py | tee /tmp/mk-evidence/database.txt
      - name: Install browser
        if: ${{ !cancelled() }}
        run: python -m playwright install --with-deps chromium
      - name: Native browser walkthrough without production credentials
        if: ${{ !cancelled() }}
        env:
          PROPLET_PLAYTEST_LOCAL_QA: 'true'
          VERCEL_ENV: preview
          VERCEL_GIT_COMMIT_REF: feat/mozkokalypsa-playtest
          SUPABASE_URL: ''
          SUPABASE_SECRET_KEY: ''
        run: |
          set -euo pipefail
          python -m uvicorn server:app --host 127.0.0.1 --port 8765 > /tmp/mk-evidence/server.txt 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/api/health >/dev/null && break; sleep 1; done
          python tools/test_mozkokalypsa_browser.py --output /tmp/mk-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mozkokalypsa-acceptance
          path: /tmp/mk-evidence
          retention-days: 7
