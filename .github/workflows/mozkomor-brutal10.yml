name: Mozkomor brutal10 playtest

on:
  pull_request:
    branches:
      - main
    paths:
      - 'tools/generate_mozkomor_brutal10.py'
      - 'data/gen4_profiles_v334.json'
      - '.github/workflows/mozkomor-brutal10.yml'

permissions:
  contents: write

concurrency:
  group: mozkomor-brutal10-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: ${{ github.head_ref == 'agent/v40129-mozkomor-brutal10' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate 10 brutal Mozkomor candidates
        run: |
          mkdir -p /tmp/mozkomor-brutal10
          python tools/generate_mozkomor_brutal10.py \
            --count 10 \
            --start-level 1 \
            --seed 2026082801 \
            --output /tmp/mozkomor-brutal10/bank.json

      - name: Validate Gen4 candidate structure
        run: |
          python tools/validate_gen4_release.py /tmp/mozkomor-brutal10/bank.json \
            --profiles data/gen4_profiles_v334.json \
            --exclusions data/target_generation_exclusions_v334.json \
            --report /tmp/mozkomor-brutal10/validation.json

      - name: Audit brutality and vocabulary
        run: |
          python - <<'PY'
          import json, sys
          from collections import Counter, deque
          from pathlib import Path
          from statistics import median

          sys.path.insert(0, 'tools')
          from validate_gen4_release import canonical_hash

          generated=json.loads(Path('/tmp/mozkomor-brutal10/bank.json').read_text(encoding='utf-8'))
          prod=json.loads(Path('data/puzzles.json').read_text(encoding='utf-8'))
          tiers=json.loads(Path('data/answer_tiers.json').read_text(encoding='utf-8')).get('tiers') or {}
          tier_of={str(w).casefold():tier for tier,words in tiers.items() for w in words}
          puzzles=list(generated.get('puzzles') or [])
          assert len(puzzles)==10
          assert [p['id'] for p in puzzles]==[f'g4-mt-{i:03d}' for i in range(1,11)]
          assert all(p.get('difficulty')=='mozkomor' for p in puzzles)

          existing=[
              p for bank in (prod.get('free') or {}).values() for p in (bank or [])
          ]+list(prod.get('daily') or [])+list(prod.get('rescue') or [])
          existing_hashes={canonical_hash(p) for p in existing}
          hashes=[canonical_hash(p) for p in puzzles]
          assert len(set(hashes))==10
          assert not (set(hashes)&existing_hashes)

          current_mozkomor_words={
              str(a.get('word') or '').casefold()
              for p in (prod.get('free') or {}).get('mozkomor') or []
              for a in p.get('answers') or []
          }
          candidate_words={
              str(a.get('word') or '').casefold()
              for p in puzzles for a in p.get('answers') or []
          }
          overlap=sorted(candidate_words&current_mozkomor_words)
          assert not overlap, overlap[:10]

          history=deque(maxlen=12)
          hardcore=list((prod.get('free') or {}).get('hardcore') or [])
          for p in hardcore[-12:]:
              history.append({str(a.get('word') or '').casefold() for a in p.get('answers') or []})
          cooldown=[]
          for level,p in enumerate(puzzles,1):
              words={str(a.get('word') or '').casefold() for a in p.get('answers') or []}
              blocked=set().union(*history) if history else set()
              if words&blocked:
                  cooldown.append({'level':level,'words':sorted(words&blocked)})
              history.append(words)
          assert not cooldown, cooldown

          rows=[]
          tier_counts=Counter()
          for p in puzzles:
              meta=p.get('meta') or {}
              words=[str(a.get('word') or '').casefold() for a in p.get('answers') or []]
              pt=[tier_of[w] for w in words]
              tier_counts.update(pt)
              assert 'D' not in pt
              assert min(map(len,words))>=6
              assert 80<=len(p.get('mask') or [])<=88
              assert 9<=len(words)<=10
              assert 30.0<=float(meta.get('localAmbiguityScore') or 0)<=70.0
              assert 5.2<=float(meta.get('meanTurns') or 0)<=6.4
              rows.append({
                  'id':p['id'],
                  'level':int(meta['level']),
                  'ambiguity':round(float(meta['localAmbiguityScore']),3),
                  'meanTurns':round(float(meta['meanTurns']),3),
                  'activeCells':len(p.get('mask') or []),
                  'minWordLength':min(map(len,words)),
                  'avgWordLength':round(sum(map(len,words))/len(words),3),
                  'curlPathCount':int(meta.get('curlPathCount') or 0),
                  'maxCurlRun':int(meta.get('maxCurlRun') or 0),
                  'words':words,
              })

          amb=[r['ambiguity'] for r in rows]
          turns=[r['meanTurns'] for r in rows]
          cells=[r['activeCells'] for r in rows]
          assert median(amb)>=30.0
          assert median(turns)>=5.2
          assert median(cells)>=80

          audit={
              'version':1,
              'kind':'mozkomor-brutal10-playtest-audit',
              'profile':'mozkomor-brutal10-v1',
              'count':10,
              'tierCounts':dict(tier_counts),
              'tierDTargets':0,
              'overlapWithCurrentMozkomorTargets':0,
              'duplicateHashesVsActiveGen4':0,
              'transitionCooldownViolations':0,
              'ambiguityMedian':round(median(amb),3),
              'meanTurnsMedian':round(median(turns),3),
              'activeCellsMedian':round(median(cells),3),
              'levels':rows,
          }
          Path('/tmp/mozkomor-brutal10/audit.json').write_text(
              json.dumps(audit,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          print(json.dumps(audit,ensure_ascii=False,indent=2))
          PY

      - name: Bind playtest artifacts only
        run: |
          mkdir -p data/playtests public/playtests data/audits
          cp /tmp/mozkomor-brutal10/bank.json data/playtests/mozkomor_brutal10.json
          cp /tmp/mozkomor-brutal10/bank.json public/playtests/mozkomor-brutal10.json
          cp /tmp/mozkomor-brutal10/audit.json data/audits/mozkomor_brutal10_v1.json

      - uses: actions/upload-artifact@v4
        with:
          name: mozkomor-brutal10
          path: /tmp/mozkomor-brutal10/
          retention-days: 30

      - name: Commit playtest bank back to branch
        run: |
          git config user.name "proplet-playtest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/playtests/mozkomor_brutal10.json public/playtests/mozkomor-brutal10.json data/audits/mozkomor_brutal10_v1.json
          git commit -m "[mozkomor-playtest] Bind brutal 10-level calibration set"
          git push origin "HEAD:${{ github.head_ref }}"
