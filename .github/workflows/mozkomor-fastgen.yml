name: Mozkomor fast parallel generation

on:
  push:
    branches:
      - agent/v40129-mozkomor-fastgen
    paths:
      - 'tools/generate_mozkomor_gen4.py'
      - '.github/workflows/mozkomor-fastgen.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'tools/generate_mozkomor_gen4.py'
      - '.github/workflows/mozkomor-fastgen.yml'

permissions:
  contents: write

concurrency:
  group: mozkomor-fastgen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: ${{ github.event_name == 'push' || startsWith(github.head_ref, 'agent/v40129-mozkomor-fastgen') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 0
            start: 1
            seed: 2026082711
          - shard: 1
            start: 26
            seed: 2026082712
          - shard: 2
            start: 51
            seed: 2026082713
          - shard: 3
            start: 76
            seed: 2026082714
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate partition ${{ matrix.shard }}
        run: |
          mkdir -p /tmp/mozkomor-shard
          python tools/generate_mozkomor_gen4.py \
            --count 25 \
            --start-level '${{ matrix.start }}' \
            --seed '${{ matrix.seed }}' \
            --partition-index '${{ matrix.shard }}' \
            --partition-count 4 \
            --output '/tmp/mozkomor-shard/shard-${{ matrix.shard }}.json'
      - name: Validate shard
        run: |
          python tools/validate_gen4_release.py '/tmp/mozkomor-shard/shard-${{ matrix.shard }}.json' \
            --profiles data/gen4_profiles_v334.json \
            --exclusions data/target_generation_exclusions_v334.json \
            --report '/tmp/mozkomor-shard/shard-${{ matrix.shard }}-validation.json'
      - uses: actions/upload-artifact@v4
        with:
          name: mozkomor-fast-shard-${{ matrix.shard }}
          path: /tmp/mozkomor-shard/
          retention-days: 7

  assemble:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: mozkomor-fast-shard-*
          path: /tmp/mozkomor-shards
          merge-multiple: true
      - name: Assemble and audit 100-board bank
        run: |
          mkdir -p /tmp/mozkomor
          python - <<'PY'
          import json, sys
          from collections import Counter, deque
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from validate_gen4_release import canonical_hash

          files=sorted(Path('/tmp/mozkomor-shards').glob('shard-[0-3].json'))
          assert len(files)==4, files
          payloads=[json.loads(p.read_text(encoding='utf-8')) for p in files]
          puzzles=[p for payload in payloads for p in payload['puzzles']]
          puzzles.sort(key=lambda p:int((p.get('meta') or {}).get('level') or 0))
          assert len(puzzles)==100
          assert [int(p['meta']['level']) for p in puzzles]==list(range(1,101))
          assert len({p['id'] for p in puzzles})==100

          production=json.loads(Path('data/puzzles.json').read_text(encoding='utf-8'))
          existing=[
              p for bank in (production.get('free') or {}).values() for p in (bank or [])
          ]+list(production.get('daily') or [])+list(production.get('rescue') or [])
          old_hashes={canonical_hash(p) for p in existing}
          hashes=[canonical_hash(p) for p in puzzles]
          assert len(set(hashes))==100
          assert not (set(hashes)&old_hashes)

          history=deque(maxlen=12)
          for p in list((production.get('free') or {}).get('hardcore') or [])[-12:]:
              history.append({str(a['word']).casefold() for a in p.get('answers') or []})
          cooldown=[]
          for level,p in enumerate(puzzles,1):
              words={str(a['word']).casefold() for a in p.get('answers') or []}
              blocked=set().union(*history) if history else set()
              overlap=sorted(words&blocked)
              if overlap: cooldown.append({'level':level,'words':overlap})
              history.append(words)
          assert not cooldown, cooldown[:10]

          amb=sorted(float(p['meta']['localAmbiguityScore']) for p in puzzles)
          turns=sorted(float(p['meta']['meanTurns']) for p in puzzles)
          cells=[len(p.get('mask') or []) for p in puzzles]
          words_n=[len(p.get('answers') or []) for p in puzzles]
          tiers=Counter(str(a.get('tier') or '?') for p in puzzles for a in p.get('answers') or [])
          # Answers currently carry tier through the generator on most builds; if not,
          # generator stats below remain the vocabulary source of truth.
          all_answers=sum(words_n)
          d_share=tiers.get('D',0)/all_answers if all_answers else 0
          assert min(amb)>=18.0 and max(amb)<=60.0
          assert min(turns)>=3.8 and max(turns)<=5.3
          assert min(cells)>=72 and max(cells)<=80
          assert min(words_n)>=10 and max(words_n)<=11
          if tiers.get('?',0)==0:
              assert d_share<=0.18+1e-9

          def pct(v,p): return round(v[round((len(v)-1)*p)],3)
          merged={
              'version':1,'kind':'gen4-mozkomor-bank','contentGeneration':4,
              'difficulty':'mozkomor','seedFamily':'2026082711-14',
              'startLevel':1,'targetCooldown':12,
              'unlock':{'difficulty':'hardcore','baseLevels':200},
              'puzzles':puzzles,
          }
          audit={
              'version':1,'kind':'mozkomor-v40129-fastgen-audit','count':100,
              'generation':'4x25 deterministic vocabulary partitions',
              'duplicateBoardHashesVsActiveGen4':0,'transitionCooldownViolations':0,
              'ambiguity':{'min':amb[0],'median':pct(amb,.5),'p75':pct(amb,.75),'p90':pct(amb,.9),'max':amb[-1]},
              'meanTurns':{'min':turns[0],'median':pct(turns,.5),'p90':pct(turns,.9),'max':turns[-1]},
              'activeCells':{'min':min(cells),'max':max(cells)},
              'targetWords':{'min':min(words_n),'max':max(words_n)},
              'tierCountsFromAnswers':dict(tiers),
              'shardStats':[x.get('stats') or {} for x in payloads],
          }
          Path('/tmp/mozkomor/mozkomor.json').write_text(json.dumps(merged,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('/tmp/mozkomor/audit.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(audit,ensure_ascii=False,indent=2))
          PY
      - name: Validate assembled bank
        run: |
          python tools/validate_gen4_release.py /tmp/mozkomor/mozkomor.json \
            --profiles data/gen4_profiles_v334.json \
            --exclusions data/target_generation_exclusions_v334.json \
            --report /tmp/mozkomor/validation.json
      - name: Bind bank to preview runtime
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src=Path('data/puzzles.json')
          data=json.loads(src.read_text(encoding='utf-8'))
          bank=json.loads(Path('/tmp/mozkomor/mozkomor.json').read_text(encoding='utf-8'))
          data.setdefault('free',{})['mozkomor']=bank['puzzles']
          data['mozkomorGeneration']=4
          data['mozkomorUnlock']={'requiresDifficulty':'hardcore','requiresCurrentBaseLevels':200}
          data.setdefault('targetCooldownPolicy',{}).setdefault('free',{})['mozkomor']=12
          rendered=json.dumps(data,ensure_ascii=False,separators=(',',':'))+'\n'
          src.write_text(rendered,encoding='utf-8')
          Path('public/puzzles.json').write_text(rendered,encoding='utf-8')
          Path('data/audits/mozkomor_v40129.json').write_text(Path('/tmp/mozkomor/audit.json').read_text(encoding='utf-8'),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mozkomor-fast-complete
          path: /tmp/mozkomor/
          retention-days: 14
      - name: Commit generated preview bank
        run: |
          git config user.name "proplet-generation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/puzzles.json public/puzzles.json data/audits/mozkomor_v40129.json
          git commit -m "[mozkomor-fastgen] Bind 100 audited endgame levels"
          git push origin HEAD:agent/v40129-mozkomor-fastgen
