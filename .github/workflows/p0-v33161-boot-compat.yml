name: P0 v3.31.6.1 boot compatibility hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p0-v33161-boot-compat.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch atomic puzzle boot compatibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('public/app.js')
          text = app.read_text(encoding='utf-8')
          replacements = [
              ("const APP_VERSION='3.31.6';", "const APP_VERSION='3.31.6.1';"),
              (
                  "const EXPECTED_PUZZLE_DB_VERSION=10;",
                  "const EXPECTED_PUZZLE_DB_VERSION=10;\nconst COMPATIBLE_PUZZLE_DB_VERSIONS=new Set([9,EXPECTED_PUZZLE_DB_VERSION]);\nfunction compatiblePuzzleDatabase(data){return COMPATIBLE_PUZZLE_DB_VERSIONS.has(Number(data?.version||0))}"
              ),
              ("if(data?.version===EXPECTED_PUZZLE_DB_VERSION){", "if(compatiblePuzzleDatabase(data)){"),
              ("if(fresh?.version===EXPECTED_PUZZLE_DB_VERSION){", "if(compatiblePuzzleDatabase(fresh)){"),
              ("if(data?.version!==EXPECTED_PUZZLE_DB_VERSION)throw new Error('puzzle-db-version');", "if(!compatiblePuzzleDatabase(data))throw new Error('puzzle-db-version');"),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'app.js preflight failed: expected exactly one {old!r}, found {count}')
              text = text.replace(old, new, 1)
          app.write_text(text, encoding='utf-8')

          server = Path('server.py')
          text = server.read_text(encoding='utf-8')
          old, new = 'APP_VERSION = "3.31.6"', 'APP_VERSION = "3.31.6.1"'
          if text.count(old) != 1:
              raise SystemExit('server version preflight failed')
          server.write_text(text.replace(old, new, 1), encoding='utf-8')

          sw = Path('public/sw.js')
          text = sw.read_text(encoding='utf-8')
          old = "const CACHE='proplet-v3.31.6-new-player-funnel';"
          new = "const CACHE='proplet-v3.31.6.1-atomic-boot-compat';"
          if text.count(old) != 1:
              raise SystemExit('service worker cache preflight failed')
          sw.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify hotfix
        shell: bash
        run: |
          node --check public/app.js
          python -m py_compile server.py
          python - <<'PY'
          import json
          from pathlib import Path
          app = Path('public/app.js').read_text(encoding='utf-8')
          sw = Path('public/sw.js').read_text(encoding='utf-8')
          public_db = json.loads(Path('public/puzzles.json').read_text(encoding='utf-8'))
          server_db = json.loads(Path('data/puzzles.json').read_text(encoding='utf-8'))
          assert "COMPATIBLE_PUZZLE_DB_VERSIONS=new Set([9,EXPECTED_PUZZLE_DB_VERSION])" in app
          assert "compatiblePuzzleDatabase(data)" in app
          assert "compatiblePuzzleDatabase(fresh)" in app
          assert "!compatiblePuzzleDatabase(data)" in app
          assert "proplet-v3.31.6.1-atomic-boot-compat" in sw
          assert public_db['version'] == 10 == server_db['version']
          assert public_db.get('freeGeneration') == 3 == server_db.get('freeGeneration')
          print('P0 boot compatibility PASS: app accepts schema 9/10; active payload remains schema 10')
          PY

      - name: Commit verified hotfix
        shell: bash
        run: |
          git config user.name 'prouza-hue'
          git config user.email 'prouza@gmail.com'
          git rm .github/workflows/p0-v33161-boot-compat.yml
          git add public/app.js public/sw.js server.py
          git diff --cached --check
          git commit -m 'Proplet v3.31.6.1 atomic puzzle boot hotfix'
          git push origin HEAD:main
