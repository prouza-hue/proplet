name: Preview level detail title fix
on:
  push:
    branches: [family-preview]
permissions:
  contents: write
jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[level-detail-built]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python .release/apply_v3313_level_detail_title.py
      - run: node --check public/app.js
      - run: python -m py_compile server.py
      - name: Validate level detail title invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('public/app.js').read_text(encoding='utf-8')
          sw = Path('public/sw.js').read_text(encoding='utf-8')
          server = Path('server.py').read_text(encoding='utf-8')
          assert "const APP_VERSION='3.31.3-preview.1'" in app
          assert "$('#levelDetailTitle').textContent=`${DIFF[diff].label} ${puzzle.meta?.level||''}`.trim();" in app
          assert "$('#levelDetailTitle').textContent=`${DIFF[diff].icon}" not in app
          assert "reloadOnServiceWorkerChange=false" in app
          assert "if(mode==='starter'){if(action==='menu'){nav('free',{replace:true});return}startDaily();return}" in app
          assert "proplet-v3.31.3-preview.1-level-detail-title" in sw
          assert 'APP_VERSION = "3.31.3-preview.1"' in server
          print('level detail title invariants PASS')
          PY
      - name: Commit built preview
        run: |
          git config user.name "prouza-hue"
          git config user.email "prouza@gmail.com"
          git add public/app.js public/sw.js server.py
          git commit -m "Preview v3.31.3 level detail title [level-detail-built]"
          git push
