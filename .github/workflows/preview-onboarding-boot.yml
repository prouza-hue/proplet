name: Preview onboarding boot fix
on:
  push:
    branches: [family-preview]
permissions:
  contents: write
jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[onboarding-boot-built]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python .release/apply_v3311_boot_fix.py
      - run: node --check public/app.js
      - run: python -m py_compile server.py
      - name: Validate boot invariants
        run: |
          grep -q "const APP_VERSION='3.31.1-preview.1'" public/app.js
          grep -q "let reloadOnServiceWorkerChange=false;" public/app.js
          grep -q "if(!reloadOnServiceWorkerChange||reloading)return" public/app.js
          grep -q "reloadOnServiceWorkerChange=true" public/app.js
          grep -q "const initialRollingContent=refreshRollingContent().catch(()=>null)" public/app.js
          grep -q "initialRollingContent.finally(()=>setTimeout(()=>openOnboarding(false),80))" public/app.js
          grep -q "proplet-v3.31.1-preview.1-onboarding-boot" public/sw.js
          grep -q 'APP_VERSION = "3.31.1-preview.1"' server.py
          grep -q "showPuzzleBootLoading" public/app.js
          grep -q "u.pathname==='/api/rolling-content'||u.pathname==='/puzzles.json'" public/sw.js
      - name: Commit built preview
        run: |
          git config user.name "prouza-hue"
          git config user.email "prouza@gmail.com"
          git add public/app.js public/sw.js server.py
          git commit -m "Preview v3.31.1 onboarding boot fix [onboarding-boot-built]"
          git push
