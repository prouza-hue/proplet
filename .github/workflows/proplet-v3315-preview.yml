name: Build Proplet v3.31.5 preview

on:
  push:
    branches:
      - preview/v3315-new-player-funnel

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/v3315-new-player-funnel
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python scripts/v3315_preview_patch.py
      - name: Validate
        shell: bash
        run: |
          python -m py_compile server.py
          node --check public/app.js
          node --check public/admin.js
          node --check public/sw.js
          git diff --check
          git diff --quiet -- data/puzzles.json public/puzzles.json
          grep -q "caches.match('/puzzles.json')" public/app.js
          grep -q "refresh=fetch(e.request,{cache:'no-store'})" public/sw.js
          grep -q '"newPlayerFunnelVersion": 2' server.py
          grep -q "starter_hard_choice_shown" server.py
          grep -q "onboarding_tutorial_completed" public/app.js
      - name: Commit validated preview
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/proplet-v3315-preview.yml scripts/v3315_preview_patch.py
          git add -A
          git commit -m "Proplet v3.31.5 new player funnel analytics"
          git push origin HEAD:preview/v3315-new-player-funnel
