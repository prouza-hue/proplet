          s = replace_once(s, "let onboardingStep=0;\nlet tutorialState={dragging:false,path:[],done:false};", "let onboardingStep=0;\nlet tutorialState={dragging:false,path:[],done:false};\nlet onboardingTutorialTracked=false;\nlet onboardingSupportTracked=false;", 'onboarding tracking guards')
          s = replace_once(s, "starterHintUsed:false,starterHintOfferShown:false,starterGuidePath:[],undoSnapshot:null};", "starterHintUsed:false,starterHintOfferShown:false,starterTrackedWordCount:0,starterGuidePath:[],undoSnapshot:null};", 'starter word guard')
          s = replace_once(s, "const idle=performance.now()-(g.lastProgressAt||g.start);if(idle<10000)return;g.starterHintOfferShown=true;$('#starterHintNudge')?.classList.remove('hidden');", "const idle=performance.now()-(g.lastProgressAt||g.start);if(idle<10000)return;g.starterHintOfferShown=true;trackProductEvent('starter_hint_offer_shown');$('#starterHintNudge')?.classList.remove('hidden');", 'starter hint offer')
          s = replace_once(s, "if(g.mode==='starter'&&ai>=0)updateStarterGuidance();", "if(g.mode==='starter'&&ai>=0){const n=g.found.length;if(n<=3&&n>g.starterTrackedWordCount){g.starterTrackedWordCount=n;trackProductEvent(`starter_word_${n}_completed`)}updateStarterGuidance()}", 'starter word events')
          s = replace_once(s, "if(!g.found.length){message('Plocha je už prázdná.');return}const usedHints=", "if(!g.found.length){message('Plocha je už prázdná.');return}if(g.mode==='starter')trackProductEvent('starter_reset');const usedHints=", 'starter reset event')
          s = replace_once(s, "onboardingStep=onboardingFocusedHelper?ONBOARD_STEPS.length-1:0;tutorialState={dragging:false,path:[],done:false};const stored=", "onboardingStep=onboardingFocusedHelper?ONBOARD_STEPS.length-1:0;tutorialState={dragging:false,path:[],done:false};onboardingTutorialTracked=false;onboardingSupportTracked=false;const stored=", 'onboarding guard reset')
          s = replace_once(s, "if(ok){tutorialState.done=true;$('#tutorialSuccess').textContent='Jo! 🐶 Slovo může i zatáčet.';", "if(ok){tutorialState.done=true;if(onboardingMandatory&&!onboardingTutorialTracked){onboardingTutorialTracked=true;trackProductEvent('onboarding_tutorial_completed')}$('#tutorialSuccess').textContent='Jo! 🐶 Slovo může i zatáčet.';", 'tutorial completion event')
          s = replace_once(s, "}else{const launchStarter=onboardingMandatory;onboardingMandatory=false;trackProductEvent('onboarding_completed');", "}else{const launchStarter=onboardingMandatory;if(launchStarter&&!onboardingSupportTracked){onboardingSupportTracked=true;trackProductEvent('onboarding_support_selected');trackProductEvent(`onboarding_support_selected_${onboardingSupportMode}`)}onboardingMandatory=false;trackProductEvent('onboarding_completed');", 'support selection event')
          path.write_text(s, encoding='utf-8')

          # ---------- public/admin.js ----------
