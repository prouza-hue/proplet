name: Proplet refinements review

on:
  pull_request:
    branches: [main]
    paths:
      - 'public/app.js'
      - 'public/app/patrons.js'
      - 'public/app/engagement/announcements.js'
      - 'public/patrons.css'
      - 'public/index.html'
      - 'public/app/rankings/**'
      - 'public/app/weekly/**'
      - 'public/app/monthly/**'
      - 'public/monthly-competition.css'
      - 'public/ranking-navigation.css'
      - 'public/app/game/hints.js'
      - 'public/hints-printshop.css'
      - 'public/assets/hints/**'
      - 'public/theme-init.js'
      - 'public/sw.js'
      - 'public/offline-assets.json'
      - 'public/runtime-meta.js'
      - 'public/valid-word-feedback-v3330.js'
      - 'public/recognition/**'
      - 'data/recognition/**'
      - 'content/recognition/**'
      - 'bonus_recognition.py'
      - 'word_recognition_v3330.py'
      - 'tests/current/test_bonus_recognition*'
      - 'tools/build_bonus*'
      - 'tools/build_recognition*'
      - 'tools/refinements-review.js'
      - 'tools/build_refinements_review.py'
      - 'tools/qa_refinements_review.cjs'
      - 'tools/test_rankings_navigation_browser.cjs'
      - 'tools/test_patron_compact_browser.cjs'
      - 'tools/test_support_delivery_browser.cjs'
      - 'tools/competition_ui_visual_qa.cjs'
      - 'tools/browser_fixture_server.cjs'
      - 'tests/fixtures/browser/**'
      - '.github/workflows/refinements-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  isolated-native-browser:
    # Keep the runner compatible with the pinned Playwright browser tooling.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare native shell and isolated review
        env:
          VERCEL_ENV: preview
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python tools/build_runtime_content.py --check
          python tools/generate_puzzles_bootstrap.py
          python tools/build_archive_experience.py
          python tools/build_bonus_recognition.py --check
          python tools/build_refinements_review.py
      - name: Install browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/proplet-refinements-browser" --no-save playwright@1.51.1
          "$RUNNER_TEMP/proplet-refinements-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "PROPLET_PLAYWRIGHT=$RUNNER_TEMP/proplet-refinements-browser/node_modules/playwright" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/proplet-refinements-browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Verify native hints, recognition and long rankings
        run: node tools/qa_refinements_review.cjs
      - name: Verify ranking races, scroll, focus and failures
        if: ${{ !cancelled() }}
        run: node tools/test_rankings_navigation_browser.cjs
      - name: Verify compact support dialog and payment preparation
        if: ${{ !cancelled() }}
        run: node tools/test_patron_compact_browser.cjs
      - name: Verify inline support QR, engagement and confirmed progress
        if: ${{ !cancelled() }}
        run: node tools/test_support_delivery_browser.cjs
      - name: Verify competition views, archive navigation and awards
        if: ${{ !cancelled() }}
        run: node tools/competition_ui_visual_qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refinements-native-browser
          path: |
            artifacts/refinements-review/
            artifacts/ranking-navigation/
            artifacts/patron-compact/
            artifacts/support-inline-qr/
            artifacts/competition-ui/
          retention-days: 7
