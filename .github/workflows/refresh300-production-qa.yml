name: Free-play preferences and history
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/**'
      - 'data/puzzles.json'
      - 'tools/verify_refresh300_production.cjs'
      - 'tools/verify_free_expansion_browser.cjs'
      - 'tools/verify_free_expansion_news_browser.cjs'
      - '.github/workflows/refresh300-production-qa.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser:
    # Keep the runner compatible with the pinned Playwright browser tooling.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: npm install --no-save playwright@1.58.2 && npx playwright install --with-deps chromium
      - name: Run real app with no production credentials
        run: |
          python tools/generate_puzzles_bootstrap.py
          PROPLET_FREE_ORDER_ENABLED=true python -m uvicorn server:app --port 8000 > /tmp/proplet-qa.log 2>&1 &
          for i in {1..30}; do curl -sf http://127.0.0.1:8000/api/config && break; sleep 1; done
          node tools/verify_refresh300_production.cjs
          node tools/verify_free_expansion_browser.cjs
          PROPLET_QA_OUTPUT=qa-free-expansion-news node tools/verify_free_expansion_news_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refresh300-production-qa
          path: |
            qa-refresh300/
            qa-free-expansion/
            qa-free-expansion-news/
            /tmp/proplet-qa.log
