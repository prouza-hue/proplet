name: Refresh 300 production UI
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/**'
      - 'data/puzzles.json'
      - 'tools/verify_refresh300_production.cjs'
      - '.github/workflows/refresh300-production-qa.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: npm install --no-save playwright@1.58.2 && npx playwright install --with-deps chromium
      - name: Run real app with no production credentials
        run: |
          python tools/generate_puzzles_bootstrap.py
          PROPLET_FREE_ORDER_ENABLED=true python -m uvicorn server:app --port 8000 > /tmp/proplet-qa.log 2>&1 &
          for i in {1..30}; do curl -sf http://127.0.0.1:8000/api/config && break; sleep 1; done
          node tools/verify_refresh300_production.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refresh300-production-qa
          path: |
            qa-refresh300/
            /tmp/proplet-qa.log
