name: Sprint 11B.1 temporary browser smoke

on:
  push:
    branches: [refactor/s11b-game-session]
    paths: ['.github/workflows/s11b1-session-smoke-temp.yml']

permissions:
  contents: read

jobs:
  session-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PREVIEW_URL: https://proplet-git-refactor-s11b-game-session-pavel-prouzas-projects.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Verify GameSession, pause/resume, persistence and Fold layout
        shell: bash
        run: |
          cat > /tmp/s11b1_smoke.py <<'PY'
          import os,time,urllib.request
          from playwright.sync_api import sync_playwright

          URL=os.environ['PREVIEW_URL'].rstrip('/')
          CHROME=next(p for p in ('/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser') if os.path.exists(p))

          deadline=time.time()+90
          while True:
              try:
                  state=urllib.request.urlopen(URL+'/app/game/state.js?qa='+str(time.time()),timeout=8).read().decode()
                  app=urllib.request.urlopen(URL+'/app.js?qa='+str(time.time()),timeout=8).read().decode()
                  if 'PropletGameState' in state and "Object.defineProperty(window,'currentGame'" in app and "session.pause(reason" in app: break
              except Exception: pass
              if time.time()>deadline: raise AssertionError('preview alias did not reach Sprint 11B.1')
              time.sleep(2)

          def wait(page,expr,timeout=15000):
              end=time.time()+timeout/1000
              while time.time()<end:
                  try:
                      if page.evaluate(expr): return
                  except Exception: pass
                  time.sleep(.1)
              raise AssertionError('timeout: '+expr)

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,executable_path=CHROME,args=['--no-sandbox','--disable-dev-shm-usage'])
              ctx=browser.new_context(viewport={'width':590,'height':960},screen={'width':384,'height':832},has_touch=True,is_mobile=True,service_workers='block')
              page=ctx.new_page(); errors=[]
              page.on('pageerror',lambda e:errors.append(str(e)))
              page.goto(URL,wait_until='domcontentloaded',timeout=30000)
              wait(page,"typeof startGame==='function' && typeof registerGameSessionHook==='function' && !!puzzleDB?.free?.medium?.[0]")
              page.evaluate("""()=>{
                try{
                  localStorage.setItem('proplet-onboarding-v1','done');
                  localStorage.setItem('proplet-helper-onboarding-v1','done');
                  localStorage.setItem('proplet-calm-mode-v1','1');
                  sessionStorage.setItem('proplet-gen4-release-modal-v1','1');
                }catch(e){}
                document.querySelector('#qualityReleaseModal')?.classList.add('hidden');
                document.querySelector('#onboardingModal')?.classList.add('hidden');
                document.querySelector('.release-notes-v3331-backdrop')?.remove();
                document.documentElement.classList.remove('gen4-preview-booting');
              }""")
              result=page.evaluate("""()=>{
                const p=puzzleDB.free.medium[0];
                startGame(p,'free');
                const d=Object.getOwnPropertyDescriptor(window,'currentGame');
                return {
                  puzzleId:p.id,
                  accessor:!!d?.get&&!!d?.set,
                  mode:currentGame?.mode,
                  calm:currentGame?.calmMode===true,
                  wrapped:!!startGame.__calmWrapped,
                  stateFactory:typeof PropletGameState?.create==='function'
                };
              }""")
              assert result['accessor'] and result['mode']=='free' and result['calm'] and not result['wrapped'] and result['stateFactory'],result
              wait(page,"document.body.classList.contains('playing')")
              page.wait_for_timeout(700)
              layout=page.evaluate("""()=>({
                mode:document.documentElement.dataset.gameLayoutMode,
                orient:document.documentElement.dataset.gameLayoutOrientation,
                device:document.documentElement.dataset.gameLayoutDevice,
                overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
              })""")
              assert layout['mode']=='tablet-portrait-rail' and layout['orient']=='portrait' and layout['device']=='large-touch' and layout['overflow']<=1,layout

              before=page.evaluate("gameElapsed()")
              paused=page.evaluate("pauseGameClock('hidden')")
              page.wait_for_timeout(650)
              frozen=page.evaluate("gameElapsed()")
              assert paused and abs(frozen-before)<30,(before,frozen)
              persisted=page.evaluate("""()=>{
                const key=challengeKey(currentGame.mode,currentGame.puzzle,currentGame.dailyDate);
                const row=getState().inProgress?.[key];
                return row?{elapsedMs:row.elapsedMs,calmMode:row.calmMode===true,puzzleId:row.puzzleId}:null;
              }""")
              assert persisted and persisted['puzzleId']==result['puzzleId'] and persisted['calmMode'],persisted
              resumed=page.evaluate("resumeGameClock()")
              page.wait_for_timeout(400)
              after=page.evaluate("gameElapsed()")
              assert resumed and after>frozen+250,(frozen,after)

              restored=page.evaluate("""()=>{
                const p=currentGame.puzzle,before=gameElapsed();
                pauseGameClock('menu');
                startGame(p,'free');
                return {before,base:currentGame.baseElapsedMs,calm:currentGame.calmMode===true};
              }""")
              assert abs(restored['base']-restored['before'])<40 and restored['calm'],restored
              assert not errors,errors
              print('PASS S11B.1 browser smoke',result,layout,persisted,restored)
              ctx.close();browser.close()
          PY
          python /tmp/s11b1_smoke.py
