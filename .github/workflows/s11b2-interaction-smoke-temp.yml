name: Sprint 11B.2 temporary interaction smoke

on:
  push:
    branches: [refactor/s11b2-game-interaction]
    paths: ['.github/workflows/s11b2-interaction-smoke-temp.yml']

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREVIEW_URL: https://proplet-git-refactor-s11b2-game-i-776120-pavel-prouzas-projects.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Verify board input magnifier hints and Fold
        shell: bash
        run: |
          cat > /tmp/s11b2_smoke.py <<'PY'
          import os,time,urllib.request
          from playwright.sync_api import sync_playwright

          URL=os.environ['PREVIEW_URL'].rstrip('/')
          CHROME=next(p for p in ('/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser') if os.path.exists(p))

          deadline=time.time()+90
          while True:
              try:
                  board=urllib.request.urlopen(URL+'/app/game/board.js?qa='+str(time.time()),timeout=8).read().decode()
                  inp=urllib.request.urlopen(URL+'/app/game/input.js?qa='+str(time.time()),timeout=8).read().decode()
                  hints=urllib.request.urlopen(URL+'/app/game/hints.js?qa='+str(time.time()),timeout=8).read().decode()
                  if 'PropletGameBoard' in board and 'PropletGameInput' in inp and 'PropletGameHints' in hints: break
              except Exception: pass
              if time.time()>deadline: raise AssertionError('preview alias did not reach Sprint 11B.2')
              time.sleep(2)

          def wait(page,expr,timeout=15000):
              end=time.time()+timeout/1000
              while time.time()<end:
                  try:
                      if page.evaluate(expr): return
                  except Exception: pass
                  time.sleep(.1)
              raise AssertionError('timeout: '+expr)

          def prepare(page):
              page.goto(URL,wait_until='domcontentloaded',timeout=30000)
              wait(page,"typeof startGame==='function' && typeof gameBoard==='function' && typeof gameInput==='function' && typeof gameHints==='function' && !!puzzleDB?.free?.medium?.[0]")
              page.evaluate("""()=>{
                try{
                  localStorage.setItem('proplet-onboarding-v1','done');
                  localStorage.setItem('proplet-v3-7-required-onboarding','done');
                  localStorage.setItem('proplet-helper-onboarding-v1','done');
                  localStorage.setItem('proplet-v3-16-2-helper-onboarding','done');
                  localStorage.setItem('proplet-gen4-release-modal-v1','1');
                  localStorage.setItem('proplet-v3-settings',JSON.stringify({sound:false,haptics:false,wakeLock:false,magnifier:true,theme:'auto'}));
                }catch(e){}
                document.querySelector('#qualityReleaseModal')?.classList.add('hidden');
                document.querySelector('#onboardingModal')?.classList.add('hidden');
                document.querySelector('.release-notes-v3331-backdrop')?.remove();
                document.body.classList.remove('release-notes-v3331-open');
                document.documentElement.classList.remove('gen4-preview-booting');
              }""")

          def drag_answer(page,diff='medium'):
              info=page.evaluate(f"""()=>{{
                const p=puzzleDB.free.{diff}[0],a=p.answers[0];
                startGame(p,'free');
                return {{puzzleId:p.id,path:[...a.path],word:a.word}};
              }}""")
              wait(page,"document.body.classList.contains('playing') && document.querySelectorAll('#board .cell').length>0")
              boxes=[]
              for idx in info['path']:
                  box=page.locator(f'.cell[data-index="{idx}"]').bounding_box()
                  assert box, (idx,info)
                  boxes.append((box['x']+box['width']/2,box['y']+box['height']/2))
              page.mouse.move(*boxes[0]);page.mouse.down()
              for x,y in boxes[1:]: page.mouse.move(x,y,steps=5)
              page.mouse.up();page.wait_for_timeout(450)
              solved=page.evaluate("""()=>({found:currentGame.found.length,moves:currentGame.moves,word:currentGame.found[0]?.word||null,path:[...(currentGame.found[0]?.path||[])]})""")
              assert solved['found']==1 and solved['moves']>=1 and solved['word']==info['word'],(info,solved)
              return info,solved

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,executable_path=CHROME,args=['--no-sandbox','--disable-dev-shm-usage'])

              # Desktop mouse: real pointer drag through an actual target path.
              ctx=browser.new_context(viewport={'width':1280,'height':900},screen={'width':1280,'height':900},service_workers='block')
              page=ctx.new_page();errors=[];page.on('pageerror',lambda e:errors.append(str(e)));prepare(page)
              info,solved=drag_answer(page,'medium')
              modules=page.evaluate("""()=>({board:!!gameBoard(),input:!!gameInput(),hints:!!gameHints(),neighbours:gameBoard().neighbours(currentGame.found[0].path[0]).length})""")
              assert modules['board'] and modules['input'] and modules['hints'] and modules['neighbours']>0,modules
              assert not errors,errors
              desktop={'info':info,'solved':solved,'modules':modules};ctx.close()

              # Fold portrait: layout remains intact and touch magnifier appears during a real pointer drag.
              ctx=browser.new_context(viewport={'width':590,'height':960},screen={'width':384,'height':832},has_touch=True,is_mobile=True,service_workers='block')
              page=ctx.new_page();errors=[];page.on('pageerror',lambda e:errors.append(str(e)));prepare(page)
              info=page.evaluate("""()=>{const p=puzzleDB.free.hard[0],a=p.answers[0];startGame(p,'free');return {puzzleId:p.id,path:[...a.path],word:a.word}}""")
              wait(page,"document.body.classList.contains('playing') && document.querySelectorAll('#board .cell').length>0")
              layout=page.evaluate("""()=>({
                mode:document.documentElement.dataset.gameLayoutMode,
                orient:document.documentElement.dataset.gameLayoutOrientation,
                device:document.documentElement.dataset.gameLayoutDevice,
                overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
                magnifierSupported:gameInput().magnifierDeviceSupported(),
                magnifierAvailable:touchMagnifierAvailable()
              })""")
              assert layout['mode']=='tablet-portrait-rail' and layout['orient']=='portrait' and layout['device']=='large-touch' and layout['overflow']<=1,layout
              assert layout['magnifierSupported'] and layout['magnifierAvailable'],layout
              boxes=[]
              for idx in info['path']:
                  box=page.locator(f'.cell[data-index="{idx}"]').bounding_box();assert box,(idx,info)
                  boxes.append((box['x']+box['width']/2,box['y']+box['height']/2))
              page.mouse.move(*boxes[0]);page.mouse.down();page.wait_for_timeout(120)
              mag=page.evaluate("""()=>({exists:!!document.querySelector('#touchMagnifier'),hidden:document.querySelector('#touchMagnifier')?.classList.contains('hidden'),cells:document.querySelectorAll('#touchMagnifier .touch-mag-cell').length})""")
              assert mag['exists'] and not mag['hidden'] and mag['cells']==9,mag
              for x,y in boxes[1:]: page.mouse.move(x,y,steps=5)
              page.mouse.up();page.wait_for_timeout(450)
              solved=page.evaluate("()=>({found:currentGame.found.length,word:currentGame.found[0]?.word||null,magHidden:document.querySelector('#touchMagnifier')?.classList.contains('hidden')})")
              assert solved['found']==1 and solved['word']==info['word'] and solved['magHidden'],(info,solved)
              boardfit=page.evaluate("""()=>{const s=document.querySelector('#boardStage').getBoundingClientRect(),b=document.querySelector('#board').getBoundingClientRect();return {stageW:s.width,stageH:s.height,boardW:b.width,boardH:b.height}}""")
              assert boardfit['boardW']<=boardfit['stageW']+1 and boardfit['boardH']<=boardfit['stageH']+1,boardfit
              assert not errors,errors
              fold={'layout':layout,'magnifier':mag,'solved':solved,'boardfit':boardfit};ctx.close()

              # Hint policy + DOM trace: scored hint increments exactly once and cancels clean solve.
              ctx=browser.new_context(viewport={'width':390,'height':844},screen={'width':390,'height':844},has_touch=True,is_mobile=True,service_workers='block')
              page=ctx.new_page();errors=[];page.on('pageerror',lambda e:errors.append(str(e)));prepare(page)
              page.evaluate("()=>{const p=puzzleDB.free.medium[1];startGame(p,'free');openHintModal();applySmartHint(2)}")
              page.wait_for_timeout(200)
              hint=page.evaluate("""()=>({
                hints:currentGame.hints,
                maxHintLevel:currentGame.maxHintLevel,
                cleanSolve:currentGame.cleanSolve,
                source:currentGame.nextHintSource,
                route:document.querySelectorAll('#board .cell.hint-route').length,
                modalHidden:document.querySelector('#hintModal').classList.contains('hidden')
              })""")
              assert hint['hints']==1 and hint['maxHintLevel']==2 and hint['cleanSolve']==False and hint['source']=='manual' and hint['route']>=1 and hint['modalHidden'],hint
              assert not errors,errors
              ctx.close();browser.close()

              print('PASS S11B.2 browser matrix',desktop,fold,hint)
          PY
          python /tmp/s11b2_smoke.py
