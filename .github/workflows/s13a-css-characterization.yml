name: Sprint 13A CSS characterization

on:
  push:
    branches:
      - refactor/s13a-css-game
    paths:
      - 'public/**'
      - 'tests/current/**'
      - 'tools/test_s13a_visual_matrix.py'
      - 'tools/compare_s13a_visuals.py'
      - 'tools/test_tajenka_preview.py'
      - 'tools/test_v40135_profile_wide_layout.py'
      - 'TECH_DEBT_REFACTOR_STATUS.md'
      - '.github/workflows/s13a-css-characterization.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  current-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Enforce Sprint 13A scope
        shell: bash
        run: |
          bad=0
          while IFS= read -r f; do
            case "$f" in
              public/*.css|public/theme-init.js|public/index.html|public/sw.js|tests/current/*|tools/test_s13a_visual_matrix.py|tools/compare_s13a_visuals.py|tools/test_tajenka_preview.py|tools/test_v40135_profile_wide_layout.py|TECH_DEBT_REFACTOR_STATUS.md|.github/workflows/s13a-css-characterization.yml) ;;
              *) echo "OUT OF SCOPE: $f"; bad=1 ;;
            esac
          done < <(git diff --name-only b8d98c35527e6006c0ceaeb4ba4d76e4c06665b8...HEAD)
          exit "$bad"
      - name: Current runtime gate
        run: python tools/test_current.py

  visual-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0 Pillow==11.3.0
      - name: Prepare exact pre-change baseline
        run: git worktree add --detach /tmp/proplet-s13a-base db4522639a558b7a359dd002a20d5179ea3dc347
      - name: Capture baseline and current visual matrix
        shell: bash
        run: |
          python tools/test_s13a_visual_matrix.py --public-root /tmp/proplet-s13a-base/public --output /tmp/proplet-s13a-baseline
          python tools/test_s13a_visual_matrix.py --public-root public --output /tmp/proplet-s13a-visual
      - name: Compare against characterized baseline
        run: |
          python tools/compare_s13a_visuals.py \
            --baseline /tmp/proplet-s13a-baseline \
            --current /tmp/proplet-s13a-visual \
            --max-changed-ratio 0.0005 \
            --max-channel-delta 3 \
            --max-geometry-delta 0.25
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s13a-visual-matrix
          path: /tmp/proplet-s13a-visual/
          if-no-files-found: error
          retention-days: 14
