name: Tajenka runtime preview smoke

on:
  push:
    branches: [feature/tajenka-v2-production]
    paths:
      - 'public/tajenka-runtime-polish.css'
      - 'public/tajenka-runtime-polish.js'
      - 'public/tajenka-card-polish.js'
      - 'public/theme-init.js'
      - '.github/workflows/tajenka-runtime-preview-smoke.yml'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PREVIEW_URL: https://proplet-git-feature-tajenka-v2-pr-7166ab-pavel-prouzas-projects.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Verify calm button and semantic clue in Chromium
        shell: bash
        run: |
          cat > /tmp/tajenka_runtime_smoke.py <<'PY'
          import os, time, urllib.request
          from playwright.sync_api import sync_playwright

          url=os.environ['PREVIEW_URL'].rstrip('/')
          deadline=time.time()+150
          while True:
              try:
                  nonce=str(time.time())
                  with urllib.request.urlopen(url+'/tajenka-runtime-polish.js?v=1&qa='+nonce,timeout=8) as r:
                      runtime=r.read().decode('utf-8')
                  with urllib.request.urlopen(url+'/tajenka-card-polish.js?v=2&qa='+nonce,timeout=8) as r:
                      card=r.read().decode('utf-8')
                  if 'semanticHintIcon' in runtime and 'text-only normalizer must not flatten' in card:
                      break
              except Exception:
                  pass
              if time.time()>deadline:
                  raise AssertionError('preview alias did not publish current Tajenka polish assets')
              time.sleep(2)

          chrome=next(p for p in ('/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser') if os.path.exists(p))
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,executable_path=chrome,args=['--no-sandbox','--disable-dev-shm-usage'])
              page=browser.new_page(viewport={'width':1440,'height':900})
              page.goto(url+'/?tajenka=1&tajenka_week=1',wait_until='domcontentloaded',timeout=30000)
              page.wait_for_function("()=>window.__PROPLET_TAJENKA_RUNTIME_POLISH__===true",timeout=15000)

              page.evaluate("""async()=>{
                const sleep=ms=>new Promise(r=>setTimeout(r,ms));
                document.documentElement.classList.add('tiskarna-ui','ribbon-ui');
                const game=document.querySelector('#screen-game');
                game.classList.add('active','tajenka-mode');
                document.body.classList.add('playing','game-desktop-wide','calm-run-v334');
                const actions=document.querySelector('.game-actions');
                let calm=document.querySelector('#calmRunBtn');
                if(!calm){calm=document.createElement('button');calm.id='calmRunBtn';calm.className='secondary-btn';calm.textContent='Klidný režim';actions.appendChild(calm)}
                const msg=document.querySelector('#gameMessage');
                msg.textContent='💭 Testovací významová stopa';
                msg.className='game-message good';
                let banner=document.querySelector('#tajenkaHintBanner');
                if(!banner){banner=document.createElement('div');banner.id='tajenkaHintBanner';document.querySelector('#boardStage').before(banner)}
                banner.className='tajenka-hint-banner';
                banner.textContent='💭 Testovací významová stopa';
                await sleep(220);
              }""")

              def snapshot():
                  return page.evaluate("""()=>{
                    const calm=document.querySelector('#calmRunBtn');
                    const msg=document.querySelector('#gameMessage');
                    const banner=document.querySelector('#tajenkaHintBanner');
                    return {
                      calmDisplay:getComputedStyle(calm).display,
                      calmInline:calm.style.getPropertyValue('display'),
                      calmInlinePriority:calm.style.getPropertyPriority('display'),
                      msgClass:msg.className,
                      msgColor:getComputedStyle(msg).color,
                      msgSize:getComputedStyle(msg).fontSize,
                      msgWeight:getComputedStyle(msg).fontWeight,
                      msgDisplay:getComputedStyle(msg).display,
                      msgIcon:!!msg.querySelector('.tajenka-semantic-hint-icon svg'),
                      msgLabel:msg.querySelector('.tajenka-semantic-hint-text')?.textContent||'',
                      bannerClass:banner.className,
                      bannerColor:getComputedStyle(banner).color,
                      bannerSize:getComputedStyle(banner).fontSize,
                      bannerWeight:getComputedStyle(banner).fontWeight,
                      bannerDisplay:getComputedStyle(banner).display,
                      bannerIcon:!!banner.querySelector('.tajenka-semantic-hint-icon svg'),
                      bannerLabel:banner.querySelector('.tajenka-semantic-hint-text')?.textContent||'',
                    };
                  }""")

              desktop=snapshot()
              page.evaluate("""()=>{document.body.classList.remove('game-desktop-wide');document.body.classList.add('game-tablet-landscape');window.dispatchEvent(new Event('resize'))}""")
              page.wait_for_timeout(220)
              tablet=snapshot()

              page.set_viewport_size({'width':390,'height':844})
              page.evaluate("""()=>{document.body.classList.remove('game-desktop-wide','game-tablet-landscape','game-tablet-portrait');window.dispatchEvent(new Event('resize'))}""")
              page.wait_for_timeout(700)
              mobile=snapshot()

              page.evaluate("document.documentElement.dataset.theme='dark'")
              page.wait_for_timeout(100)
              dark=snapshot()
              result={'desktop':desktop,'tablet':tablet,'mobile':mobile,'dark':dark}
              print(result)

              # The player-visible requirement: Calm action is absent everywhere.
              for mode in ('desktop','tablet','mobile'):
                  assert result[mode]['calmDisplay']=='none',result

              # Wide layouts were the regression: their high-specificity flex rule
              # must be defeated by the calm runtime state itself.
              for mode in ('desktop','tablet'):
                  state=result[mode]
                  assert state['calmInline']=='none' and state['calmInlinePriority']=='important',result
                  assert state['msgDisplay']=='flex',result
                  assert state['msgIcon'],result
                  assert state['msgLabel']=='Testovací významová stopa',result
                  assert state['msgSize']=='16px',result
                  assert int(state['msgWeight'])>=800,result
                  assert state['msgColor']!='rgb(255, 255, 255)',result
                  assert state['bannerDisplay']=='none',result

              # Phone deliberately uses only the dedicated compact banner. The
              # old tiny current-word copy is hidden and therefore not judged by
              # its inherited font-size.
              assert mobile['msgDisplay']=='none',result
              assert mobile['bannerDisplay']=='flex',result
              assert mobile['bannerIcon'],result
              assert mobile['bannerLabel']=='Testovací významová stopa',result
              assert mobile['bannerSize']=='16px',result
              assert int(mobile['bannerWeight'])>=800,result
              assert mobile['bannerColor']!='rgb(255, 255, 255)',result

              assert dark['bannerColor']!='rgb(255, 255, 255)',result
              browser.close()
          PY
          python /tmp/tajenka_runtime_smoke.py
