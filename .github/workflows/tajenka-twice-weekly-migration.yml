name: Tajenka twice-weekly migration

on:
  push:
    branches:
      - ux/tiskarska-dilna
    paths:
      - .github/workflows/tajenka-twice-weekly-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/tiskarska-dilna
          fetch-depth: 0

      - name: Apply Saturday + Wednesday cadence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one exact match, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once('server.py', 'TAJENKA_FIRST_SATURDAY = date(2026, 8, 29)\n', 'TAJENKA_FIRST_SATURDAY = date(2026, 8, 29)\nTAJENKA_TWICE_WEEKLY_START = date(2026, 9, 12)\n')
          replace_once('server.py', 'def tajenka_week_for(day: date) -> Optional[int]:\n    """Return the finite release week for a date; never cycle future content."""\n    offset = (day - TAJENKA_FIRST_SATURDAY).days\n    if offset < 0:\n        return None\n    week = offset // 7 + 1\n    prepared = int(load_tajenka_bank().get("weeks") or 0)\n    return week if 1 <= week <= prepared else None', 'def tajenka_week_for(day: date) -> Optional[int]:\n    """Return the active finite Tajenka slot for the Saturday/Wednesday cadence."""\n    initial_offset = (day - TAJENKA_FIRST_SATURDAY).days\n    if initial_offset < 0:\n        return None\n    if day < TAJENKA_TWICE_WEEKLY_START:\n        week = initial_offset // 7 + 1\n    else:\n        cadence_offset = (day - TAJENKA_TWICE_WEEKLY_START).days\n        week = 3 + (cadence_offset // 7) * 2 + (1 if cadence_offset % 7 >= 4 else 0)\n    prepared = int(load_tajenka_bank().get("weeks") or 0)\n    return week if 1 <= week <= prepared else None')

          replace_once('public/app.js', "const TAJENKA_FIRST_SATURDAY=window.PROPLET_RUNTIME_META?.capabilities?.tajenkaFirstSaturday||'2026-08-29';\nconst TAJENKA_PREPARED_WEEKS=10;", "const TAJENKA_FIRST_SATURDAY=window.PROPLET_RUNTIME_META?.capabilities?.tajenkaFirstSaturday||'2026-08-29';\nconst TAJENKA_TWICE_WEEKLY_START=window.PROPLET_RUNTIME_META?.capabilities?.tajenkaTwiceWeeklyStart||'2026-09-12';\nconst TAJENKA_PREPARED_WEEKS=10;")
          replace_once('public/app.js', 'function refreshTajenkaAvailability(iso=pragueDateISO()){\n const offset=dayOffsetISO(iso,TAJENKA_FIRST_SATURDAY),week=offset>=0?Math.floor(offset/7)+1:null;\n activeTajenkaWeek=TAJENKA_PREVIEW?requestedTajenkaWeek:(week>=1&&week<=TAJENKA_PREPARED_WEEKS?week:null);\n TAJENKA_AVAILABLE=TAJENKA_PREVIEW||Boolean(TAJENKA_RELEASE_ENABLED&&activeTajenkaWeek);\n return TAJENKA_AVAILABLE;\n}', 'function tajenkaReleaseSlotForISO(iso=pragueDateISO()){\n const initialOffset=dayOffsetISO(iso,TAJENKA_FIRST_SATURDAY);\n if(initialOffset<0)return null;\n const cadenceOffset=dayOffsetISO(iso,TAJENKA_TWICE_WEEKLY_START);\n if(cadenceOffset<0)return Math.floor(initialOffset/7)+1;\n return 3+Math.floor(cadenceOffset/7)*2+(cadenceOffset%7>=4?1:0);\n}\nfunction refreshTajenkaAvailability(iso=pragueDateISO()){\n const week=tajenkaReleaseSlotForISO(iso);\n activeTajenkaWeek=TAJENKA_PREVIEW?requestedTajenkaWeek:(week>=1&&week<=TAJENKA_PREPARED_WEEKS?week:null);\n TAJENKA_AVAILABLE=TAJENKA_PREVIEW||Boolean(TAJENKA_RELEASE_ENABLED&&activeTajenkaWeek);\n return TAJENKA_AVAILABLE;\n}')

          replace_once('public/runtime-meta.js', "      tajenkaFirstSaturday:'2026-08-29',\n      tajenkaRewardXp:200,", "      tajenkaFirstSaturday:'2026-08-29',\n      tajenkaTwiceWeeklyStart:'2026-09-12',\n      tajenkaRewardXp:200,")

          replace_once('push_diagnostics_v3329.py', '    tajenka_first_saturday = date(2026, 8, 29)\n', '    tajenka_first_saturday = date(2026, 8, 29)\n    tajenka_twice_weekly_start = date(2026, 9, 12)\n')
          replace_once('push_diagnostics_v3329.py', '        tajenka_week = None\n        if tajenka_release_enabled and today_date >= tajenka_first_saturday and today_date.weekday() == 5:\n            candidate_week = (today_date - tajenka_first_saturday).days // 7 + 1\n            tajenka_week = candidate_week if 1 <= candidate_week <= 10 else None\n', '        tajenka_week = None\n        if tajenka_release_enabled and today_date >= tajenka_first_saturday:\n            release_day = today_date.weekday() == 5 if today_date < tajenka_twice_weekly_start else today_date.weekday() in {2, 5}\n            if release_day:\n                if today_date < tajenka_twice_weekly_start:\n                    candidate_week = (today_date - tajenka_first_saturday).days // 7 + 1\n                else:\n                    cadence_offset = (today_date - tajenka_twice_weekly_start).days\n                    candidate_week = 3 + (cadence_offset // 7) * 2 + (1 if cadence_offset % 7 >= 4 else 0)\n                tajenka_week = candidate_week if 1 <= candidate_week <= 10 else None\n')
          replace_once('push_diagnostics_v3329.py', '"title": "✨ Víkendová Tajenka je tady",', '"title": "✨ Nová Tajenka je tady",')
          PY

      - name: Verify syntax
        run: |
          python -m py_compile server.py push_diagnostics_v3329.py

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.py public/app.js public/runtime-meta.js push_diagnostics_v3329.py
          git diff --cached --check
          git commit -m "Switch Tajenka to Saturday and Wednesday cadence"
          git push origin HEAD:ux/tiskarska-dilna
