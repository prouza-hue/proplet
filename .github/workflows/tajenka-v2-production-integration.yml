name: Tajenka v2 production integration

on:
  push:
    branches:
      - feature/tajenka-v2-production
    paths:
      - 'tools/promote_tajenka_v2.py'
      - 'tools/apply_tajenka_v2_integration.py'
      - 'tools/test_tajenka_v2_production.py'
      - '.github/workflows/tajenka-v2-production-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Import exact approved playtest master
        run: |
          git fetch origin playtest/tajenka-v2-review1:refs/remotes/origin/playtest/tajenka-v2-review1
          git show origin/playtest/tajenka-v2-review1:public/tajenka-v2-data-review1.json > data/tajenka_v2_approved.json

      - name: Promote frozen boards without regeneration
        run: python tools/promote_tajenka_v2.py

      - name: Apply runtime integration
        run: python tools/apply_tajenka_v2_integration.py

      - name: Validate frozen production bank
        run: python tools/test_tajenka_v2_production.py

      - name: Syntax checks
        run: |
          python -m py_compile server.py backend/config.py tools/promote_tajenka_v2.py tools/apply_tajenka_v2_integration.py tools/test_tajenka_v2_production.py
          node --check public/app.js
          node --check public/tajenka-release-fix.js

      - name: Commit integrated bank and runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/tajenka_v2_approved.json data/tajenka_weekend_v2.json data/tajenka_v2_freeze_manifest.json backend/config.py server.py public/app.js public/tajenka-release-fix.js public/tajenka-release-fix.css
          git diff --cached --quiet && exit 0
          git commit -m 'Integrate approved Tajenka v2 frozen production bank'
          git push origin HEAD:feature/tajenka-v2-production
