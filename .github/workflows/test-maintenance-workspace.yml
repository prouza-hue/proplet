name: Test maintenance workspace
on:
  pull_request:
    paths: ['.github/workflows/test-maintenance-workspace.yml']
permissions: {contents: read}
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import subprocess,zipfile
          from pathlib import Path
          with zipfile.ZipFile('/tmp/test-workspace.zip','w',zipfile.ZIP_DEFLATED) as z:
            for name in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
              p=Path(name)
              if p.is_file() and p.suffix in {'.py','.js','.cjs','.json','.sql','.html','.css','.yml','.yaml','.txt','.md','.toml','.gz'}:
                z.write(p,name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: test-workspace
          path: /tmp/test-workspace.zip
          retention-days: 1
