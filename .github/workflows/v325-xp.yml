name: Validate and apply Proplet v3.25 XP

on:
  push:
    branches:
      - agent/v325-xp
    paths:
      - .release/v325-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact replacements
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          spec = json.loads(Path('.release/v325-replacements.json').read_text(encoding='utf-8'))
          for item in spec:
              path = Path(item['path'])
              text = path.read_text(encoding='utf-8')
              old = item['old']
              new = item['new']
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: {item['label']} expected one match, found {count}")
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Syntax and economy checks
        run: |
          python -m py_compile server.py
          node --check public/app.js
          node --check public/sw.js
          python - <<'PY'
          from pathlib import Path
          server = Path('server.py').read_text(encoding='utf-8')
          app = Path('public/app.js').read_text(encoding='utf-8')
          sw = Path('public/sw.js').read_text(encoding='utf-8')
          assert 'APP_VERSION = "3.25.0"' in server
          assert '"easy": 15' in server and '"medium": 25' in server and '"hard": 50' in server and '"hardcore": 100' in server
          assert "const APP_VERSION='3.25.0';" in app
          assert "target:61000" in app
          assert "proplet-v3.25.0-xp-v2" in sw
          PY
      - name: Commit validated source changes
        run: |
          git config user.name 'Proplet Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add server.py public/app.js public/sw.js
          git diff --cached --check
          git commit -m 'Proplet v3.25.0 XP economy v2'
          git push origin HEAD:agent/v325-xp
