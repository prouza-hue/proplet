name: Validate and apply Proplet v3.26 PWA install

on:
  push:
    branches:
      - agent/v326-pwa-install
    paths:
      - .release/v326-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact replacements
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          spec=json.loads(Path('.release/v326-replacements.json').read_text(encoding='utf-8'))
          for item in spec:
              path=Path(item['path'])
              text=path.read_text(encoding='utf-8')
              count=text.count(item['old'])
              if count != 1:
                  raise SystemExit(f"{path}: {item['label']} expected one match, found {count}")
              path.write_text(text.replace(item['old'],item['new'],1),encoding='utf-8')
          PY
      - name: Syntax and install checks
        run: |
          python -m py_compile server.py
          node --check public/app.js
          node --check public/sw.js
          node -e "require('./public/app.js')"
          python - <<'PY'
          import json
          from pathlib import Path
          server=Path('server.py').read_text(encoding='utf-8')
          app=Path('public/app.js').read_text(encoding='utf-8')
          html=Path('public/index.html').read_text(encoding='utf-8')
          css=Path('public/styles.css').read_text(encoding='utf-8')
          sw=Path('public/sw.js').read_text(encoding='utf-8')
          manifest=json.loads(Path('public/manifest.webmanifest').read_text(encoding='utf-8'))
          assert 'APP_VERSION = "3.26.0"' in server
          assert "const APP_VERSION='3.26.0';" in app
          assert 'beforeinstallprompt' in app and 'appinstalled' in app
          assert "maybeOfferInstallNudge('continue','daily')" in app
          assert 'postWinEngagementNudgeShown=true' in app
          assert "declines>=2" in app and "7*24*60*60*1000" in app
          for element_id in ['installAppCard','installAppBtn','installAppStatus','installNudgeModal','installNudgeTitle','installNudgeCopy','installIosSteps','installNudgeNote','installNudgePrimary','installNudgeLater','appVersionFooter']:
              assert f'id="{element_id}"' in html, element_id
          assert 'Proplet v3.24.0' not in html
          assert 'v3.26 — contextual PWA install' in css
          assert "proplet-v3.26.0-pwa-install" in sw
          assert manifest.get('id')=='/' and manifest.get('scope')=='/' and manifest.get('display')=='standalone'
          PY
          git diff --check
      - name: Commit validated v3.26 source changes
        run: |
          git config user.name 'Proplet Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add server.py public/app.js public/index.html public/styles.css public/sw.js public/manifest.webmanifest
          git diff --cached --check
          git commit -m 'Proplet v3.26.0 PWA install experience'
          git push origin HEAD:agent/v326-pwa-install
