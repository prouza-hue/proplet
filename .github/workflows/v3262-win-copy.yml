name: Validate and apply Proplet v3.26.2 celebration copy

on:
  push:
    branches:
      - agent/v3262-win-copy
    paths:
      - .release/v3262-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact replacements
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          spec=json.loads(Path('.release/v3262-replacements.json').read_text(encoding='utf-8'))
          for item in spec:
              path=Path(item['path'])
              text=path.read_text(encoding='utf-8')
              count=text.count(item['old'])
              if count != 1:
                  raise SystemExit(f"{path}: {item['label']} expected one match, found {count}")
              path.write_text(text.replace(item['old'],item['new'],1),encoding='utf-8')
          PY
      - name: Syntax and copy checks
        run: |
          python -m py_compile server.py
          node --check public/app.js
          node --check public/sw.js
          node - <<'NODE'
          const m=require('./public/app.js');
          const expected={
            easy:['A je to!','Pěkně.','Hotovo!','Hezky propleteno.','To sedlo.','Další je doma.'],
            medium:['Pěkná práce.','Je to tam!','Hotovo!','Hezky!','Další je doma.','To se povedlo.'],
            hard:['Těžká? Pro tebe ne!','Tohle se počítá.','Pěkný výkon.','Těžká je doma.','Krásná práce.','Tak tohle jo.'],
            hardcore:['Tak kdo s koho?','Fíha. Respekt.','Klobouk dolů!','Je po něm!','Tohle nebyla sranda.','Tvůj mozek odolal.']
          };
          if(JSON.stringify(m.WIN_PRAISE)!==JSON.stringify(expected))throw new Error('WIN_PRAISE mismatch');
          for(const diff of Object.keys(expected)){
            const out=m.completionPraise(diff,{puzzleId:'qa',completedAt:'2026-08-15T00:00:00Z',elapsedMs:1234,moves:12,cleanSolve:true});
            if(!expected[diff].includes(out.title)||out.line!=='')throw new Error(`Bad praise ${diff}`);
          }
          if('CLEAN_PRAISE' in m)throw new Error('CLEAN_PRAISE still exported');
          NODE
          python - <<'PY'
          from pathlib import Path
          server=Path('server.py').read_text(encoding='utf-8')
          app=Path('public/app.js').read_text(encoding='utf-8')
          sw=Path('public/sw.js').read_text(encoding='utf-8')
          assert 'APP_VERSION = "3.26.2"' in server
          assert "const APP_VERSION='3.26.2';" in app
          assert 'const CLEAN_PRAISE=' not in app
          assert "$('#winPraise').classList.add('hidden')" in app
          assert "proplet-v3.26.2-celebration-copy" in sw
          PY
          git diff --check
      - name: Commit validated source changes
        run: |
          git config user.name 'Proplet Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add server.py public/app.js public/sw.js
          git diff --cached --check
          git commit -m 'Proplet v3.26.2 tighten celebration copy'
          git push origin HEAD:agent/v3262-win-copy
