name: Validate and apply Proplet v3.27 difficulty icons

on:
  push:
    branches:
      - agent/v327-difficulty-icons
    paths:
      - .release/v327-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact v3.27 patch
        run: python .release/v327_apply.py
      - name: Validate runtime and SVG assets
        run: |
          python -m py_compile server.py
          node --check public/app.js
          node --check public/home-layout.js
          node --check public/sw.js
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          server=Path('server.py').read_text(encoding='utf-8')
          app=Path('public/app.js').read_text(encoding='utf-8')
          home=Path('public/home-layout.js').read_text(encoding='utf-8')
          css=Path('public/styles.css').read_text(encoding='utf-8')
          homecss=Path('public/home-layout.css').read_text(encoding='utf-8')
          sw=Path('public/sw.js').read_text(encoding='utf-8')
          diff_block=app.split('const DIFF={',1)[1].split('};',1)[0]

          assert 'APP_VERSION = "3.27.0"' in server
          assert "const APP_VERSION='3.27.0';" in app
          assert "icon:'/difficulty/easy.svg'" in diff_block
          assert "icon:'/difficulty/medium.svg'" in diff_block
          assert "icon:'/difficulty/hard.svg'" in diff_block
          assert "icon:'/difficulty/hardcore.svg'" in diff_block
          assert "icon:'🌱'" not in diff_block and "icon:'🧠'" not in diff_block and "icon:'🧨'" not in diff_block and "icon:'🤯'" not in diff_block
          assert "function difficultyIconMarkup" in app
          assert "difficultyIconMarkup(diff,'daily-week-icon')" in app
          assert "difficultyIconMarkup(key,'difficulty-icon-img')" in app
          assert "difficultyIconMarkup(puzzle.difficulty,'game-difficulty-icon')" in app
          assert "difficultyIconMarkup(key,'home-diff-icon')" in home
          assert "difficultyIconMarkup(targetDiff,'home-continue-difficulty-icon')" in home
          assert '${DIFF[g.puzzle.difficulty].icon}' not in app
          assert 'v3.27 — bespoke difficulty icon system' in css
          assert 'v3.27 — custom difficulty assets' in homecss
          assert "proplet-v3.27.0-difficulty-icons" in sw

          for name in ('easy','medium','hard','hardcore'):
              path=Path(f'public/difficulty/{name}.svg')
              assert path.exists() and path.stat().st_size > 300
              root=ET.parse(path).getroot()
              assert root.tag.endswith('svg')
              assert root.attrib.get('viewBox')=='0 0 64 64'
              assert f"/difficulty/{name}.svg" in sw

          # Difficulty paths must be decorative images; labels remain real text beside them.
          assert 'aria-hidden="true"' in app
          # Keep avatars untouched in this release.
          assert "const AVATARS=['🙂','😎','🤓','🥳'" in app
          PY
          git diff --check
      - name: Commit validated v3.27 runtime changes
        run: |
          git config user.name 'Proplet Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add server.py public/app.js public/home-layout.js public/styles.css public/home-layout.css public/sw.js
          git diff --cached --check
          git commit -m 'Proplet v3.27.0 custom difficulty icons'
          git push origin HEAD:agent/v327-difficulty-icons
