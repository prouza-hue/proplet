name: Validate and apply Proplet v3.28 profile UX

on:
  push:
    branches:
      - agent/v328-profile-compact

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v328-profile-compact
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact v3.28 patch
        run: python .release/v328_apply.py
      - name: Validate runtime and profile UX
        run: |
          python -m py_compile server.py
          node --check public/app.js
          python - <<'PY'
          from pathlib import Path
          app=Path('public/app.js').read_text(encoding='utf-8')
          html=Path('public/index.html').read_text(encoding='utf-8')
          css=Path('public/styles.css').read_text(encoding='utf-8')
          sw=Path('public/sw.js').read_text(encoding='utf-8')
          server=Path('server.py').read_text(encoding='utf-8')
          assert "const APP_VERSION='3.28.0';" in app
          assert 'APP_VERSION = "3.28.0"' in server
          assert "const CACHE='proplet-v3.28.0-profile-compact';" in sw
          assert app.count("function renderProfile({focusRoadmap=false}={})") == 1
          assert app.count("renderProfile({focusRoadmap:prev!=='profile'})") == 1
          assert "if(screen==='profile')renderProfile();" not in app
          assert app.count('function focusProfileRoadmap()') == 1
          assert "current.offsetLeft-(rail.clientWidth-current.offsetWidth)/2" in app
          assert app.count('function renderAchievementSummary(stats)') == 1
          assert app.count('function syncAchievementDisclosure()') == 1
          assert "profileAchievementsExpanded=!profileAchievementsExpanded" in app
          for id_ in ['achievementToggleBtn','achievementSummary','achievementDetails','achievementGrid']:
              assert html.count(f'id="{id_}"') == 1, id_
          assert 'aria-controls="achievementDetails"' in html
          assert 'id="achievementDetails" class="achievement-details" hidden' in html
          assert '/* v3.28 — compact profile progress */' in css
          assert '.achievement-details[hidden]{display:none}' in css
          assert '.achievement-summary-icons' in css
          assert '.level-roadmap::-webkit-scrollbar{display:none}' in css
          print('v3.28 profile UX validation PASS')
          PY
      - name: Commit validated runtime changes
        run: |
          git config user.name "Proplet Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add server.py public/app.js public/index.html public/styles.css public/sw.js
          git diff --cached --check
          git diff --cached --quiet && exit 1 || true
          git commit -m "Proplet v3.28.0 compact profile progress"
          git push origin HEAD:agent/v328-profile-compact
