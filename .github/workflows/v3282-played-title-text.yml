name: Validate and apply Proplet v3.28.2 played title text-only fix
on:
  push:
    branches: [agent/v3282-played-title-text]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v3282-played-title-text
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact hotfix
        run: python .release/v3282_fix.py
      - name: Validate runtime
        run: |
          python -m py_compile server.py
          node --check public/app.js
          python - <<'PY'
          from pathlib import Path
          app=Path('public/app.js').read_text()
          css=Path('public/styles.css').read_text()
          sw=Path('public/sw.js').read_text()
          server=Path('server.py').read_text()
          assert "const APP_VERSION='3.28.2';" in app
          assert 'APP_VERSION = "3.28.2"' in server
          assert "proplet-v3.28.2-played-title-text-only" in sw
          title=next(l for l in app.splitlines() if 'tvoje úrovně' in l and 'playedLevelsTitle' in l)
          assert "textContent=`${d.label} · tvoje úrovně`" in title
          assert 'difficultyIconMarkup' not in title and '.icon' not in title and '.svg' not in title
          assert 'played-levels-title-icon' not in css
          print('v3.28.2 validation OK')
          PY
      - name: Commit validated runtime changes
        run: |
          git config user.name 'Proplet Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/app.js public/styles.css public/sw.js server.py
          git commit -m 'Proplet v3.28.2 simplify played-level titles'
          git push origin HEAD:agent/v3282-played-title-text
