name: Validate v3.30 Rolling Content Preview

on:
  push:
    branches:
      - preview/v330-rolling-final
  workflow_dispatch:

concurrency:
  group: v330-rolling-final
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Remember production base puzzle blobs
        run: |
          echo "BASE_DATA_SHA=$(git hash-object data/puzzles.json)" >> "$GITHUB_ENV"
          echo "BASE_PUBLIC_SHA=$(git hash-object public/puzzles.json)" >> "$GITHUB_ENV"

      - name: Generate 13-week server-only reserve
        run: python tools/generate_rolling_content.py

      - name: Apply final preview runtime
        run: |
          python .release/apply_v330.py
          python .release/harden_v330.py
          python .release/split_rolling_delta_v330.py
          python .release/preserve_legacy_push_v330.py
          python .release/separate_rolling_store_v330.py
          python .release/final_polish_v330.py

      - name: Base puzzle bank must remain byte-for-byte unchanged
        run: |
          test "$BASE_DATA_SHA" = "$(git hash-object data/puzzles.json)"
          test "$BASE_PUBLIC_SHA" = "$(git hash-object public/puzzles.json)"
          git diff --exit-code -- data/puzzles.json public/puzzles.json

      - name: Syntax checks
        run: |
          python -m py_compile server.py \
            tools/generate_rolling_content.py tools/audit_rolling_content.py \
            .release/apply_v330.py .release/harden_v330.py \
            .release/split_rolling_delta_v330.py .release/preserve_legacy_push_v330.py \
            .release/separate_rolling_store_v330.py .release/final_polish_v330.py \
            .release/validate_v330.py .release/validate_lifecycle_v330.py
          node --check public/app.js
          python -m json.tool vercel.json >/dev/null
          python -m json.tool data/rolling_content_v1.json >/dev/null

      - name: Independent exact-cover and content QA
        run: python tools/audit_rolling_content.py

      - name: Runtime, consent, cache and release-gating invariants
        run: |
          python .release/validate_v330.py
          python .release/validate_lifecycle_v330.py

      - name: Show reviewable diff stats
        run: |
          git diff --stat
          echo "--- base puzzle bank diff ---"
          git diff --numstat -- data/puzzles.json public/puzzles.json
          echo "--- reserve size ---"
          wc -l data/rolling_content_v1.json

      - name: Commit validated preview runtime
        run: |
          git config user.name 'Proplet Preview Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add server.py public/app.js public/index.html public/styles.css public/sw.js vercel.json \
                  data/rolling_content_v1.json ROLLING_CONTENT_V3_30_AUDIT.json \
                  tools/generate_rolling_content.py tools/audit_rolling_content.py \
                  SUPABASE_MIGRATION_V3_30.sql SUPABASE_VERIFY_V3_30.sql
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Proplet v3.30.0-preview.1 rolling content and notifications v2'
            git push origin HEAD:preview/v330-rolling-final
          fi
