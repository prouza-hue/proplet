name: Proplet v3.31.4 hard Daily preview
on:
  push:
    branches: [preview/v3314-first-hard-daily]
permissions:
  contents: write
jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[v3314-preview-built]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python .release/apply_v3314_preview.py
      - run: node --check public/app.js
      - run: python -m py_compile server.py
      - name: Validate simulated Saturday is Hard
        run: |
          python - <<'PY'
          import json
          from datetime import date
          data=json.load(open('data/puzzles.json',encoding='utf-8'))
          base=date.fromisoformat(data.get('dailyRotationBaseDate') or data.get('dailyGeneration3From'))
          target=date.fromisoformat('2026-08-22')
          bank=data['daily']
          puzzle=bank[(target-base).days % len(bank)]
          print('preview daily:', target, puzzle.get('difficulty'), puzzle.get('id'))
          assert puzzle.get('difficulty')=='hard', puzzle
          PY
      - name: Validate onboarding safety invariants
        run: |
          grep -q "const APP_VERSION='3.31.4-preview.1'" public/app.js
          grep -q "const PREVIEW_NOW_DATE='2026-08-22'" public/app.js
          grep -q "Dnešní výzva je Těžká" public/app.js
          grep -q "Nejdřív Snadná" public/app.js
          grep -q "Jdu rovnou na dnešní Těžkou" public/app.js
          grep -q "postStarterWarmup" public/app.js
          grep -q "starter_hard_choice_shown" public/app.js
          grep -q "starter_hard_direct_selected" public/app.js
          grep -q "starter_easy_warmup_selected" public/app.js
          grep -q "starter_easy_warmup_completed" public/app.js
          grep -q "if(CONTENT_PREVIEW_DATE)return;" public/app.js
          grep -q "if(CONTENT_PREVIEW_DATE)return {ok:true,left:getQueue().length,preview:true};" public/app.js
          grep -q "caches.match(url,{ignoreSearch:true})" public/app.js
          grep -q "u.pathname==='/api/rolling-content'||u.pathname==='/puzzles.json'" public/sw.js
          grep -q "proplet-v3.31.4-preview.1-hard-daily-onboarding" public/sw.js
          grep -q 'APP_VERSION = "3.31.4-preview.1"' server.py
          ! grep -q "title:'Propleť všechno'" public/app.js
      - name: Commit validated preview runtime
        run: |
          git config user.name "prouza-hue"
          git config user.email "prouza@gmail.com"
          git add public/app.js public/styles.css public/sw.js server.py
          git commit -m "Preview v3.31.4 first Hard Daily flow [v3314-preview-built]"
          git push
