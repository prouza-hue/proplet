name: Proplet v3.31.6 preview boot hotfix
on:
  push:
    branches: [preview/v3316-gen3-progression]
    paths:
      - .github/workflows/v3316-boot-hotfix.yml
permissions:
  contents: write
jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix puzzle schema boot contract
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('public/app.js')
          s=app.read_text(encoding='utf-8')
          old='const EXPECTED_PUZZLE_DB_VERSION=9;'
          new='const EXPECTED_PUZZLE_DB_VERSION=10;'
          if old not in s:
              raise SystemExit('Expected v9 client marker not found')
          s=s.replace(old,new,1)
          app.write_text(s,encoding='utf-8')

          audit=Path('tools/audit_free_generation3.py')
          a=audit.read_text(encoding='utf-8')
          marker='    assert int(data.get("version") or 0) == 10\n'
          guard='''    app_js = (ROOT / "public" / "app.js").read_text(encoding="utf-8")\n    expected_marker = f"const EXPECTED_PUZZLE_DB_VERSION={int(data.get('version') or 0)};"\n    assert expected_marker in app_js, (expected_marker, "client/server puzzle schema mismatch")\n'''
          if guard not in a:
              if marker not in a:
                  raise SystemExit('Audit version marker not found')
              a=a.replace(marker, marker+guard, 1)
          audit.write_text(a,encoding='utf-8')
          PY
      - name: Syntax and boot contract
        run: |
          node --check public/app.js
          python -m py_compile tools/audit_free_generation3.py
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('public/puzzles.json').read_text(encoding='utf-8'))
          app=Path('public/app.js').read_text(encoding='utf-8')
          v=int(payload.get('version') or 0)
          assert v == 10, v
          assert f'const EXPECTED_PUZZLE_DB_VERSION={v};' in app
          assert payload.get('freeGeneration') == 3
          assert all(len(payload['free'][d]) == 200 for d in ('easy','medium','hard','hardcore'))
          print('PASS: browser boot schema contract', v)
          PY
      - name: Full Gen3 audit
        run: python tools/audit_free_generation3.py
      - name: Commit hotfix
        run: |
          git config user.name 'Proplet Hotfix Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/workflows/v3316-boot-hotfix.yml
          git add public/app.js tools/audit_free_generation3.py FREE_GENERATION3_AUDIT.json FREE_GENERATION3_AUDIT_CZ.md
          git add -u .github/workflows/v3316-boot-hotfix.yml
          git commit -m 'Fix v3.31.6 preview puzzle boot schema'
          git push
