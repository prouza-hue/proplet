name: Proplet v3.31.6 Gen3 preview
on:
  push:
    branches: [preview/v3316-gen3-progression]
    paths:
      - tools/apply_v3316_gen3_patch.py
      - tools/finalize_v3316_gen3.py
      - .github/workflows/v3316-gen3-preview.yml
concurrency:
  group: v3316-gen3-preview
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build-gen3:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix temporary patch matcher
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/apply_v3316_gen3_patch.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('end_marker = " $(\'#playedLevelsList\').innerHTML=currentHtml+archiveHtml;"','end_marker = "$(\'#playedLevelsList\').innerHTML=currentHtml+archiveHtml;"')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Apply source patch
        run: python tools/apply_v3316_gen3_patch.py
      - name: Harden finalizer and select smart Hardcore
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/finalize_v3316_gen3.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('"watch"]]', '"watch"}]')
          old='''    if marker not in text:\n        raise RuntimeError("quality ladder insertion marker not found")\n    text = text.replace(marker, ladder, 1)\n'''
          new='''    if marker in text:\n        text = text.replace(marker, ladder, 1)\n    else:\n        anchor = "    helper_summary = {}\\n"\n        if anchor not in text:\n            raise RuntimeError("quality ladder insertion anchor not found")\n        ladder_prefix = ladder.rsplit("    helper_summary = {}", 1)[0]\n        text = text.replace(anchor, ladder_prefix + anchor, 1)\n'''
          if old not in s:
              raise SystemExit('finalizer marker guard not found')
          s=s.replace(old,new)
          current='''        dict(rows=10, cols=10, cells=(78, 88), words=(12, 15), min_len=4, max_len=10, dict_size=10500, cand=(18, 700),\n             style="winding", turn_bias=.38, curl_bias=.25, min_curvy=6, min_spiral=2, max_short_words=2),'''
          smart='''        dict(rows=10, cols=10, cells=(72, 80), words=(11, 13), min_len=4, max_len=10, dict_size=10250, cand=(16, 540),\n             style="winding", turn_bias=.42, curl_bias=.29, min_curvy=6, min_spiral=2, max_short_words=2),'''
          if current not in s:
              raise SystemExit('Hardcore profile marker not found')
          s=s.replace(current,smart,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Finalize progression architecture
        run: python tools/finalize_v3316_gen3.py
      - name: Set Gen3 generation policy and preflight
        run: |
          python - <<'PY'
          from pathlib import Path
          base=Path('tools/generate_free_generation3.py')
          s=base.read_text(encoding='utf-8')
          old='recent[difficulty] = recent[difficulty][-24:]'
          if old not in s:
              raise SystemExit('base anti-repeat marker not found')
          s=s.replace(old,'recent[difficulty] = recent[difficulty][-16:]',1)
          base.write_text(s,encoding='utf-8')

          rolling=Path('tools/generate_rolling_content.py')
          s=rolling.read_text(encoding='utf-8')
          if 'repeat_window = 24' not in s:
              raise SystemExit('rolling anti-repeat marker not found')
          s=s.replace('repeat_window = 24','repeat_window = 16',1)
          s=s.replace('"contentGeneration": 2,','"contentGeneration": 3,')
          s=s.replace('"generationKey": "free-gen2",','"generationKey": "free-gen3",')
          rolling.write_text(s,encoding='utf-8')

          audit=Path('tools/audit_free_generation3.py')
          s=audit.read_text(encoding='utf-8')
          if s.count('>= 25') != 2:
              raise SystemExit(f'unexpected audit anti-repeat checks: {s.count(">= 25")}')
          s=s.replace('24-level anti-repeat window','16-level anti-repeat window')
          s=s.replace('>= 25','>= 17')
          stale='assert m["151-200"]["meanTurnsPerWord"] > m["1-50"]["meanTurnsPerWord"]'
          if stale not in s:
              raise SystemExit('stale Medium turn-progression guard not found')
          replacement='assert m["151-200"]["meanCells"] > m["1-50"]["meanCells"]\n    assert m["151-200"]["meanWords"] > m["1-50"]["meanWords"]'
          s=s.replace(stale,replacement,1)
          s=s.replace('Medium grows in search area and later path complexity; Hard starts near late Medium.','Medium grows in search area and word count; Hard changes the challenge with winding geometry.')
          audit.write_text(s,encoding='utf-8')

          audit_text=audit.read_text(encoding='utf-8')
          rolling_text=rolling.read_text(encoding='utf-8')
          checks={
            'base repeat 16':'recent[difficulty] = recent[difficulty][-16:]' in base.read_text(encoding='utf-8'),
            'rolling repeat 16':'repeat_window = 16' in rolling_text,
            'audit repeat 17 gap':audit_text.count('>= 17')==2,
            'Medium area progression':'assert m["151-200"]["meanCells"] > m["1-50"]["meanCells"]' in audit_text,
            'Medium word progression':'assert m["151-200"]["meanWords"] > m["1-50"]["meanWords"]' in audit_text,
            'stale Medium turn guard absent':stale not in audit_text,
            'rolling content generation 3':'"contentGeneration": 3,' in rolling_text,
            'rolling generation key 3':'"generationKey": "free-gen3",' in rolling_text,
            'rolling expects gen3':'Rolling content expects Free generation 3' in rolling_text,
            'rolling g3 ids':'"g3-e"' in rolling_text and '"g3-x"' in rolling_text,
          }
          generator=Path('tools/generate_puzzles.py').read_text(encoding='utf-8')
          checks['smart hardcore']='cells=(72, 80)' in generator and 'words=(11, 13)' in generator and 'turn_bias=.42' in generator and 'curl_bias=.29' in generator
          failed=[name for name,ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Gen3 preflight failed: '+', '.join(failed))
          print('Gen3 preflight OK:', ', '.join(checks))
          PY
      - name: Compile generators and server
        run: |
          python -m py_compile tools/generate_puzzles.py tools/generate_free_generation3.py tools/generate_rolling_content.py tools/audit_free_generation3.py server.py
      - name: Generate Free Gen3
        timeout-minutes: 25
        run: python tools/generate_free_generation3.py
      - name: Generate Gen3 rolling reserve
        timeout-minutes: 15
        run: python tools/generate_rolling_content.py
      - name: Audit Free Gen3
        timeout-minutes: 15
        run: python tools/audit_free_generation3.py
      - name: JS syntax
        run: |
          node --check public/app.js
          node --check public/admin.js
          node --check public/sw.js
      - name: Release invariants
        run: |
          git diff --check
          grep -Fq "caches.match(url,{ignoreSearch:true})" public/app.js
          grep -Fq '"freeGeneration":3' data/puzzles.json
          grep -Fq '"publicLegacyMode":"compact-index"' public/puzzles.json
          grep -Fq 'g3-m-201' data/rolling_content_v1.json
          grep -Fq 'stableFreeLevelSlots' server.py
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('data/puzzles.json').read_text(encoding='utf-8'))
          public=json.loads(Path('public/puzzles.json').read_text(encoding='utf-8'))
          rolling=json.loads(Path('data/rolling_content_v1.json').read_text(encoding='utf-8'))
          rejected={'NOCEBO','TREBUCHET','SOFISMUS','ČERNODÍRA','PERIGEUM','AEROGEL'}
          assert data['free']==public['free']
          assert all(not bank for bank in public.get('legacyFree',{}).values())
          assert Path('public/puzzles.json').stat().st_size < Path('data/puzzles.json').stat().st_size
          active_words={a['word'] for bank in data['free'].values() for p in bank for a in p['answers']}
          assert not (rejected & active_words), rejected & active_words
          assert len(public.get('legacyFreeIndex',{})) >= 800
          assert all(int((p.get('meta') or {}).get('contentGeneration') or 0)==3 for bank in rolling.get('puzzles',{}).values() for p in bank)
          print('public bytes',Path('public/puzzles.json').stat().st_size,'server bytes',Path('data/puzzles.json').stat().st_size)
          PY
          ! grep -Eq 'PŘEVEDENO|Převedeno|převedených|dřívější verze|Původní výsledky' public/app.js
      - name: Commit generated preview
        run: |
          git config user.name 'Proplet Gen3 Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -f tools/apply_v3316_gen3_patch.py tools/finalize_v3316_gen3.py .github/workflows/v3316-gen3-preview.yml
          git add tools/build_lexicon_v2.py tools/generate_puzzles.py tools/generate_free_generation3.py tools/generate_rolling_content.py tools/audit_free_generation3.py data/lexicon_v2.json data/answer_tiers.json data/puzzles.json public/puzzles.json data/rolling_content_v1.json public/app.js public/admin.js public/sw.js server.py FREE_GENERATION3_AUDIT.json FREE_GENERATION3_AUDIT_CZ.md ROLLING_CONTENT_V3_30_AUDIT.json
          git add -u tools/apply_v3316_gen3_patch.py tools/finalize_v3316_gen3.py .github/workflows/v3316-gen3-preview.yml
          git commit -m 'Proplet v3.31.6 Gen3 progression preview'
          git push
