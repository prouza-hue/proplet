name: Diagnose Proplet v3.31.7 phase2

on:
  push:
    branches: [preview/v3317-rankings-teams]
    paths:
      - '.github/workflows/v3317-phase2-diagnose.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture patch failure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/patch_v3317_rankings_phase2.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("if n!=2: raise SystemExit(f'expected 2 incoming-earlier team patches, got {n}')", "if n!=1: raise SystemExit(f'expected 1 incoming-earlier team patch, got {n}')")
          p.write_text(s,encoding='utf-8')
          PY
          set +e
          python tools/patch_v3317_rankings_phase2.py > /tmp/phase2.out 2>&1
          code=$?
          set -e
          printf 'exit_code=%s\n\n' "$code" > V3317_PHASE2_DIAGNOSTIC.txt
          cat /tmp/phase2.out >> V3317_PHASE2_DIAGNOSTIC.txt
          if [ "$code" -eq 0 ]; then echo 'PATCH_SUCCEEDED' >> V3317_PHASE2_DIAGNOSTIC.txt; fi
      - name: Publish diagnostic
        shell: bash
        run: |
          git config user.name 'prouza-hue'
          git config user.email 'prouza@gmail.com'
          git add V3317_PHASE2_DIAGNOSTIC.txt
          git commit -m 'Capture v3.31.7 phase2 diagnostic'
          git push origin HEAD:preview/v3317-rankings-teams
