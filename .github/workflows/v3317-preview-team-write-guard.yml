name: Guard v3.31.7 preview team writes

on:
  push:
    branches: [preview/v3317-rankings-teams]
    paths:
      - '.github/workflows/v3317-preview-team-write-guard.yml'

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch and verify
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server.py')
          s=p.read_text(encoding='utf-8')
          marker='    player = auth_player(authorization)\n'
          targets=[
            ('def set_team_membership(payload: TeamMembershipSet, request: Request, authorization: Optional[str] = Header(default=None)):', 'team membership'),
            ('def family_league_settings(payload: FamilyLeagueSettings, request: Request, authorization: Optional[str] = Header(default=None)):', 'team visibility settings'),
            ('def leave_team(request: Request, authorization: Optional[str] = Header(default=None)):', 'team leave'),
          ]
          guard='    if VERCEL_ENV == "preview":\n        raise HTTPException(409, "V preview se týmová data z bezpečnostních důvodů nemění")\n'
          for signature,label in targets:
            start=s.find(signature)
            if start < 0: raise SystemExit(f'{label}: signature not found')
            pos=s.find(marker,start)
            if pos < 0: raise SystemExit(f'{label}: auth marker not found')
            insert=pos+len(marker)
            if s[insert:insert+len(guard)] != guard:
              s=s[:insert]+guard+s[insert:]
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile server.py
          node --check public/app.js
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s=Path('server.py').read_text(encoding='utf-8')
          assert s.count('V preview se týmová data z bezpečnostních důvodů nemění') == 3
          assert 'def team_code_for_player_at' in s
          assert 'player.get("public_rankings") is True' in s
          print('preview team-write guard PASS')
          PY
      - name: Commit clean tree
        shell: bash
        run: |
          git config user.name 'prouza-hue'
          git config user.email 'prouza@gmail.com'
          git rm -f .github/workflows/v3317-preview-team-write-guard.yml
          git add server.py
          git diff --cached --check
          git commit -m 'Guard team mutations in v3.31.7 preview'
          git push origin HEAD:preview/v3317-rankings-teams
