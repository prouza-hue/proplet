name: Proplet v3.31.7 rankings preview

on:
  push:
    branches: [preview/v3317-rankings-teams]
    paths:
      - 'tools/patch_v3317_rankings_preview.py'
      - '.github/workflows/v3317-rankings-preview.yml'

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v3.31.7 patch
        run: python tools/patch_v3317_rankings_preview.py

      - name: Static checks
        shell: bash
        run: |
          python -m py_compile server.py
          node --check public/app.js
          git diff --check
          python - <<'PY'
          from pathlib import Path
          server=Path('server.py').read_text(encoding='utf-8')
          app=Path('public/app.js').read_text(encoding='utf-8')
          html=Path('public/index.html').read_text(encoding='utf-8')
          sw=Path('public/sw.js').read_text(encoding='utf-8')
          migration=Path('SUPABASE_MIGRATION_V3_31_7.sql').read_text(encoding='utf-8')
          assert 'APP_VERSION = "3.31.7"' in server
          assert "const APP_VERSION='3.31.7';" in app
          assert "proplet-v3.31.7-rankings-teams" in sw
          assert '/api/rankings/xp' in server and '/api/rankings/daily' in server
          assert 'xpLeaderboardList' in html and 'dailyLeaderboardList' in html
          assert 'team_code_at_completion' in migration and 'team_memberships' in migration
          assert 'EXPECTED_PUZZLE_DB_VERSION=10' in app
          assert 'COMPATIBLE_PUZZLE_DB_VERSIONS=new Set([9,EXPECTED_PUZZLE_DB_VERSION])' in app
          print('v3.31.7 static contract PASS')
          PY

      - name: Commit preview tree
        shell: bash
        run: |
          git config user.name 'prouza-hue'
          git config user.email 'prouza@gmail.com'
          git rm tools/patch_v3317_rankings_preview.py .github/workflows/v3317-rankings-preview.yml
          git add server.py public/app.js public/index.html public/styles.css public/sw.js SUPABASE_MIGRATION_V3_31_7.sql
          git diff --cached --check
          git commit -m 'Proplet v3.31.7 Rankings & Teams preview'
          git push origin HEAD:preview/v3317-rankings-teams
