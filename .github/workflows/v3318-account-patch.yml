name: v3.31.8 account patch

on:
  push:
    branches:
      - preview/v3318-account-recovery-google
    paths:
      - tools/apply_v3318_account_patch.py
      - .github/workflows/v3318-account-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/v3318-account-recovery-google
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic patch
        run: python tools/apply_v3318_account_patch.py
      - name: Static checks
        run: |
          python -m py_compile server.py account_auth.py
          git diff --check
      - name: Commit patched server
        run: |
          if git diff --quiet -- server.py; then
            echo "No server changes needed"
            exit 0
          fi
          git config user.name "Proplet Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add server.py
          git commit -m "Wire v3.31.8 account identity bridge"
          git push origin HEAD:preview/v3318-account-recovery-google
