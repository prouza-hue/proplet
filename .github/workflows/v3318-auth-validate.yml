name: v3.31.8 auth validation

on:
  push:
    branches:
      - preview/v3318-account-recovery-google
    paths:
      - .github/workflows/v3318-auth-validate.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/v3318-account-recovery-google
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python syntax
        run: python -m py_compile server.py account_auth.py
      - name: JavaScript syntax
        run: node --check public/account-auth.js
      - name: Diff hygiene
        run: git diff --check
