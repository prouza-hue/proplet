name: v3.31.8 finalize auth

on:
  push:
    branches:
      - preview/v3318-account-recovery-google
    paths:
      - tools/finalize_v3318_auth.py
      - .github/workflows/v3318-finalize-auth.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/v3318-account-recovery-google
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply refinements
        run: python tools/finalize_v3318_auth.py
      - name: Validate
        run: |
          python -m py_compile server.py account_auth.py
          node --check public/account-auth.js
          git diff --check
      - name: Commit final candidate changes
        run: |
          git config user.name "Proplet Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add account_auth.py public/account-auth.js public/account-auth.css public/theme-init.js public/sw.js
          git commit -m "Finalize v3.31.8 recovery and Google auth UX"
          git push origin HEAD:preview/v3318-account-recovery-google
