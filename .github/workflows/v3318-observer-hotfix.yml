name: v3.31.8 observer hotfix

on:
  push:
    branches: [preview/v3318-account-recovery-google]
    paths: [.github/workflows/v3318-observer-hotfix.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/v3318-account-recovery-google
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Narrow observer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/account-auth.js')
          s=p.read_text()
          old="new MutationObserver(scheduleEnhance).observe(card,{childList:true,subtree:true})"
          new="new MutationObserver(scheduleEnhance).observe(card,{childList:true})"
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
          node --check public/account-auth.js
          git diff --check
      - name: Commit clean hotfix
        run: |
          git config user.name "Proplet Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/v3318-observer-hotfix.yml
          git add public/account-auth.js
          git commit -m "Prevent profile auth refresh observer loop"
          git push origin HEAD:preview/v3318-account-recovery-google
