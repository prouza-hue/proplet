name: v3.32.5 one-shot runtime patcher

on:
  push:
    branches: [agent/v3325-gesture-runtime-cleanup]

permissions:
  contents: write

jobs:
  patch-large-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v3325-gesture-runtime-cleanup
      - name: Apply asserted narrow patches
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'public/index.html',
              '  <script src="/theme-init.js"></script>',
              '  <script src="/runtime-meta.js" data-proplet-runtime-meta="1" data-loaded="1"></script>\n  <script src="/theme-init.js"></script>'
          )
          replace_once(
              'public/app.js',
              "const APP_VERSION='3.31.9';",
              "const APP_VERSION=window.PROPLET_RUNTIME_META?.version||'0.0.0';"
          )
          replace_once(
              'server.py',
              'from zoneinfo import ZoneInfo\n',
              'from zoneinfo import ZoneInfo\n\nfrom proplet_version import APP_VERSION, PHONE_LANDSCAPE_BLOCKING, TABLET_LANDSCAPE_BREAKPOINT_PX\n'
          )
          replace_once('server.py', 'APP_VERSION = "3.31.9"\n', '')
          replace_once(
              'server.py',
              '        "tabletGameLayoutBreakpointPx": 1000,',
              '        "tabletGameLayoutBreakpointPx": TABLET_LANDSCAPE_BREAKPOINT_PX,'
          )
          replace_once(
              'server.py',
              '        "orientationBlocking": False,',
              '        "orientationBlocking": PHONE_LANDSCAPE_BLOCKING,'
          )

          # One-shot helper: the final branch must not carry release machinery that exists only
          # to work around the connector's lack of line-based patching for 200kB files.
          Path('.github/workflows/v3325-runtime-patcher.yml').unlink()
          PY
      - name: Verify syntax and invariants
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile server.py proplet_version.py
          node --check public/app.js
          node --check public/theme-init.js
          node --check public/runtime-meta.js
          node --check public/gesture-guard-v3325.js
          node --check public/version.js
          node --check public/sw.js
          grep -Fq "const APP_VERSION=window.PROPLET_RUNTIME_META?.version" public/app.js
          grep -Fq '"orientationBlocking": PHONE_LANDSCAPE_BLOCKING' server.py
          grep -Fq '"tabletGameLayoutBreakpointPx": TABLET_LANDSCAPE_BREAKPOINT_PX' server.py
      - name: Commit final branch state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html public/app.js server.py .github/workflows/v3325-runtime-patcher.yml
          git commit -m 'Proplet v3.32.5 — align runtime metadata and health markers [skip ci]'
          git push origin HEAD:agent/v3325-gesture-runtime-cleanup
