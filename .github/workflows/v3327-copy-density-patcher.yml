name: v3.32.7 one-shot copy density patcher

on:
  push:
    branches: [agent/v3327-copy-density-polish]

permissions:
  contents: write

jobs:
  patch-copy-density:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v3327-copy-density-polish
      - name: Apply asserted copy-density polish
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text()
              count=text.count(old)
              if count!=1:
                  raise SystemExit(f'{path}: expected exactly 1 match, got {count}: {old[:100]!r}')
              p.write_text(text.replace(old,new,1))

          replace_once('public/index.html','<div class="screen-title"><span class="eyebrow">VOLNÁ HRA</span><h1>Na co si troufáš?</h1><p class="muted">Každá nová úroveň přidá XP. Série roste jen Denní výzvou.</p></div>','<div class="screen-title"><span class="eyebrow">VOLNÁ HRA</span><h1>Na co si troufáš?</h1><p class="muted">Série roste jen Denní výzvou.</p></div>')
          replace_once('public/index.html','<div class="screen-title"><span class="eyebrow">POŘADÍ</span><h1>Kdo dnes vládne?</h1><p class="muted">XP ukazuje postup. Denní výzva zase to, kdo stejný Proplet zahrál nejlépe.</p></div>','<div class="screen-title"><span class="eyebrow">POŘADÍ</span><h1>Kdo dnes vládne?</h1></div>')
          replace_once('public/index.html','<div class="ranking-section-head"><div><span class="eyebrow">🏆 XP</span><h2>Nasbírané XP</h2><p class="muted">Jednoduše: kdo v daném období získal nejvíc XP.</p></div></div>','<div class="ranking-section-head"><div><h2>🏆 Nasbírané XP</h2></div></div>')
          replace_once('public/index.html','<div id="profileModal" class="modal hidden" role="dialog" aria-modal="true">','<div id="profileModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Hráčský účet">')
          replace_once('public/index.html','<span class="eyebrow">ODEHRANÉ ÚROVNĚ</span>\n      <h2 id="playedLevelsTitle">Tvoje kola</h2>\n      <p id="playedLevelsMeta" class="muted"></p>','<div class="played-levels-head"><div class="played-levels-heading"><span id="playedLevelsIcon" class="played-levels-icon"></span><h2 id="playedLevelsTitle">Tvoje kola</h2></div><div id="playedLevelsProgress" class="played-levels-progress" aria-label="Postup"></div></div>\n      <p id="playedLevelsMeta" class="muted played-levels-meta"></p>')
          replace_once('public/index.html','<button data-difficulty-rating="-1">Lehčí</button>\n          <button data-difficulty-rating="0">Akorát</button>\n          <button data-difficulty-rating="1">Těžší</button>','<button data-difficulty-rating="-1">Moc lehká</button>\n          <button data-difficulty-rating="0">Akorát</button>\n          <button data-difficulty-rating="1">Moc těžká</button>')

          replace_once('public/app.js',"const {total,done,actual,transferred,pct,resume,nextUnsolved}=freeProgress(key),nextLevel=Number((resume||nextUnsolved)?.meta?.level)||null,progressLabel=resume?`ROZEHRÁNO${nextLevel?` · ÚROVEŇ ${nextLevel}`:''}`:(done===total?`${done}/${total} HOTOVO`:`ÚROVEŇ ${nextLevel||1} Z ${total}`);","const {total,done,actual,transferred,pct,resume,nextUnsolved}=freeProgress(key),nextLevel=Number((resume||nextUnsolved)?.meta?.level)||null,progressLabel=resume?`ROZEHRÁNO${nextLevel?` · ÚROVEŇ ${nextLevel}`:''}`:'';")
          replace_once('public/app.js','<span class="eyebrow">${progressLabel}</span><div class="difficulty-heading-line"><h2>${d.label}</h2></div>','${progressLabel?`<span class="eyebrow">${progressLabel}</span>`:``}<div class="difficulty-heading-line"><h2>${d.label}</h2></div>')
          replace_once('public/app.js','>▦ Postup a úrovně${done?` · ${done} splněných`:``}</button>','>▦ Postup a úrovně</button>')
          replace_once('public/app.js',"const d=DIFF[diff],modal=$('#playedLevelsModal');$('#playedLevelsTitle').textContent=`${d.label} · tvoje úrovně`;$('#playedLevelsMeta').textContent='Načítám tvůj postup…';$('#playedLevelsList').innerHTML='';modal.classList.remove('hidden');","const d=DIFF[diff],modal=$('#playedLevelsModal'),card=modal.querySelector('.played-levels-card');card.dataset.diff=diff;$('#playedLevelsIcon').innerHTML=difficultyIconMarkup(diff,'played-levels-difficulty-icon');$('#playedLevelsTitle').textContent=`${d.label} · tvoje úrovně`;$('#playedLevelsProgress').innerHTML='<strong>…</strong><small>z 200</small>';$('#playedLevelsProgress').style.setProperty('--progress','0%');$('#playedLevelsMeta').textContent='Načítám tvůj postup…';$('#playedLevelsList').innerHTML='';modal.classList.remove('hidden');")
          replace_once('public/app.js',"const actual=summary?.actual??levels.filter(r=>!r.transferred).length,transferred=summary?.transferred??levels.filter(r=>r.transferred).length,total=summary?.total??sortedFreeBank(diff).length;$('#playedLevelsMeta').textContent=levels.length?`Postup ${levels.length}/${total}`:'Zatím tu nic není. Nejdřív něco propleť.';","const actual=summary?.actual??levels.filter(r=>!r.transferred).length,transferred=summary?.transferred??levels.filter(r=>r.transferred).length,total=summary?.total??sortedFreeBank(diff).length,done=actual+transferred,pct=total?Math.round(done/total*100):0;$('#playedLevelsProgress').innerHTML=`<strong>${done}</strong><small>z ${total}</small>`;$('#playedLevelsProgress').style.setProperty('--progress',`${pct}%`);$('#playedLevelsMeta').textContent=levels.length?'':'Zatím tu nic není. Nejdřív něco propleť.';")
          replace_once('public/app.js',"${r.transferred?`<strong>Úroveň ${r.level} · Splněno</strong><small>Postup je započítaný. Tuhle desku si můžeš kdykoli zahrát bez dalších XP.</small>`:`<strong>${fmtTime(r.elapsedMs)}</strong>","${r.transferred?`<strong>Splněno</strong><small>Lze zahrát znovu · bez XP</small>`:`<strong>${fmtTime(r.elapsedMs)}</strong>")
          replace_once('public/app.js',"<span>${rec.cleanSolve?'✨ Čistě':`💡 ${countCz(rec.hintsUsed||0,'nápověda','nápovědy','nápověd')}`} · ${countCz(rec.moves,'tah','tahy','tahů')}</span><small>Do pořadí se počítá první dokončený pokus.</small>","<span>${rec.cleanSolve?'✨ Čistě':`💡 ${countCz(rec.hintsUsed||0,'nápověda','nápovědy','nápověd')}`} · ${countCz(rec.moves,'tah','tahy','tahů')}</span>")
          replace_once('public/app.js',"['Vše synchronizováno',inTeam?'Cloud i týmové pořadí jsou aktuální':'Postup je bezpečně v cloudu']","['Vše synchronizováno',inTeam?'Výsledky i týmové pořadí jsou aktuální':'Všechny výsledky jsou aktuální']")
          replace_once('public/app.js',"const render=tab=>{const active=tab==='team'?'team':'world';container.classList.add('free-level-board');container.classList.remove('daily-global-board','hidden');container.innerHTML=","const render=tab=>{const active=tab==='team'?'team':'world';container.classList.add('free-level-board');container.classList.remove('daily-global-board','hidden');if(container.id==='levelLeaderboardBox')$('#winModal').classList.add('comparison-loaded');container.innerHTML=")
          replace_once('public/app.js',"container.classList.remove('free-level-board');container.classList.add('daily-global-board');container.classList.remove('hidden');","container.classList.remove('free-level-board');container.classList.add('daily-global-board');container.classList.remove('hidden');if(container.id==='levelLeaderboardBox')$('#winModal').classList.add('comparison-loaded');")
          replace_once('public/app.js',"$('#winModal').classList.remove('starter-win');$('#starterHardActions')?.classList.add('hidden');","$('#winModal').classList.remove('starter-win','comparison-loaded');$('#starterHardActions')?.classList.add('hidden');")
          replace_once('public/app.js',"$('#winBadge').textContent='☀️';renderCompletionPraise(p.difficulty,rec);","$('#winModal').classList.remove('comparison-loaded');$('#winBadge').textContent='☀️';renderCompletionPraise(p.difficulty,rec);")

          styles=Path('public/styles.css'); css=styles.read_text(); marker='/* v3.32.7 — copy redundancy & density polish */'
          if marker in css: raise SystemExit('styles.css already contains v3.32.7 marker')
          css += '''\n\n/* v3.32.7 — copy redundancy & density polish */\n#screen-daily.home-layout-active .daily-hero .hero-topline{display:none}\n#profileModal .account-modal-card>.eyebrow,#profileModal #profileModalTitle{display:none}\n#profileModal .account-tabs{margin-top:0}\n#profileModal #profileModalDesc{margin-top:12px}\n#levelDetailEyebrow,.level-detail-card .compact-head .eyebrow{display:none}\n.level-detail-card .compact-head{margin-top:7px}\n.played-levels-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 0 8px}\n.played-levels-heading{display:flex;align-items:center;gap:11px;min-width:0}\n.played-levels-heading h2{margin:0!important}\n.played-levels-icon{flex:0 0 auto;width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:#eee9ff}\n.played-levels-difficulty-icon{width:31px;height:31px;display:block}\n.played-levels-card[data-diff="easy"]{--played-diff:#45b98e;--played-soft:#dff5ec}\n.played-levels-card[data-diff="medium"]{--played-diff:#4e83d5;--played-soft:#e5efff}\n.played-levels-card[data-diff="hard"]{--played-diff:#f08a32;--played-soft:#fff0dc}\n.played-levels-card[data-diff="hardcore"]{--played-diff:#941522;--played-soft:#f8e4e7}\n.played-levels-card .played-levels-icon{background:var(--played-soft,#eee9ff);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--played-diff,#6c5ce7) 18%,transparent)}\n.played-levels-progress{position:relative;flex:0 0 auto;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--played-diff,#6c5ce7) var(--progress),#eee9f2 0);box-shadow:0 5px 14px rgba(63,51,99,.07)}\n.played-levels-progress:before{content:"";position:absolute;inset:6px;border-radius:50%;background:#fffefd}\n.played-levels-progress strong,.played-levels-progress small{position:relative;z-index:1;display:block;text-align:center;line-height:1}\n.played-levels-progress strong{font-size:15px}\n.played-levels-progress small{margin-top:2px;font-size:9px;color:var(--muted);font-weight:850}\n.played-levels-meta:empty{display:none}\n#winModal.comparison-loaded .win-summary>p{display:none}\n#winModal.comparison-loaded .win-summary{margin:4px 0 7px;padding:8px 10px}\n#winModal.comparison-loaded .win-card{padding-top:17px}\n#winModal.comparison-loaded .win-badge{font-size:40px;line-height:1}\n#winModal.comparison-loaded .win-card h2{margin:1px 0 3px}\n#winModal.comparison-loaded .win-praise{margin:0 auto 5px}\nhtml[data-theme="dark"] .played-levels-progress{background:conic-gradient(var(--played-diff,#9b8cff) var(--progress),#302c3b 0)}\nhtml[data-theme="dark"] .played-levels-progress:before{background:#1b1926}\n@media(max-width:390px){.played-levels-icon{width:40px;height:40px}.played-levels-difficulty-icon{width:28px;height:28px}.played-levels-progress{width:56px;height:56px}.played-levels-head{gap:10px}}\n@media(min-width:520px){#winModal.comparison-loaded .win-card{padding-top:14px}#winModal.comparison-loaded .win-badge{font-size:36px}}\n'''
          styles.write_text(css)

          replace_once('proplet_version.py','APP_VERSION = "3.32.6"','APP_VERSION = "3.32.7"')
          replace_once('public/runtime-meta.js',"version:'3.32.6'","version:'3.32.7'")
          replace_once('public/sw.js',"const CACHE='proplet-v3.32.6-auth-recovery-r1';","const CACHE='proplet-v3.32.7-copy-density-r1';")
          PY

      - name: Remove one-shot workflow and commit result
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v3327-copy-density-patcher.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/app.js public/styles.css public/runtime-meta.js public/sw.js proplet_version.py .github/workflows/v3327-copy-density-patcher.yml
          git commit -m "Proplet v3.32.7 — copy redundancy and density polish [skip ci]"
          git push origin HEAD:agent/v3327-copy-density-polish
