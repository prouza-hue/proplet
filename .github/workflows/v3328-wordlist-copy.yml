name: v3328 wordlist copy

on:
  push:
    branches: [agent/v3328-valid-word-feedback]

permissions:
  contents: write

jobs:
  copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v3328-valid-word-feedback
      - name: Publish broad Czech detector list
        shell: bash
        run: |
          set -euo pipefail
          cp data/words.txt public/valid-words-v3328.txt
          test -s public/valid-words-v3328.txt
          grep -Fxiq 'stáj' public/valid-words-v3328.txt || echo '::warning::STÁJ is not present in broad detector list'
          grep -Fxiq 'starost' public/valid-words-v3328.txt || echo '::warning::STAROST is not present in broad detector list'
          rm .github/workflows/v3328-wordlist-copy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Proplet v3.32.8 — publish broad valid-word detector [skip ci]'
          git push
