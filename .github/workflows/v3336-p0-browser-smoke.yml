name: v3.33.6 P0 browser smoke

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/v3336-p0-browser-smoke.yml']

permissions:
  contents: read

jobs:
  p0-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PREVIEW_URL: https://proplet-git-hotfix-v3336-p0-fold-starter-pavel-prouzas-projects.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Verify starter transition and Fold web layout
        shell: bash
        run: |
          cat > /tmp/p0.py <<'PY'
          import os,time,json
          from playwright.sync_api import sync_playwright
          URL=os.environ['PREVIEW_URL']
          CHROME=next(p for p in ('/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium') if os.path.exists(p))

          def wait(fn,timeout=8000,label='condition'):
              end=time.time()+timeout/1000; last=None
              while time.time()<end:
                  try:
                      last=fn()
                      if last:return last
                  except Exception as e:last=repr(e)
                  time.sleep(.1)
              raise AssertionError(f'{label}: {last!r}')

          def prep(page):
              page.route('**/api/**',lambda route: route.fulfill(status=200,content_type='application/json',body='{}') if route.request.method!='GET' else route.continue_())
              page.goto(URL,wait_until='domcontentloaded',timeout=30000)
              wait(lambda:page.evaluate("typeof startStarter==='function' && !!window.PROPLET_RUNTIME_META && !!puzzleDB"),12000,'runtime')
              page.evaluate("""()=>{
                localStorage.setItem('proplet-release-notes-seen:3.33.1','1');
                document.querySelector('#onboardingModal')?.classList.add('hidden');
                document.querySelector('.release-notes-v3331-backdrop')?.remove();
                document.body.classList.remove('release-notes-v3331-open');
              }""")

          def finish_starter(page):
              page.evaluate('startStarter()')
              page.locator('#screen-game.active').wait_for(state='visible',timeout=5000)
              page.evaluate("""()=>{
                const answers=[...currentGame.puzzle.answers];
                for(const a of answers){currentGame.path=[...a.path];submitPath()}
              }""")
              page.locator('#winModal.starter-win:not(.hidden)').wait_for(state='visible',timeout=5000)
              page.locator('#starterHardActions:not(.hidden)').wait_for(state='visible',timeout=5000)

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,executable_path=CHROME,args=['--no-sandbox','--disable-dev-shm-usage'])

              # P0-1: both hard-day starter choices must dismiss the interstitial before the next board starts.
              ctx=browser.new_context(viewport={'width':390,'height':844}); page=ctx.new_page(); prep(page)
              finish_starter(page)
              page.locator('#starterWarmupBtn').click()
              wait(lambda:page.evaluate("document.querySelector('#winModal').classList.contains('hidden') && currentGame?.mode==='free'"),5000,'warmup transition')
              assert page.locator('#screen-game.active').is_visible()
              finish_starter(page)
              page.locator('#starterHardDailyBtn').click()
              wait(lambda:page.evaluate("document.querySelector('#winModal').classList.contains('hidden') && currentGame?.mode==='daily'"),5000,'daily transition')
              assert page.locator('#screen-game.active').is_visible()
              ctx.close()

              # P0-2: unfolded Fold browser = wide but short viewport. Keep rail and rounded-square cells.
              ctx=browser.new_context(viewport={'width':720,'height':500}); page=ctx.new_page(); prep(page)
              page.evaluate("()=>startGame(puzzleDB.free.medium[0],'free')")
              page.locator('#screen-game.active').wait_for(state='visible',timeout=5000);page.wait_for_timeout(350)
              layout=page.evaluate("""()=>{
                const main=getComputedStyle(document.querySelector('.game-main'));
                const c=document.querySelector('#board .cell'); const cs=getComputedStyle(c); const r=c.getBoundingClientRect();
                const radius=parseFloat(cs.borderTopLeftRadius)||0;
                return {cols:main.gridTemplateColumns,width:r.width,height:r.height,radius,ratio:radius/Math.min(r.width,r.height),actionsX:document.querySelector('.game-control-column').getBoundingClientRect().x,boardRight:document.querySelector('.game-board-column').getBoundingClientRect().right};
              }""")
              assert len(layout['cols'].split())>=2,layout
              assert layout['actionsX']>=layout['boardRight']-2,layout
              assert layout['ratio']<0.35,layout
              print(json.dumps({'ok':True,'fold':layout},ensure_ascii=False))
              ctx.close();browser.close()
          PY
          python /tmp/p0.py
