name: v3.34 Generation 4 contract

on:
  push:
    branches:
      - agent/v3340-medium-calibration-v3
    paths:
      - 'data/target_generation_exclusions_v334.json'
      - 'data/gen4_profiles_v334.json'
      - 'data/rolling_content_v1.json'
      - 'server.py'
      - 'tools/generate_v334_calibration.py'
      - 'tools/generate_v334_calibration_v3.py'
      - 'tools/validate_v334_calibration_v3.py'
      - 'tools/audit_v334_difficulty.py'
      - 'tools/review_v334_lexicon.py'
      - 'tools/measure_gen4_ambiguity.py'
      - 'tools/validate_gen4_release.py'
      - 'tools/build_gen4_archive.py'
      - 'tools/generate_gen4_candidates.py'
      - 'tools/assemble_gen4_release.py'
      - 'tools/test_v334_rolling_pause.py'
      - 'SUPABASE_MIGRATION_V3_34_GEN4_ARCHIVE.sql'
      - 'SUPABASE_VERIFY_V3_34_GEN4_ARCHIVE.sql'
      - 'docs/SPRINT_V3_34_DIFFICULTY_CALIBRATION.md'
      - '.github/workflows/v334-calibration.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'data/target_generation_exclusions_v334.json'
      - 'data/gen4_profiles_v334.json'
      - 'data/rolling_content_v1.json'
      - 'server.py'
      - 'tools/generate_v334_calibration.py'
      - 'tools/generate_v334_calibration_v3.py'
      - 'tools/validate_v334_calibration_v3.py'
      - 'tools/audit_v334_difficulty.py'
      - 'tools/review_v334_lexicon.py'
      - 'tools/measure_gen4_ambiguity.py'
      - 'tools/validate_gen4_release.py'
      - 'tools/build_gen4_archive.py'
      - 'tools/generate_gen4_candidates.py'
      - 'tools/assemble_gen4_release.py'
      - 'tools/test_v334_rolling_pause.py'
      - 'SUPABASE_MIGRATION_V3_34_GEN4_ARCHIVE.sql'
      - 'SUPABASE_VERIFY_V3_34_GEN4_ARCHIVE.sql'
      - 'docs/SPRINT_V3_34_DIFFICULTY_CALIBRATION.md'
      - '.github/workflows/v334-calibration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax check
        run: |
          python -m py_compile tools/generate_v334_calibration.py
          python -m py_compile tools/generate_v334_calibration_v3.py
          python -m py_compile tools/validate_v334_calibration_v3.py
          python -m py_compile tools/audit_v334_difficulty.py
          python -m py_compile tools/review_v334_lexicon.py

      - name: Audit current Generation 3
        run: |
          mkdir -p /tmp/v334
          python tools/audit_v334_difficulty.py \
            --source data/puzzles.json \
            --json /tmp/v334/gen3-audit.json

      - name: Generate frozen V3 calibration fixture
        run: |
          python tools/generate_v334_calibration_v3.py \
            --medium 6 \
            --hard 4 \
            --output /tmp/v334/calibration-v3.json

      - name: Validate V3 playtest contract
        run: python tools/validate_v334_calibration_v3.py /tmp/v334/calibration-v3.json

      - name: Audit calibration bank
        run: |
          python tools/audit_v334_difficulty.py \
            --source /tmp/v334/calibration-v3.json \
            --json /tmp/v334/gen4-calibration-v3-audit.json

      - name: Build lexicon review shortlist
        run: |
          python tools/review_v334_lexicon.py \
            --output /tmp/v334/V334_LEXICON_REVIEW_CANDIDATES.md \
            --limit 70

      - name: Upload calibration evidence
        uses: actions/upload-artifact@v4
        with:
          name: v334-calibration-lab-v3
          path: /tmp/v334/
          if-no-files-found: error
          retention-days: 14

      - name: Publish preview-only fixture to calibration branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          cp /tmp/v334/calibration-v3.json public/calibration-v334.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/calibration-v334.json
          if git diff --cached --quiet; then
            echo 'Calibration fixture already current.'
            exit 0
          fi
          git commit -m 'Refresh v3.34 V3 calibration preview fixture'
          git push origin HEAD:${GITHUB_REF_NAME}

  gen4-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax check Gen4 release tooling
        run: |
          python -m py_compile tools/measure_gen4_ambiguity.py
          python -m py_compile tools/validate_gen4_release.py
          python -m py_compile tools/build_gen4_archive.py
          python -m py_compile tools/generate_gen4_candidates.py
          python -m py_compile tools/assemble_gen4_release.py
          python -m py_compile tools/test_v334_rolling_pause.py

      - name: Install runtime dependencies for rolling regression
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify Gen3 rolling release is paused
        run: python tools/test_v334_rolling_pause.py

      - name: Measure calibrated local ambiguity
        run: |
          mkdir -p /tmp/gen4-contract
          python tools/measure_gen4_ambiguity.py public/calibration-v334.json \
            --lexicon data/answer_tiers.json \
            --output /tmp/gen4-contract/ambiguity-v3.json

      - name: Validate frozen fixture through release validator
        run: |
          python tools/validate_gen4_release.py public/calibration-v334.json \
            --profiles data/gen4_profiles_v334.json \
            --exclusions data/target_generation_exclusions_v334.json \
            --allow-calibration-ids \
            --report /tmp/gen4-contract/release-contract-v3.json

      - name: Rehearse metadata catalog and cold archive
        run: |
          python tools/build_gen4_archive.py data/puzzles.json \
            --rolling data/rolling_content_v1.json \
            --catalog /tmp/gen4-contract/content-catalog.json \
            --cold-dir /tmp/gen4-contract/cold
          python - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path('/tmp/gen4-contract/content-catalog.json').read_text())
          assert catalog['contentCount'] > 0
          forbidden = {'letters', 'answers', 'path'}
          assert not forbidden.intersection(json.dumps(catalog).casefold().split('"'))
          print(f"Catalog clean: {catalog['contentCount']} immutable contents, {catalog['contextCount']} contexts")
          PY

      - name: Upload Gen4 contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: v334-gen4-contract
          path: /tmp/gen4-contract/
          if-no-files-found: error
          retention-days: 30

  gen4-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - bank: free
            difficulty: easy
            level: 1
          - bank: free
            difficulty: medium
            level: 2
          - bank: free
            difficulty: hard
            level: 1
          - bank: free
            difficulty: hardcore
            level: 1
          - bank: starter
            difficulty: easy
            level: 1
          - bank: rescue
            difficulty: rescue
            level: 1
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate one production-shaped candidate
        run: |
          mkdir -p /tmp/gen4-smoke
          python tools/generate_gen4_candidates.py \
            --bank ${{ matrix.bank }} \
            --difficulty ${{ matrix.difficulty }} \
            --count 1 \
            --start-level ${{ matrix.level }} \
            --seed $((20260822 + ${{ matrix.level }})) \
            --output /tmp/gen4-smoke/${{ matrix.bank }}-${{ matrix.difficulty }}.json

      - name: Validate candidate contract
        run: |
          python tools/validate_gen4_release.py /tmp/gen4-smoke/${{ matrix.bank }}-${{ matrix.difficulty }}.json \
            --profiles data/gen4_profiles_v334.json \
            --exclusions data/target_generation_exclusions_v334.json \
            --report /tmp/gen4-smoke/${{ matrix.bank }}-${{ matrix.difficulty }}-validation.json

      - name: Upload smoke candidate
        uses: actions/upload-artifact@v4
        with:
          name: v334-gen4-smoke-${{ matrix.bank }}-${{ matrix.difficulty }}
          path: /tmp/gen4-smoke/
          if-no-files-found: error
          retention-days: 14
