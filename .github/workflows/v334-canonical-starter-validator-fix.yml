name: v3.34 canonical starter validator fix

on:
  push:
    branches:
      - agent/v3340-medium-calibration-v3
    paths:
      - .github/workflows/v334-canonical-starter-validator-fix.yml

permissions:
  contents: write

jobs:
  patch-validator:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v3340-medium-calibration-v3
          fetch-depth: 0
      - name: Treat starter-v1 as curated scripted UX asset
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/validate_gen4_release.py')
          s=p.read_text(encoding='utf-8')
          old='''    if not GEN4_ID.match(puzzle_id) and not (allow_calibration_ids and puzzle_id.startswith("cal-v334-")):
        errors.append(f"{label}: non-Gen4 id {puzzle_id!r}")
    if int(meta.get("contentGeneration") or 0) != 4:
        errors.append(f"{label}: contentGeneration != 4")
    if meta.get("verifiedUnique") is not True or meta.get("wideVerifiedUnique") is not True:
        errors.append(f"{label}: uniqueness evidence missing")
    if float(meta.get("endpointStartAdjacencyShare", -1)) != 0.0:
        errors.append(f"{label}: endpoint/start adjacency is not zero")
'''
          new='''    canonical_starter = bool(path and path[-1] == "starter" and puzzle_id == "starter-v1")
    if canonical_starter:
        if (rows, cols) != (5, 5):
            errors.append(f"{label}: canonical starter must remain 5x5")
        if [norm(answer.get("word")) for answer in answers] != ["mrak", "jablko", "čokoláda", "autobus"]:
            errors.append(f"{label}: canonical starter word script changed")
    else:
        if not GEN4_ID.match(puzzle_id) and not (allow_calibration_ids and puzzle_id.startswith("cal-v334-")):
            errors.append(f"{label}: non-Gen4 id {puzzle_id!r}")
        if int(meta.get("contentGeneration") or 0) != 4:
            errors.append(f"{label}: contentGeneration != 4")
        if meta.get("verifiedUnique") is not True or meta.get("wideVerifiedUnique") is not True:
            errors.append(f"{label}: uniqueness evidence missing")
        if float(meta.get("endpointStartAdjacencyShare", -1)) != 0.0:
            errors.append(f"{label}: endpoint/start adjacency is not zero")
'''
          if old not in s:
              raise SystemExit('validator Gen4 metadata block not found')
          s=s.replace(old,new,1)
          old2='''    for i, endpoint in enumerate(endpoints):
        for j, start in enumerate(starts):
            if i != j and neighbours(endpoint, start, cols):
                errors.append(f"{label}: answer {i} endpoint touches answer {j} start")
    return errors
'''
          new2='''    if not canonical_starter:
        for i, endpoint in enumerate(endpoints):
            for j, start in enumerate(starts):
                if i != j and neighbours(endpoint, start, cols):
                    errors.append(f"{label}: answer {i} endpoint touches answer {j} start")
    return errors
'''
          if old2 not in s:
              raise SystemExit('validator endpoint block not found')
          s=s.replace(old2,new2,1)
          old3='''def validate_profile(path: tuple[str, ...], puzzle: dict, profiles: dict, allow_calibration_ids: bool) -> list[str]:
    puzzle_id = str(puzzle.get("id") or "")
    if allow_calibration_ids and puzzle_id.startswith("cal-v334-"):
        return []
'''
          new3='''def validate_profile(path: tuple[str, ...], puzzle: dict, profiles: dict, allow_calibration_ids: bool) -> list[str]:
    puzzle_id = str(puzzle.get("id") or "")
    if path and path[-1] == "starter" and puzzle_id == "starter-v1":
        return []
    if allow_calibration_ids and puzzle_id.startswith("cal-v334-"):
        return []
'''
          if old3 not in s:
              raise SystemExit('validator profile block not found')
          s=s.replace(old3,new3,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile tools/validate_gen4_release.py
          python tools/test_v334_quality_release.py
          python tools/test_gen4_release_binder.py
      - name: Commit validator guardrail
        run: |
          git config user.name "proplet-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tools/validate_gen4_release.py
          git commit -m "fix: keep scripted starter outside Gen4 generation rules"
          git push origin HEAD:agent/v3340-medium-calibration-v3
