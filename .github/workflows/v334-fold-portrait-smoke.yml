name: Printshop browser smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'public/**'
      - 'backend/**'
      - 'server.py'
      - 'data/**'
      - 'content/**'
      - 'vercel.json'
      - 'tools/**'
      - 'tests/fixtures/browser/**'
      - '.github/workflows/v334-fold-portrait-smoke.yml'
  workflow_dispatch:

permissions: {contents: read}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  printshop-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_SHA: ${{ github.sha }}
      TEST_URL: http://127.0.0.1:8765
      RESULT_PATH: artifacts/idle-browser.json
      SMOKE_OUT: artifacts/printshop-smoke
      PYTHONUTF8: '1'
    steps:
      # For pull_request this is GitHub's merge candidate, not an old preview alias.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install pinned browser tooling
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/proplet-browser" playwright@1.57.0
          python -m playwright install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/proplet-browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Build the checked-out frontend
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          # Match the fixed browser date and Tajenka fixture; wall-clock builds age out.
          python - <<'PY'
          import json
          from datetime import date
          from tools.generate_puzzles_bootstrap import DEFAULT_SOURCE, DEFAULT_OUTPUT, build_bootstrap, validate
          raw = DEFAULT_SOURCE.read_bytes()
          source = json.loads(raw)
          data = build_bootstrap(source, raw, today=date(2026, 9, 15))
          encoded = json.dumps(data, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
          validate(source, data, len(raw), len(encoded))
          DEFAULT_OUTPUT.write_bytes(encoded)
          PY
          mkdir -p artifacts
      - name: Verify layout and idle lifecycle against isolated checkout
        shell: bash
        run: |
          node tools/browser_fixture_server.cjs > artifacts/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          node tools/test_extra_entry_browser.cjs
          python tools/test_printshop_browser.py
          RESULT_PATH=artifacts/account-progress.json node tools/test_account_progress_browser.cjs
          node tools/test_idle_offline_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: printshop-browser-smoke
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
