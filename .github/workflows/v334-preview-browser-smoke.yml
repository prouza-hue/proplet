name: v3.34 preview browser smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/v334-preview-browser-smoke.yml'

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREVIEW_URL: https://proplet-git-agent-v3340-medium-ca-024677-pavel-prouzas-projects.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight browser driver
        run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Run preview smoke
        shell: bash
        run: |
          cat > /tmp/smoke.py <<'PY'
          import json, os, time, uuid
          from urllib.parse import urlparse
          from playwright.sync_api import sync_playwright, TimeoutError as PlaywrightTimeoutError

          URL=os.environ['PREVIEW_URL'].rstrip('/')
          CHROME=next((p for p in ('/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser') if os.path.exists(p)),None)
          assert CHROME, 'Chrome/Chromium not present on runner'
          OUT='/tmp/proplet-browser-smoke'; os.makedirs(OUT,exist_ok=True)
          summary={'url':URL,'checks':{},'screenshots':[]}

          def wait_py(predicate, timeout=10000, step=100, label='condition'):
              deadline=time.time()+timeout/1000
              last=None
              while time.time()<deadline:
                  try:
                      value=predicate()
                      if value:return value
                      last=value
                  except Exception as e:last=repr(e)
                  time.sleep(step/1000)
              raise AssertionError(f'timeout waiting for {label}; last={last!r}')

          def visible(page, sel):
              try:return page.locator(sel).is_visible()
              except:return False

          def errors_for(page):
              errors=[]
              page.on('pageerror',lambda e: errors.append('pageerror: '+str(e)))
              page.on('console',lambda m: errors.append('console: '+m.text) if m.type=='error' else None)
              return errors

          def close_overlays(page):
              if visible(page,'#qualityReleaseModal:not(.hidden)'):page.locator('#qualityReleasePlay').click()
              page.wait_for_timeout(100)
              if visible(page,'#onboardingModal:not(.hidden)'):page.locator('#skipOnboardingBtn').click()
              page.wait_for_timeout(150)

          def load(page, *, release=True):
              page.goto(URL,wait_until='domcontentloaded',timeout=30000)
              page.locator('body').wait_for(state='attached',timeout=10000)
              wait_py(lambda:len(page.locator('body').inner_text().strip())>50,10000,label='non-empty body')
              if release:page.locator('#qualityReleaseModal:not(.hidden)').wait_for(state='visible',timeout=8000)
              page.wait_for_timeout(250)

          def modal_viewport_check(browser,w,h,label):
              ctx=browser.new_context(viewport={'width':w,'height':h})
              page=ctx.new_page();errs=errors_for(page)
              page.add_init_script("""
                window.__bootSamples=[];
                document.addEventListener('DOMContentLoaded',()=>{
                  const sample=()=>{const shell=document.querySelector('.app-shell');window.__bootSamples.push({t:performance.now(),boot:document.documentElement.classList.contains('gen4-preview-booting'),vis:shell?getComputedStyle(shell).visibility:null,modal:!!document.querySelector('#qualityReleaseModal:not(.hidden)')});};
                  sample();let n=0;const tick=()=>{sample();if(++n<100)requestAnimationFrame(tick)};requestAnimationFrame(tick);
                  new MutationObserver(sample).observe(document.documentElement,{attributes:true,attributeFilter:['class']});
                },{once:true});
              """)
              t=time.time();load(page);elapsed=time.time()-t
              card=page.locator('#qualityReleaseCard').bounding_box();assert card
              assert card['x']>=-1 and card['y']>=-1 and card['x']+card['width']<=w+1 and card['y']+card['height']<=h+1,(label,card)
              cols=page.locator('.quality-release-points').evaluate("e=>getComputedStyle(e).gridTemplateColumns.split(' ').filter(Boolean).length")
              assert cols==(1 if w<720 else 2),(label,cols)
              samples=page.evaluate('window.__bootSamples');bad=[s for s in samples if s.get('boot') and s.get('vis') not in (None,'hidden')]
              assert not bad,f'{label}: app shell visible during Gen4 boot guard: {bad[:3]}'
              assert elapsed<8.0,f'{label}: release modal slow/hanging: {elapsed:.2f}s'
              shot=f'{OUT}/modal-{label}.png';page.screenshot(path=shot,full_page=True);summary['screenshots'].append(shot)
              summary['checks'][f'modal_{label}']={'seconds':round(elapsed,2),'columns':cols,'card':card,'errors':errs}
              assert not errs,(label,errs);ctx.close()

          def google_flow(browser):
              ctx=browser.new_context(viewport={'width':1280,'height':900})
              page=ctx.new_page();errs=errors_for(page);load(page);close_overlays(page)
              page.locator('#profileChip').click();page.locator('#profileModal:not(.hidden)').wait_for(state='visible')
              page.locator('#profileModeLogin').click();page.locator('#googleLoginBtn').wait_for(state='visible',timeout=5000)
              origin_hit=[];page.on('request',lambda r:origin_hit.append(r.url) if '/api/auth/google' in r.url else None)
              target=''
              try:
                  with page.expect_popup(timeout=4000) as pi:page.locator('#googleLoginBtn').click()
                  pop=pi.value;pop.wait_for_load_state('domcontentloaded',timeout=15000);target=pop.url;pop.close()
              except PlaywrightTimeoutError:
                  page.wait_for_timeout(1500);target=page.url
              host=urlparse(target).netloc.casefold();googleish=('google.' in host or host.endswith('google.com') or host.endswith('accounts.google.com'))
              assert origin_hit or googleish,{'target':target,'origin_hit':origin_hit}
              summary['checks']['google_login']={'target':target,'oauthRequests':origin_hit,'errors':errs};ctx.close()

          def account_flow(browser):
              ctx=browser.new_context(viewport={'width':1280,'height':900})
              page=ctx.new_page();errs=errors_for(page);load(page);close_overlays(page)
              suffix=uuid.uuid4().hex[:7];name=('QA34'+suffix)[:24];password='Qa34!'+suffix+'Smoke'
              page.locator('#profileChip').click();page.locator('#profileModal:not(.hidden)').wait_for(state='visible')
              page.locator('#profileModeCreate').click();page.locator('#playerNameInput').fill(name);page.locator('#playerPasswordInput').fill(password);page.locator('#saveProfileBtn').click()
              wait_py(lambda:bool(page.evaluate("JSON.parse(localStorage.getItem('proplet-v2-profile')||'null')?.token")),15000,label='created account token')
              created=page.evaluate("JSON.parse(localStorage.getItem('proplet-v2-profile'))");assert created.get('token'),created
              page.evaluate("localStorage.removeItem('proplet-v2-profile')");page.reload(wait_until='domcontentloaded');page.wait_for_timeout(700);close_overlays(page)
              page.locator('#profileChip').click();page.locator('#profileModal:not(.hidden)').wait_for(state='visible')
              page.locator('#profileModeLogin').click();page.locator('#playerNameInput').fill(name);page.locator('#playerPasswordInput').fill(password);page.locator('#saveProfileBtn').click()
              wait_py(lambda:bool(page.evaluate("JSON.parse(localStorage.getItem('proplet-v2-profile')||'null')?.token")),15000,label='password login token')
              logged=page.evaluate("JSON.parse(localStorage.getItem('proplet-v2-profile'))");assert logged.get('token'),logged
              shot=f'{OUT}/account-login.png';page.screenshot(path=shot,full_page=True);summary['screenshots'].append(shot)
              app_errs=[e for e in errs if 'favicon' not in e.lower()];summary['checks']['account_create_password_login']={'name':name,'created':True,'loggedIn':True,'errors':app_errs};assert not app_errs,app_errs;ctx.close()

          def cell_for(page,idx,total):
              for attr in ('data-index','data-cell','data-cell-index','data-idx'):
                  loc=page.locator(f'#board [{attr}="{idx}"]')
                  if loc.count():return loc.first
              kids=page.locator('#board > *')
              if kids.count()==total:return kids.nth(idx)
              assert idx<kids.count(),{'idx':idx,'children':kids.count(),'total':total};return kids.nth(idx)

          def drag_path(page,path,total):
              locs=[cell_for(page,int(i),total) for i in path];boxes=[l.bounding_box() for l in locs];assert all(boxes),boxes
              pts=[(b['x']+b['width']/2,b['y']+b['height']/2) for b in boxes];page.mouse.move(*pts[0]);page.mouse.down()
              for pt in pts[1:]:page.mouse.move(*pt,steps=4)
              page.mouse.up();page.wait_for_timeout(180)

          def gameplay_calm(browser):
              ctx=browser.new_context(viewport={'width':1280,'height':900})
              page=ctx.new_page();errs=errors_for(page);load(page);close_overlays(page)
              page.locator('[data-nav="free"]').click();page.locator('#screen-free.active').wait_for(state='visible',timeout=5000)
              wait_py(lambda:bool(page.evaluate("typeof puzzleDB!=='undefined' && puzzleDB?.free?.easy?.length")),5000,label='Gen4 free bank')
              info=page.evaluate("()=>{const p=puzzleDB.free.easy[0];startGame(p,'free');return {id:p.id,gen:p.meta?.contentGeneration,rows:p.rows,cols:p.cols,answers:p.answers.map(a=>({word:a.word,path:a.path}))}}")
              assert info['gen']==4 and info['id']!='starter-v1',info;page.locator('#screen-game.active').wait_for(state='visible',timeout=5000)
              total=info['rows']*info['cols'];assert page.locator('#board > *').count()>0
              drag_path(page,info['answers'][0]['path'],total);wait_py(lambda:'zatím nic' not in page.locator('#foundWords').inner_text(),4000,label='first found word')
              progress_before=page.locator('#gameProgress').inner_text();assert progress_before and not progress_before.startswith('0 /'),progress_before
              page.locator('#calmRunBtn').click();page.wait_for_timeout(150)
              calm=page.evaluate("()=>({body:document.body.classList.contains('calm-run-v334'),timer:getComputedStyle(document.querySelector('#timer')).display,current:currentGame?.calmMode,button:document.querySelector('#calmRunBtn')?.classList.contains('hidden')})")
              assert calm['body'] and calm['timer']=='none' and calm['current'] is True and calm['button'],calm
              if len(info['answers'])>1:drag_path(page,info['answers'][1]['path'],total)
              progress_after=page.locator('#gameProgress').inner_text();assert progress_after!=progress_before,(progress_before,progress_after)
              shot=f'{OUT}/gen4-calm-game.png';page.screenshot(path=shot,full_page=True);summary['screenshots'].append(shot)
              app_errs=[e for e in errs if 'favicon' not in e.lower()];summary['checks']['gen4_gameplay_calm']={'puzzle':info['id'],'progressBeforeCalm':progress_before,'progressAfterCalm':progress_after,'calm':calm,'errors':app_errs};assert not app_errs,app_errs;ctx.close()

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,executable_path=CHROME,args=['--no-sandbox','--disable-dev-shm-usage'])
              try:
                  modal_viewport_check(browser,390,844,'mobile');modal_viewport_check(browser,820,1180,'tablet');modal_viewport_check(browser,1440,900,'desktop')
                  google_flow(browser);account_flow(browser);gameplay_calm(browser)
              finally:browser.close()
          summary['ok']=True
          with open(f'{OUT}/summary.json','w',encoding='utf-8') as f:json.dump(summary,f,ensure_ascii=False,indent=2)
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
          python /tmp/smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v334-preview-browser-smoke
          path: /tmp/proplet-browser-smoke/
          if-no-files-found: warn
          retention-days: 7
