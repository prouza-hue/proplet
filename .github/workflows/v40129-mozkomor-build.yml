name: v4.01.29 Mozkomor contract

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'data/puzzles.json'
      - 'public/puzzles.json'
      - 'data/gen4_profiles_v334.json'
      - 'data/audits/mozkomor_v40129.json'
      - 'public/app.js'
      - 'public/index.html'
      - 'public/styles.css'
      - 'server.py'
      - 'SUPABASE_MIGRATION_V4_01_29_MOZKOMOR.sql'
      - 'tools/generate_mozkomor_gen4.py'
      - 'tools/validate_mozkomor_v40129.py'
      - 'tools/test_mozkomor_v40129.py'
      - 'tools/test_mozkomor_client_v40129.js'
      - '.github/workflows/v40129-mozkomor-build.yml'

permissions:
  contents: write

concurrency:
  group: v40129-mozkomor-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    if: ${{ github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/v40129-mozkomor' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime test dependencies
        run: pip install -r requirements.txt

      - name: Normalize Mozkomor runtime metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source_path=Path('data/puzzles.json')
          public_path=Path('public/puzzles.json')
          source=json.loads(source_path.read_text(encoding='utf-8'))
          bank=list((source.get('free') or {}).get('mozkomor') or [])
          if len(bank)!=100:
              raise SystemExit(f'Expected 100 committed Mozkomor boards, got {len(bank)}')
          source['mozkomorGeneration']=4
          source['mozkomorUnlock']={
              'requiresDifficulty':'hardcore',
              'requiresCurrentBaseLevels':200,
              'persistentOnceEarned':True,
          }
          source['mozkomorPolicy']={
              'requiredLevels':100,
              'targetCooldown':12,
              'rollingContent':False,
          }
          free_policy=(source.get('targetCooldownPolicy') or {}).get('free') or {}
          free_policy.pop('mozkomor',None)
          rendered=json.dumps(source,ensure_ascii=False,separators=(',',':'))+'\n'
          source_path.write_text(rendered,encoding='utf-8')
          public_path.write_text(rendered,encoding='utf-8')
          PY

      - name: Syntax checks
        run: |
          python -m py_compile server.py tools/generate_mozkomor_gen4.py tools/validate_mozkomor_v40129.py tools/test_mozkomor_v40129.py
          node --check public/app.js
          node --check tools/test_mozkomor_client_v40129.js

      - name: Validate committed 100-level Mozkomor bank
        run: python tools/validate_mozkomor_v40129.py

      - name: Verify Mozkomor server progression
        run: python tools/test_mozkomor_v40129.py

      - name: Verify Mozkomor client UX
        run: node tools/test_mozkomor_client_v40129.js

      - name: Re-run complete Generation 4 release validator
        run: |
          python tools/validate_gen4_release.py data/puzzles.json \
            --rolling data/rolling_content_v1.json \
            --profiles data/gen4_profiles_v334.json \
            --exclusions data/target_generation_exclusions_v334.json \
            --strict-counts \
            --approved-release \
            --report /tmp/mozkomor-full-validation.json

      - uses: actions/upload-artifact@v4
        with:
          name: v40129-mozkomor-contract
          path: |
            data/audits/mozkomor_v40129.json
            /tmp/mozkomor-full-validation.json
          retention-days: 30
          if-no-files-found: error

      - name: Commit normalized metadata and audit back to preview branch
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/v40129-mozkomor' }}
        run: |
          git config user.name "proplet-contract-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/puzzles.json public/puzzles.json data/audits/mozkomor_v40129.json
          if git diff --cached --quiet; then
            echo "Mozkomor runtime metadata and audit already current."
            exit 0
          fi
          git commit -m "[mozkomor-contract] Normalize bank metadata and audit"
          git push origin "HEAD:${{ github.head_ref }}"
