name: v4.01.29 Mozkomor contract

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'data/puzzles.json'
      - 'public/puzzles.json'
      - 'data/gen4_profiles_v334.json'
      - 'data/audits/mozkomor_v40129.json'
      - 'public/app.js'
      - 'public/index.html'
      - 'public/styles.css'
      - 'server.py'
      - 'SUPABASE_MIGRATION_V4_01_29_MOZKOMOR.sql'
      - 'tools/generate_mozkomor_gen4.py'
      - 'tools/validate_mozkomor_v40129.py'
      - 'tools/test_mozkomor_v40129.py'
      - 'tools/test_mozkomor_client_v40129.js'
      - '.github/workflows/v40129-mozkomor-build.yml'

permissions:
  contents: read

concurrency:
  group: v40129-mozkomor-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    if: ${{ github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/v40129-mozkomor' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install runtime test dependencies
        run: pip install -r requirements.txt

      - name: Verify committed Mozkomor runtime metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source=json.loads(Path('data/puzzles.json').read_text(encoding='utf-8'))
          public=json.loads(Path('public/puzzles.json').read_text(encoding='utf-8'))
          bank=list((source.get('free') or {}).get('mozkomor') or [])
          public_bank=list((public.get('free') or {}).get('mozkomor') or [])
          assert len(bank)==100, f'Expected 100 committed Mozkomor boards, got {len(bank)}'
          assert len(public_bank)==100, f'Expected 100 public Mozkomor boards, got {len(public_bank)}'
          assert source.get('mozkomorGeneration')==4
          unlock=source.get('mozkomorUnlock') or {}
          assert unlock.get('requiresDifficulty')=='hardcore'
          assert int(unlock.get('requiresCurrentBaseLevels') or 0)==200
          assert unlock.get('persistentOnceEarned') is True
          policy=source.get('mozkomorPolicy') or {}
          assert int(policy.get('requiredLevels') or 0)==100
          assert int(policy.get('targetCooldown') or 0)==12
          assert policy.get('rollingContent') is False
          assert 'mozkomor' not in (((source.get('targetCooldownPolicy') or {}).get('free') or {}))
          assert public.get('mozkomorGeneration')==source.get('mozkomorGeneration')
          assert public.get('mozkomorUnlock')==source.get('mozkomorUnlock')
          assert public.get('mozkomorPolicy')==source.get('mozkomorPolicy')
          print('Committed Mozkomor runtime metadata: OK')
          PY

      - name: Syntax checks
        run: |
          python -m py_compile server.py tools/generate_mozkomor_gen4.py tools/validate_mozkomor_v40129.py tools/test_mozkomor_v40129.py
          node --check public/app.js
          node --check tools/test_mozkomor_client_v40129.js

      - name: Validate committed 100-level Mozkomor bank
        run: python tools/validate_mozkomor_v40129.py

      - name: Verify Mozkomor server progression
        run: python tools/test_mozkomor_v40129.py

      - name: Verify Mozkomor client UX
        run: node tools/test_mozkomor_client_v40129.js

      - name: Re-run complete Generation 4 release validator
        run: |
          python tools/validate_gen4_release.py data/puzzles.json \
            --rolling data/rolling_content_v1.json \
            --profiles data/gen4_profiles_v334.json \
            --exclusions data/target_generation_exclusions_v334.json \
            --strict-counts \
            --approved-release \
            --report /tmp/mozkomor-full-validation.json

      - uses: actions/upload-artifact@v6
        with:
          name: v40129-mozkomor-contract
          path: |
            data/audits/mozkomor_v40129.json
            /tmp/mozkomor-full-validation.json
          retention-days: 30
          if-no-files-found: error
