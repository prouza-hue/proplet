name: v4.01.32 Mozkomor assemble only # cooldown9 score-distribution diagnostic

on:
  push:
    branches:
      - agent/v40132-mozkomor-assemble-fix
    paths:
      - '.github/workflows/v40132-mozkomor-assemble-only.yml'

permissions:
  actions: read
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Reuse completed candidate artifacts
        uses: actions/download-artifact@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 33217108131
          pattern: v40132-mozkomor-candidates-*
          path: /tmp/mozkomor-candidates
          merge-multiple: true
      - name: Fetch audited historical candidate banks
        run: |
          git fetch origin agent/v40131-mozkomor-refresh:refs/remotes/origin/agent/v40131-mozkomor-refresh
          git fetch origin agent/v40129-mozkomor-fastgen:refs/remotes/origin/agent/v40129-mozkomor-fastgen
          git show origin/agent/v40131-mozkomor-refresh:data/puzzles.json > /tmp/mozkomor-refresh-source.json
          git show origin/agent/v40131-mozkomor-refresh:data/mozkomor_refresh_playtest.json > /tmp/mozkomor-approved-playtest.json
          git show origin/agent/v40129-mozkomor-fastgen:data/puzzles.json > /tmp/mozkomor-fastgen-source.json
      - name: Combine candidate pool
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path('/tmp/mozkomor-candidates').glob('shard-*.json'))
          assert len(files) == 8, files
          puzzles = []
          stats = []
          for shard, path in enumerate(files):
              payload = json.loads(path.read_text(encoding='utf-8'))
              stats.append(payload.get('stats') or {})
              for local, puzzle in enumerate(payload.get('puzzles') or [], 1):
                  puzzle['id'] = f"fresh-s{shard}-{local:03d}"
                  puzzle.setdefault('meta', {})['candidateShard'] = shard
                  puzzles.append(puzzle)
          assert len(puzzles) == 264, len(puzzles)
          fastgen = json.loads(Path('/tmp/mozkomor-fastgen-source.json').read_text(encoding='utf-8'))
          fast_bank = list((fastgen.get('free') or {}).get('mozkomor') or [])
          assert len(fast_bank) == 100, len(fast_bank)
          for local, puzzle in enumerate(fast_bank, 1):
              puzzle['id'] = f"historical-fastgen-{local:03d}"
              puzzle.setdefault('meta', {})['historicalCandidateSource'] = 'v40129-fastgen'
              puzzles.append(puzzle)
          assert len(puzzles) == 364, len(puzzles)
          Path('/tmp/mozkomor-candidate-pool.json').write_text(
              json.dumps({'version':1,'kind':'gen4-mozkomor-candidate-pool','puzzles':puzzles,'shardStats':stats},ensure_ascii=False,indent=2)+'\n',
              encoding='utf-8'
          )
          print('combined', len(puzzles))
          PY
      - name: Syntax preflight
        run: |
          python -m py_compile             tools/audit_mozkomor_human_v40131.py             tools/build_mozkomor_final_v40132.py             tools/test_mozkomor_final_v40132.py
      - name: Diagnose human-filter candidate pool
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import build_mozkomor_final_v40132 as b
          import audit_mozkomor_human_v40131 as human

          current=b.load(Path('data/puzzles.json'))
          refresh=b.load(Path('/tmp/mozkomor-refresh-source.json'))
          approved=b.load(Path('/tmp/mozkomor-approved-playtest.json'))
          generated=b.load(Path('/tmp/mozkomor-candidate-pool.json'))
          hardcore=list((current.get('free') or {}).get('hardcore') or [])
          old=list((refresh.get('free') or {}).get('mozkomor') or [])
          fresh=list(generated.get('puzzles') or [])
          approved_ids={
              str((p.get('meta') or {}).get('refreshSourceId') or '')
              for p in approved.get('puzzles') or []
              if float((p.get('meta') or {}).get('humanDecisionScore') or 0) >= b.APPROVED_ANCHOR_MIN_SCORE
          }
          tiers_payload=b.load(Path('data/answer_tiers.json'))
          tiers=tiers_payload.get('tiers') or {}
          tier_of={b.norm(word):tier for tier,words in tiers.items() for word in words}
          lexical={b.norm(word):value for word,value in (tiers_payload.get('metadata') or {}).items()}
          hrows=[human.initial_board_metrics(p,tier_of,lexical) for p in hardcore]
          pressures=[float(w['decisionPressure']) for r in hrows for w in r['words']]
          easy=human.percentile(pressures,0.25)
          hrows=[human.finish_board_metrics(r,easy) for r in hrows]
          hscores=[float(r['humanDecisionScore']) for r in hrows]
          rows=(
              b.annotate_rows(old,'refresh-original',tier_of,lexical,easy,hscores,approved_ids)+
              b.annotate_rows(fresh,'fresh-generated',tier_of,lexical,easy,hscores,approved_ids)
          )
          active={b.board_signature(p) for p in b.all_active_puzzles(current)}
          rows=[r for r in rows if r['_signature'] not in active]
          checks=[
              ('score>=2.60',lambda r: float(r['humanDecisionScore'])>=2.60),
              ('easyAnchor<=2',lambda r: int(r['easyAnchorCount'])<=2),
              ('longWordShare<=0.50',lambda r: float(r['longWordShare'])<=0.50),
              ('forcedLong<=3',lambda r: int(r['forcedLongWordCount'])<=3),
              ('averageFun>=3.20',lambda r: float(r['averageFun'])>=3.20),
              ('lowFun==0',lambda r: int(r['lowFunCount'])==0),
              ('verbAdjAdv<=1',lambda r: int(r['explicitVerbOrAdjectiveCount'])<=1),
              ('tierD<=1',lambda r: b.tier_d_count(r)<=1),
          ]
          print('TOTAL_NONACTIVE',len(rows))
          cur=rows
          for name,fn in checks:
              before=len(cur); cur=[r for r in cur if fn(r)]
              print('SEQUENTIAL',name,before,'->',len(cur),'lost',before-len(cur))
          print('FINAL_STRICT',len(cur))
          for name,fn in checks:
              fail=sum(not fn(r) for r in rows)
              print('INDEPENDENT_FAIL',name,fail)
          scores=sorted(float(r['humanDecisionScore']) for r in rows)
          for cutoff in (2.50,2.55,2.60,2.65,2.70,2.72,2.75,2.78,2.80,2.90,3.00):
              print('SCORE_COUNT',cutoff,sum(s>=cutoff for s in scores))
          # How many become available by relaxing exactly one strict lexical gate.
          base=[r for r in rows if
              float(r['humanDecisionScore'])>=2.60 and
              int(r['easyAnchorCount'])<=2 and
              float(r['longWordShare'])<=0.50 and
              int(r['forcedLongWordCount'])<=3 and
              b.tier_d_count(r)<=1
          ]
          print('STRUCTURAL_BASE',len(base))
          variants={
              'current': lambda r: float(r['averageFun'])>=3.20 and int(r['lowFunCount'])==0 and int(r['explicitVerbOrAdjectiveCount'])<=1,
              'fun>=3.10': lambda r: float(r['averageFun'])>=3.10 and int(r['lowFunCount'])==0 and int(r['explicitVerbOrAdjectiveCount'])<=1,
              'allow1LowFun': lambda r: float(r['averageFun'])>=3.20 and int(r['lowFunCount'])<=1 and int(r['explicitVerbOrAdjectiveCount'])<=1,
              'pos<=2': lambda r: float(r['averageFun'])>=3.20 and int(r['lowFunCount'])==0 and int(r['explicitVerbOrAdjectiveCount'])<=2,
              'fun3.10+low1': lambda r: float(r['averageFun'])>=3.10 and int(r['lowFunCount'])<=1 and int(r['explicitVerbOrAdjectiveCount'])<=1,
          }
          for name,fn in variants.items():
              print('VARIANT',name,sum(fn(r) for r in base))
          for cutoff in (2.70,2.72,2.75,2.78,2.80,2.90,3.00):
              hardbase=[r for r in base if float(r['humanDecisionScore'])>=cutoff]
              print('VARIANT_AT_SCORE',cutoff,'current',sum(variants['current'](r) for r in hardbase),'relaxed',sum(variants['fun3.10+low1'](r) for r in hardbase),'structural',len(hardbase))
          for lo,hi in ((2.72,3.00),(2.78,3.10),(2.84,3.20),(2.92,3.35),(3.00,9.99)):
              band=[r for r in base if lo<=float(r['humanDecisionScore'])<=hi]
              print('BAND_POOL',lo,hi,'current',sum(variants['current'](r) for r in band),'relaxed',sum(variants['fun3.10+low1'](r) for r in band),'structural',len(band))
          PY
      - name: Select final human-calibrated 100
        run: |
          python tools/build_mozkomor_final_v40132.py             --current data/puzzles.json             --refresh /tmp/mozkomor-refresh-source.json             --approved /tmp/mozkomor-approved-playtest.json             --generated /tmp/mozkomor-candidate-pool.json             --output data/mozkomor_final_v40132.json             --report data/audits/mozkomor_final_v40132.json
      - name: Cheap final-bank contract
        run: python tools/test_mozkomor_final_v40132.py
      - name: Full Generation 4 validation against current main content
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          current = json.loads(Path('data/puzzles.json').read_text(encoding='utf-8'))
          final = json.loads(Path('data/mozkomor_final_v40132.json').read_text(encoding='utf-8'))
          current.setdefault('free', {})['mozkomor'] = final['puzzles']
          Path('/tmp/puzzles-with-final-mozkomor.json').write_text(
              json.dumps(current, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )
          PY
          python tools/validate_gen4_release.py /tmp/puzzles-with-final-mozkomor.json \
            --rolling data/rolling_content_v1.json \
            --profiles data/gen4_profiles_v334.json \
            --exclusions data/target_generation_exclusions_v334.json \
            --approved-release \
            --report /tmp/mozkomor-final-full-validation.json
      - uses: actions/upload-artifact@v6
        with:
          name: v40132-mozkomor-final-bank-assemble-fix
          path: |
            data/mozkomor_final_v40132.json
            data/audits/mozkomor_final_v40132.json
            /tmp/mozkomor-final-full-validation.json
          retention-days: 30
          if-no-files-found: error
      - name: Commit selected bank
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mozkomor_final_v40132.json data/audits/mozkomor_final_v40132.json
          git commit -m "Generate human-calibrated Mozkomor final bank [mozkomor-generated]"
          git push origin HEAD:agent/v40132-mozkomor-assemble-fix
