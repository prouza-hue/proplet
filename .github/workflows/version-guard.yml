name: Proplet version guard

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

jobs:
  version-alignment:
    if: startsWith(github.event.pull_request.title, 'Proplet v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release runtime metadata
        shell: bash
        run: |
          set -euo pipefail
          title='${{ github.event.pull_request.title }}'
          expected=$(printf '%s' "$title" | sed -nE 's/^Proplet v([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')
          if [ -z "$expected" ]; then
            echo "::error::Release PR title must start with Proplet vX.Y.Z"
            exit 1
          fi

          canonical=$(sed -nE 's/^APP_VERSION = "([^"]+)"/\1/p' proplet_version.py | head -n1)
          runtime=$(sed -nE "s/.*version:'([^']+)'.*/\1/p" public/runtime-meta.js | head -n1)
          sw=$(sed -nE "s/.*proplet-v([0-9]+\.[0-9]+\.[0-9]+).*/\1/p" public/sw.js | head -n1)

          echo "PR version:        $expected"
          echo "Canonical version: $canonical"
          echo "Browser runtime:   $runtime"
          echo "SW cache version:  $sw"

          for value in "$canonical" "$runtime" "$sw"; do
            if [ "$value" != "$expected" ]; then
              echo "::error::Release metadata is not aligned to $expected"
              exit 1
            fi
          done

          grep -Fq 'from proplet_version import (' backend/config.py || {
            echo "::error file=backend/config.py::Backend config must import canonical release metadata"
            exit 1
          }
          grep -Fq 'APP_VERSION as RELEASE_VERSION' backend/config.py || {
            echo "::error file=backend/config.py::Backend config must map canonical APP_VERSION"
            exit 1
          }
          grep -Fq 'APP_VERSION = settings.app_version' backend/config.py || {
            echo "::error file=backend/config.py::Backend config must expose APP_VERSION from settings"
            exit 1
          }
          grep -Fq 'from backend.config import (' server.py && grep -Fq '    APP_VERSION,' server.py || {
            echo "::error file=server.py::Backend entrypoint must use backend.config APP_VERSION"
            exit 1
          }
          grep -Fq "const APP_VERSION=window.PROPLET_RUNTIME_META?.version" public/app.js || {
            echo "::error file=public/app.js::Client APP_VERSION must derive from browser runtime metadata"
            exit 1
          }
          grep -Fq '"orientationBlocking": PHONE_LANDSCAPE_BLOCKING' server.py || {
            echo "::error file=server.py::Health orientation marker must use canonical runtime metadata"
            exit 1
          }
          grep -Fq '"tabletGameLayoutBreakpointPx": TABLET_LANDSCAPE_BREAKPOINT_PX' server.py || {
            echo "::error file=server.py::Health Fold breakpoint must use canonical runtime metadata"
            exit 1
          }
