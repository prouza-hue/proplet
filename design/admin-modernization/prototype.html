<!doctype html>
<html lang="cs" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <title>Proplet — návrh administrace</title>
  <link rel="stylesheet" href="prototype.css">
</head>
<body>
  <div class="preview-notice">Návrh administrace <span>• ukázková data • bez spojení s produkcí</span></div>
  <header class="app-header">
    <a class="brand" href="#prehled" aria-label="Proplet, přehled administrace">Proplet<span>administrace</span></a>
    <div class="header-actions"><span class="owner">Přístup pouze pro vlastníka</span><button id="themeToggle" type="button" aria-pressed="false">Tmavý vzhled</button></div>
  </header>
  <div class="app-layout">
    <aside>
      <nav aria-label="Administrace" id="navigation">
        <button data-view="overview" aria-current="page">Přehled</button>
        <button data-view="players">Hráči a týmy</button>
        <button data-view="reports">Hlášení <span class="nav-count">4</span></button>
        <button data-view="content">Obsah a kvalita</button>
        <button data-view="operations">Provoz</button>
        <button data-view="analytics">Analytika</button>
        <button data-view="audit">Historie</button>
      </nav>
      <div class="sidebar-note"><strong>Lokální návrh</strong><span>Ukázkový den 28. 10. 2026</span><span>Připraveno 29. 10. 2026</span><span>Veškeré akce jsou simulované.</span></div>
    </aside>
    <main id="mainContent"></main>
  </div>
  <dialog id="playerDialog" aria-labelledby="playerDialogTitle"><div id="playerDialogContent"></div></dialog>
  <div id="statusMessage" class="status-message" role="status" aria-live="polite"></div>
  <script src="prototype.js"></script>
</body>
</html>
