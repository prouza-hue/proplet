<!doctype html><html lang="cs"><meta charset="utf-8"><title>Proplet — kontrola rozložení</title><style>body{margin:12px;background:#bbb;font:14px system-ui}nav{margin-bottom:12px;display:flex;gap:8px}button{padding:8px}iframe{display:block;border:0;background:#fff;width:360px;height:780px}</style><nav><button data-w="360" data-h="780">Mobil 360 × 780</button><button data-w="690" data-h="600">Fold 690 × 600</button><button data-w="1024" data-h="768">Tablet 1024 × 768</button><button id="result">Ukázkový výsledek</button></nav><iframe title="Proplet preview" src="about:blank" id="game"></iframe><script>fetch("/").then(r=>r.text()).then(html=>document.querySelector("iframe").srcdoc=html);document.querySelectorAll('button[data-w]').forEach(b=>b.onclick=()=>{const f=document.querySelector('iframe');f.style.width=b.dataset.w+'px';f.style.height=b.dataset.h+'px'});document.querySelector('#result').onclick=()=>{const w=document.querySelector('iframe').contentWindow,d=w.document;d.querySelector('#onboardingModal').classList.add('hidden');d.querySelector('#winModal').classList.remove('hidden');d.querySelector('#winXp').textContent='+100 XP';w.renderDailyGlobalLeaderboardBox(d.querySelector('#levelLeaderboardBox'),{total:2,myRank:1,topPercent:50,rows:[{rank:1,avatar:'🦊',name:'Ukázkový hráč',isMine:true,cleanSolve:true,moves:7,elapsedMs:23000},{rank:2,avatar:'🦉',name:'Druhý hráč',cleanSolve:true,moves:8,elapsedMs:31000}]});};</script></html>
