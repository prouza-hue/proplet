<!doctype html><html lang="cs"><meta charset="utf-8"><title>Proplet — kontrola rozložení</title><style>body{margin:12px;background:#bbb;font:14px system-ui}nav{margin-bottom:12px;display:flex;gap:8px}button{padding:8px}iframe{display:block;border:0;background:#fff;width:360px;height:780px}</style><nav><button data-w="360" data-h="780">Mobil 360 × 780</button><button data-w="690" data-h="600">Fold 690 × 600</button><button data-w="1024" data-h="768">Tablet 1024 × 768</button></nav><iframe title="Proplet preview" src="/" id="game"></iframe><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{const f=document.querySelector('iframe');f.style.width=b.dataset.w+'px';f.style.height=b.dataset.h+'px'});</script></html>
