<!doctype html>
<html lang="cs" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Proplet · návrh hodnosti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="rank-spotlight.css">
  <script src="rank-spotlight.js" defer></script>
</head>
<body>
  <div class="preview-shell">
    <header class="preview-toolbar">
      <strong>Návrh hodnosti</strong>
      <div class="preview-options" role="group" aria-label="Šířka zobrazení">
        <button data-size="390" aria-pressed="false">Mobil</button>
        <button data-size="768" aria-pressed="false">Fold / tablet</button>
        <button data-size="1100" aria-pressed="true">Desktop</button>
      </div>
      <button id="themeToggle" aria-pressed="false">Světlý vzhled</button>
    </header>
    <p class="preview-note">Jen návrh části „Tvůj postup“ · ukázkové údaje</p>
    <iframe id="previewFrame" title="Návrh karty Tvůj postup" loading="eager"></iframe>
  </div>
  <main class="card-stage" hidden>
    <section class="progress-card" aria-labelledby="progressHeading">
      <header class="section-heading">
        <h1 id="progressHeading">Tvůj postup</h1>
        <a href="https://hrajproplet.cz/index.html?open=leaderboard" target="_blank" rel="noopener">Celkové pořadí <span aria-hidden="true">→</span></a>
      </header>
      <div class="rank-hero">
        <div class="rank-art"><img src="/rewards/printshop/rank-23.svg" alt="" width="160" height="160"></div>
        <div class="rank-copy">
          <h2>Král mřížky</h2>
          <div class="rank-track" role="progressbar" aria-label="Postup k hodnosti Propletový titán" aria-valuemin="0" aria-valuemax="2500" aria-valuenow="1619" aria-valuetext="Do další hodnosti zbývá 881 XP"><span></span></div>
          <p class="rank-next"><strong>881 XP <span aria-hidden="true">→</span></strong> <span>Propletový titán</span></p>
        </div>
      </div>
      <dl class="metrics">
        <div><dt>Celkem XP</dt><dd>34 119</dd></div>
        <div><dt>V pořadí</dt><dd>7. <span>místo</span></dd></div>
        <div><dt>Denní série</dt><dd><img src="/rewards/printshop/symbol-streak.svg" alt="" width="28" height="32">36 <span>dní</span></dd></div>
      </dl>
    </section>
  </main>
</body>
</html>
