<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Proplet – česká slovní hra</title>
  <desc id="desc">Hravá fialová karta s logem Propletu a mřížkou, ve které tři barevné cesty opravdu tvoří slova PROPLET, ZÁBAVNÉ a HRAJ.</desc>
  <defs>
    <linearGradient id="bg" x1="70" y1="20" x2="1130" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F9F6FF"/>
      <stop offset="1" stop-color="#EDE8FF"/>
    </linearGradient>
    <linearGradient id="purple" x1="135" y1="128" x2="400" y2="407" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6556DF"/>
      <stop offset="1" stop-color="#8B75F4"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#493B82" flood-opacity=".18"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#493B82" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1110" cy="76" r="190" fill="#DCD4FF" opacity=".52"/>
  <circle cx="102" cy="602" r="205" fill="#CFEFE4" opacity=".72"/>
  <path d="M0 504C184 436 315 581 484 518C630 464 711 396 866 445C1018 493 1094 452 1200 394V630H0Z" fill="#FFFFFF" opacity=".42"/>

  <g filter="url(#shadow)">
    <rect x="112" y="121" width="274" height="274" rx="82" fill="url(#purple)" transform="rotate(-3 249 258)"/>
    <path d="M191 344V177h78c52 0 82 27 82 70 0 45-32 72-86 72h-19v25h-55zm55-70h21c20 0 31-9 31-27 0-16-11-25-31-25h-21v52z" fill="#fff"/>
    <circle cx="371" cy="136" r="40" fill="#FFD66B" stroke="#F9F6FF" stroke-width="10"/>
  </g>

  <text x="106" y="486" fill="#25243A" font-family="DejaVu Sans, Arial, sans-serif" font-size="80" font-weight="800" letter-spacing="-4">Proplet</text>
  <text x="111" y="534" fill="#68647A" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="600">Česká slovní hra, která umí</text>
  <text x="111" y="570" fill="#5D4ED0" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="800">příjemně zamotat hlavu.</text>

