    <rect x="-34" y="-34" width="460" height="460" rx="62" fill="#FFFEFD" stroke="#E4DDF0" stroke-width="3"/>
    <g fill="#FFFFFF" stroke="#DCD5E8" stroke-width="2">
      <rect x="0" y="0" width="68" height="68" rx="18"/><rect x="80" y="0" width="68" height="68" rx="18"/><rect x="160" y="0" width="68" height="68" rx="18"/><rect x="240" y="0" width="68" height="68" rx="18"/><rect x="320" y="0" width="68" height="68" rx="18"/>
      <rect x="0" y="80" width="68" height="68" rx="18"/><rect x="80" y="80" width="68" height="68" rx="18"/><rect x="160" y="80" width="68" height="68" rx="18"/><rect x="240" y="80" width="68" height="68" rx="18"/><rect x="320" y="80" width="68" height="68" rx="18"/>
      <rect x="0" y="160" width="68" height="68" rx="18"/><rect x="80" y="160" width="68" height="68" rx="18"/><rect x="160" y="160" width="68" height="68" rx="18"/><rect x="240" y="160" width="68" height="68" rx="18"/><rect x="320" y="160" width="68" height="68" rx="18"/>
      <rect x="0" y="240" width="68" height="68" rx="18"/><rect x="80" y="240" width="68" height="68" rx="18"/><rect x="160" y="240" width="68" height="68" rx="18"/><rect x="240" y="240" width="68" height="68" rx="18"/><rect x="320" y="240" width="68" height="68" rx="18"/>
      <rect x="0" y="320" width="68" height="68" rx="18"/><rect x="80" y="320" width="68" height="68" rx="18"/><rect x="160" y="320" width="68" height="68" rx="18"/><rect x="240" y="320" width="68" height="68" rx="18"/><rect x="320" y="320" width="68" height="68" rx="18"/>
    </g>
    <path d="M34 34H114V114H194V194H274V274" fill="none" stroke="#8B7CF5" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>
    <path d="M34 114V194H114V274H194V354H274" fill="none" stroke="#55CFA7" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" opacity=".58"/>
    <path d="M274 34H354V114V194" fill="none" stroke="#FF816F" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>
    <g fill="#25243A" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="800" text-anchor="middle">
      <text x="34" y="45">P</text><text x="114" y="45">R</text><text x="194" y="45">S</text><text x="274" y="45">H</text><text x="354" y="45">R</text>
      <text x="34" y="125">Z</text><text x="114" y="125">O</text><text x="194" y="125">P</text><text x="274" y="125">Í</text><text x="354" y="125">A</text>
      <text x="34" y="205">Á</text><text x="114" y="205">B</text><text x="194" y="205">L</text><text x="274" y="205">E</text><text x="354" y="205">J</text>
      <text x="34" y="285">M</text><text x="114" y="285">A</text><text x="194" y="285">V</text><text x="274" y="285">T</text><text x="354" y="285">O</text>
      <text x="34" y="365">S</text><text x="114" y="365">K</text><text x="194" y="365">N</text><text x="274" y="365">É</text><text x="354" y="365">!</text>
    </g>
  </g>

  <g transform="translate(1006 523) rotate(7)">
    <rect width="132" height="54" rx="27" fill="#FFD66B"/>
    <text x="66" y="36" text-anchor="middle" fill="#554516" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="800">HRAJ ↓</text>
  </g>
